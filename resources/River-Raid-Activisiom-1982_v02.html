<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>River Raid (1982) - Plotly.js Otimizado</title>
    <!-- Script local do Plotly.js -->
    <script src="plotly-3.7.0.min.js"></script>

    <style>
        .river-container {
            background-color: #000000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            border-radius: 8px;
        }
        .river-placar {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 24px;
            color: #ffee00;
        }
        .river-canvas {
            width: 100%;
            max-width: 500px;
            height: 600px;
            margin: 0 auto;
            background-color: #000000;
            border: 2px solid #00ffcc;
            border-radius: 4px;
        }
        .river-info {
            margin-top: 10px;
            color: #888888;
            font-size: 13px;
        }
        .river-painel {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .river-btn {
            background-color: #000000;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 12px;
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .river-btn:hover { background-color: #00ffcc; color: #000000; }
        .river-btn.active { background-color: #00ffcc; color: #000000; }
        .river-label { font-size: 12px; color: #ffea00; }
    </style>
</head>
<body>

    <div class="river-container">
        <h1>🛩️ RIVER RAID (Activision, 1982)</h1>

        <!-- PAINEL DE CONTROLES -->
        <div class="river-painel">
            <button class="river-btn" onclick="window.reiniciarRiverRaid()">🔄 NOVO JOGO</button>
            
            <span class="river-label">⚡ VELOCIDADE:</span>
            <button class="river-btn btn-velocidade-rr" data-vel="0.5" onclick="window.setVelocidadeRR(0.5)">0.5x</button>
            <button class="river-btn btn-velocidade-rr active" data-vel="1.0" onclick="window.setVelocidadeRR(1.0)">1.0x</button>
            <button class="river-btn btn-velocidade-rr" data-vel="1.5" onclick="window.setVelocidadeRR(1.5)">1.5x</button>
            <button class="river-btn btn-velocidade-rr" data-vel="2.0" onclick="window.setVelocidadeRR(2.0)">2.0x 🔥</button>

            <span class="river-label">⛽ TANQUE:</span>
            <button id="btn-fuel-rr" class="river-btn" onclick="window.toggleTanqueRR()">MODO: NORMAL</button>
        </div>

        <div id="river-placar" class="river-placar">Carregando turbinas...</div>
        <div id="river-game-plot" class="river-canvas"></div>
        <div class="river-info">
            Controles: <b>← / →</b> (Mover) | <b>↑</b> (Acelerar) | <b>↓</b> (Frear) | <b>Espaço</b> (Atirar)
        </div>
    </div>

    <script>
    (function() {
        const GRID_W = 100;
        const GRID_H = 120;
        const FPS = 25; // FPS ajustado para melhor estabilidade no Plotly
        const DT = 1 / FPS;

        let fatorVelocidade = 1.0;
        let consumoTanqueReduzido = false;

        let player = { x: 50, y: 15, width: 6, height: 6 };
        let bullets = [];
        let enemies = [];
        let riverWidth = 55;
        let riverX = 22.5;

        let fuel = 100;
        let score = 0;
        let lives = 3;
        let jogando = false;
        let gameFrame = 0;
        let loopInterval = null;
        let plotInicializado = false;

        const keysPressed = {};

        window.setVelocidadeRR = function(fator) {
            fatorVelocidade = fator;
            document.querySelectorAll('.btn-velocidade-rr').forEach(btn => {
                let val = parseFloat(btn.getAttribute('data-vel'));
                if (val === fator) btn.classList.add('active');
                else btn.classList.remove('active');
                btn.blur();
            });
        };

        window.toggleTanqueRR = function() {
            consumoTanqueReduzido = !consumoTanqueReduzido;
            let btn = document.getElementById('btn-fuel-rr');
            if (btn) {
                btn.innerHTML = `MODO: ${consumoTanqueReduzido ? 'ECONÔMICO (2x) ⚡' : 'NORMAL'}`;
                btn.blur();
            }
        };

        function resetarJogador() {
            player.x = riverX + riverWidth / 2 - player.width / 2;
            player.y = 15;
            fuel = 100;
            bullets = [];
            enemies = [];
        }

        function iniciarJogo() {
            if (typeof Plotly === 'undefined') {
                document.getElementById('river-placar').innerHTML = "<span style='color:red'>ERRO: Plotly.js não foi carregado!</span>";
                return;
            }

            score = 0;
            lives = 3;
            jogando = true;
            gameFrame = 0;
            plotInicializado = false;

            resetarJogador();

            if (loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(gameLoop, 1000 / FPS);
        }

        window.reiniciarRiverRaid = iniciarJogo;

        function spawnInimigo() {
            const rand = Math.random();
            const type = rand < 0.25 ? 2 : (rand < 0.65 ? 0 : 1);
            const margin = 5;
            const w = type === 2 ? 7 : 6;
            const x = riverX + margin + Math.random() * (riverWidth - margin * 2 - w);

            enemies.push({
                x: x,
                y: GRID_H + 5,
                width: w,
                height: 4,
                type: type,
                speedX: type === 1 ? (Math.random() < 0.5 ? 0.4 : -0.4) : 0
            });
        }

        function atualizarFisica() {
            if (!jogando) return;

            gameFrame++;

            let speedMult = 1.0;
            if (keysPressed['ArrowUp']) speedMult = 1.6;
            else if (keysPressed['ArrowDown']) speedMult = 0.6;

            let dtEfetivo = DT * fatorVelocidade * speedMult;
            let scrollSpeed = 35 * dtEfetivo;

            let taxaConsumo = consumoTanqueReduzido ? 0.08 : 0.16;
            fuel -= taxaConsumo * speedMult * fatorVelocidade;
            if (fuel <= 0) {
                fuel = 0;
                abaterJogador();
                return;
            }

            let lateralSpeed = 45 * DT * fatorVelocidade;
            if (keysPressed['ArrowLeft']) player.x -= lateralSpeed;
            if (keysPressed['ArrowRight']) player.x += lateralSpeed;

            let margemEsquerda = riverX;
            let margemDireita = riverX + riverWidth;
            if (player.x < margemEsquerda || player.x + player.width > margemDireita) {
                abaterJogador();
                return;
            }

            if ((keysPressed['Space'] || keysPressed['KeyZ']) && gameFrame % 6 === 0) {
                bullets.push({
                    x: player.x + player.width / 2 - 0.5,
                    y: player.y + player.height,
                    width: 1,
                    height: 4
                });
            }

            for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                let b = bullets[bIndex];
                b.y += 90 * DT;
                if (b.y > GRID_H) bullets.splice(bIndex, 1);
            }

            if (gameFrame % Math.max(12, Math.floor(35 / (speedMult * fatorVelocidade))) === 0) {
                spawnInimigo();
            }

            riverX = 22.5 + Math.sin(gameFrame * 0.03) * 12;

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y -= scrollSpeed;
                e.x += e.speedX;

                if (e.type === 1) {
                    if (e.x < riverX + 2 || e.x + e.width > riverX + riverWidth - 2) {
                        e.speedX *= -1;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x < e.x + e.width && b.x + b.width > e.x &&
                        b.y < e.y + e.height && b.y + b.height > e.y) {

                        if (e.type === 0) score += 30;
                        else if (e.type === 1) score += 60;
                        else if (e.type === 2) score += 80;

                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (!enemies[i]) continue;

                if (player.x < e.x + e.width && player.x + player.width > e.x &&
                    player.y < e.y + e.height && player.y + player.height > e.y) {

                    if (e.type === 2) {
                        fuel = Math.min(100, fuel + 1.2);
                    } else {
                        abaterJogador();
                        return;
                    }
                }

                if (e.y < -10) {
                    enemies.splice(i, 1);
                }
            }
        }

        function abaterJogador() {
            lives--;
            if (lives <= 0) {
                jogando = false;
            } else {
                resetarJogador();
            }
        }

        function renderizar() {
            let placarEl = document.getElementById('river-placar');
            let plotTarget = document.getElementById('river-game-plot');

            if (placarEl) {
                placarEl.innerHTML = `PONTOS: ${score} &nbsp;&nbsp;|&nbsp;&nbsp; COMBUSTÍVEL: ${Math.floor(fuel)}% &nbsp;&nbsp;|&nbsp;&nbsp; VIDAS: ${"✈️ ".repeat(Math.max(0, lives))}`;
            }

            let shapes = [];

            // Grama Lateral
            shapes.push({
                type: 'rect', x0: 0, y0: 0, x1: GRID_W, y1: GRID_H,
                fillcolor: '#008800', line: { width: 0 }
            });

            // Leito do Rio
            shapes.push({
                type: 'rect', x0: riverX, y0: 0, x1: riverX + riverWidth, y1: GRID_H,
                fillcolor: '#0055ff', line: { width: 0 }
            });

            // Margens de Terra
            shapes.push({
                type: 'rect', x0: riverX - 1.5, y0: 0, x1: riverX, y1: GRID_H,
                fillcolor: '#ccaa00', line: { width: 0 }
            });
            shapes.push({
                type: 'rect', x0: riverX + riverWidth, y0: 0, x1: riverX + riverWidth + 1.5, y1: GRID_H,
                fillcolor: '#ccaa00', line: { width: 0 }
            });

            // Tiros
            bullets.forEach(b => {
                shapes.push({
                    type: 'rect', x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height,
                    fillcolor: '#ffffff', line: { width: 0 }
                });
            });

            // Inimigos e Fuel
            enemies.forEach(e => {
                let color = e.type === 0 ? '#cc0000' : (e.type === 1 ? '#ffcc00' : '#ffffff');
                shapes.push({
                    type: 'rect', x0: e.x, y0: e.y, x1: e.x + e.width, y1: e.y + e.height,
                    fillcolor: color, line: { color: '#000000', width: e.type === 2 ? 1 : 0 }
                });
            });

            // Jato (Desenhado como um polígono contínuo para evitar que partes "pisquem")
            if (jogando) {
                let px = player.x;
                let py = player.y;
                let pw = player.width;
                let ph = player.height;

                shapes.push({
                    type: 'path',
                    path: `M ${px + pw*0.5} ${py + ph} L ${px + pw*0.7} ${py + ph*0.6} L ${px + pw} ${py + ph*0.4} L ${px + pw} ${py + ph*0.25} L ${px + pw*0.65} ${py + ph*0.25} L ${px + pw*0.65} ${py} L ${px + pw*0.35} ${py} L ${px + pw*0.35} ${py + ph*0.25} L ${px} ${py + ph*0.25} L ${px} ${py + ph*0.4} L ${px + pw*0.3} ${py + ph*0.6} Z`,
                    fillcolor: '#ffea00',
                    line: { width: 0 }
                });
            }

            let annotations = [];
            enemies.forEach(e => {
                if (e.type === 2) {
                    annotations.push({
                        x: e.x + e.width / 2, y: e.y + e.height / 2,
                        text: '<b>FUEL</b>',
                        font: { size: 10, color: '#000000', family: 'Courier New' },
                        showarrow: false
                    });
                }
            });

            if (!jogando) {
                annotations.push({
                    x: GRID_W / 2, y: GRID_H / 2,
                    text: lives <= 0 ? "GAME OVER" : "CLIQUE EM NOVO JOGO",
                    font: { size: 26, color: '#ff0055', family: 'Courier New' },
                    showarrow: false
                });
            }

            let layout = {
                xaxis: { range: [0, GRID_W], showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { range: [0, GRID_H], showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: '#000000',
                paper_bgcolor: '#000000',
                margin: { t: 5, b: 5, l: 5, r: 5 },
                shapes: shapes,
                annotations: annotations
            };

            if (plotTarget && typeof Plotly !== 'undefined') {
                if (!plotInicializado) {
                    Plotly.newPlot(plotTarget, [], layout, { staticPlot: true, responsive: true });
                    plotInicializado = true;
                } else {
                    Plotly.relayout(plotTarget, layout);
                }
            }
        }

        function gameLoop() {
            atualizarFisica();
            renderizar();
        }

        window.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code) || e.key === " ") {
                e.preventDefault();
            }
            keysPressed[e.code] = true;
            if (e.key === " ") keysPressed['Space'] = true;
        });

        window.addEventListener('keyup', (e) => {
            keysPressed[e.code] = false;
            if (e.key === " ") keysPressed['Space'] = false;
        });

        function checarELancar() {
            if (typeof Plotly !== 'undefined') {
                iniciarJogo();
            } else {
                setTimeout(checarELancar, 200);
            }
        }

        checarELancar();
    })();
    </script>
</body>
</html>
