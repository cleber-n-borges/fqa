<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Frogger 1981 - Plotly.js (Configurável)</title>
    <!-- Script local mantido -->
    <script src="plotly-3.7.0.min.js"></script>

    <style>
        .frg-container {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            border-radius: 8px;
        }
        .frg-placar {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 24px;
            color: #ffffff;
        }
        .frg-canvas {
            width: 100%;
            max-width: 600px;
            height: 650px;
            margin: 0 auto;
            background-color: #000000;
            border: 2px solid #00ff00;
            border-radius: 4px;
        }
        .frg-info {
            margin-top: 10px;
            color: #888888;
            font-size: 13px;
        }
        .frg-painel {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .frg-btn {
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 6px 12px;
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .frg-btn:hover { background-color: #00ff00; color: #000000; }
        .frg-btn.active { background-color: #00ff00; color: #000000; }
        .frg-label { font-size: 12px; color: #ffea00; }
    </style>
</head>
<body>

    <div class="frg-container">
        <h1>🐸 FROGGER (Sega, 1981)</h1>

        <!-- PAINEL DE CONTROLES E PARÂMETROS -->
        <div class="frg-painel">
            <button class="frg-btn" onclick="window.reiniciarFrogger()">🔄 NOVO JOGO</button>
            
            <span class="frg-label">🏎️ VELOCIDADE:</span>
            <button class="frg-btn btn-velocidade" data-vel="0.5" onclick="window.setVelocidade(0.5)">0.5x</button>
            <button class="frg-btn btn-velocidade active" data-vel="1.0" onclick="window.setVelocidade(1.0)">1.0x</button>
            <button class="frg-btn btn-velocidade" data-vel="1.5" onclick="window.setVelocidade(1.5)">1.5x</button>
            <button class="frg-btn btn-velocidade" data-vel="2.0" onclick="window.setVelocidade(2.0)">2.0x 🔥</button>

            <span class="frg-label">🪵 TRONCOS:</span>
            <button id="btn-tronco" class="frg-btn" onclick="window.toggleTamanhoTroncos()">TAMANHO: NORMAL</button>
        </div>

        <div id="frg-placar" class="frg-placar">Preparando sapo...</div>
        <div id="frg-game-plot" class="frg-canvas"></div>
        <div class="frg-info">
            Controles: <b>← / ↑ / → / ↓</b> (Pular com o Sapo)
        </div>
    </div>

    <script>
    (function() {
        const GRID_W = 100;
        const GRID_H = 130;
        const FPS = 30;
        const DT = 1 / FPS;

        // --- PARÂMETROS CONFIGURÁVEIS ---
        let fatorVelocidade = 1.0;
        let tamTroncoMultiplicador = 1.0;
        
        let sapo = { x: 50, y: 5 };
        let pontuacao = 0;
        let vidas = 3;
        let jogando = false;
        let loopInterval = null;
        let ninhosOcupados = [false, false, false, false, false];

        let obstaculos = [];

        function resetarSapo() {
            sapo = { x: 50, y: 5 };
        }

        // --- CONTROLE DE VELOCIDADE CORRIGIDO (APENAS 1 BOTÃO ATIVO) ---
        window.setVelocidade = function(fator) {
            fatorVelocidade = fator;
            
            // Atualiza visualmente a classe 'active' garantindo exclusividade
            let botoes = document.querySelectorAll('.btn-velocidade');
            botoes.forEach(btn => {
                let val = parseFloat(btn.getAttribute('data-vel'));
                if (val === fator) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
                btn.blur(); // Remove o foco do clique para não atrapalhar o teclado
            });
        };

        window.toggleTamanhoTroncos = function() {
            tamTroncoMultiplicador = tamTroncoMultiplicador === 1.0 ? 1.5 : 1.0;
            let btn = document.getElementById('btn-tronco');
            if (btn) {
                btn.innerHTML = `TAMANHO: ${tamTroncoMultiplicador === 1.5 ? 'GIGANTE 🪵' : 'NORMAL'}`;
                btn.blur();
            }
            criarObstaculos();
        };

        function criarObstaculos() {
            let m = tamTroncoMultiplicador;
            obstaculos = [
                // RUA
                { y: 15, vel: -20, largura: 12, tipo: 'carro', cor: '#ff0055', itens: [20, 60, 95] },
                { y: 25, vel: 25,  largura: 10, tipo: 'carro', cor: '#00e5ff', itens: [10, 50, 85] },
                { y: 35, vel: -18, largura: 14, tipo: 'caminhao', cor: '#ffea00', itens: [15, 70] },
                { y: 45, vel: 30,  largura: 8,  tipo: 'carro', cor: '#ff0000', itens: [5, 40, 75] },
                { y: 55, vel: -22, largura: 12, tipo: 'caminhao', cor: '#a855f7', itens: [30, 80] },

                // RIO
                { y: 75,  vel: -15, largura: 18 * m, tipo: 'tronco', cor: '#8b5a2b', itens: [10, 50, 85] },
                { y: 85,  vel: 20,  largura: 14 * m, tipo: 'tartaruga', cor: '#00ff88', itens: [15, 45, 75] },
                { y: 95,  vel: -28, largura: 25 * m, tipo: 'tronco', cor: '#8b5a2b', itens: [20, 75] },
                { y: 105, vel: 16,  largura: 12 * m, tipo: 'tartaruga', cor: '#00ff88', itens: [10, 40, 70, 95] },
                { y: 115, vel: -18, largura: 20 * m, tipo: 'tronco', cor: '#8b5a2b', itens: [5, 55] }
            ];
        }

        function iniciarJogo() {
            if (typeof Plotly === 'undefined') {
                document.getElementById('frg-placar').innerHTML = "<span style='color:red'>ERRO: Plotly.js não foi carregado!</span>";
                return;
            }

            pontuacao = 0;
            vidas = 3;
            ninhosOcupados = [false, false, false, false, false];
            jogando = true;

            resetarSapo();
            criarObstaculos();

            if (loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(gameLoop, 1000 / FPS);

            let btn = document.getElementById('frg-btn-novo');
            if (btn) btn.blur();
        }

        window.reiniciarFrogger = iniciarJogo;

        function matarSapo() {
            vidas--;
            if (vidas <= 0) {
                jogando = false;
            } else {
                resetarSapo();
            }
        }

        function atualizarFisica() {
            if (!jogando) return;

            // 1. Mover obstáculos
            obstaculos.forEach(linha => {
                let velEfetiva = linha.vel * fatorVelocidade;
                for (let i = 0; i < linha.itens.length; i++) {
                    linha.itens[i] += velEfetiva * DT;

                    if (velEfetiva > 0 && linha.itens[i] > GRID_W + linha.largura) {
                        linha.itens[i] = -linha.largura;
                    } else if (velEfetiva < 0 && linha.itens[i] < -linha.largura) {
                        linha.itens[i] = GRID_W + linha.largura;
                    }
                }
            });

            // 2. Colisão na Rua
            if (sapo.y >= 15 && sapo.y <= 55) {
                let linhaAtual = obstaculos.find(o => o.y === sapo.y);
                if (linhaAtual) {
                    for (let xObs of linhaAtual.itens) {
                        if (Math.abs(sapo.x - xObs) < (linhaAtual.largura / 2 + 2)) {
                            matarSapo();
                            return;
                        }
                    }
                }
            }

            // 3. Flutuação/Afogamento no Rio
            if (sapo.y >= 75 && sapo.y <= 115) {
                let linhaAtual = obstaculos.find(o => o.y === sapo.y);
                let emCimaDePlataforma = false;

                if (linhaAtual) {
                    for (let xObs of linhaAtual.itens) {
                        if (Math.abs(sapo.x - xObs) < (linhaAtual.largura / 2 + 1)) {
                            emCimaDePlataforma = true;
                            sapo.x += (linhaAtual.vel * fatorVelocidade) * DT;
                            break;
                        }
                    }
                }

                if (!emCimaDePlataforma || sapo.x < 2 || sapo.x > 98) {
                    matarSapo();
                    return;
                }
            }

            // 4. Chegada nos Ninhos
            if (sapo.y >= 125) {
                let ninhosX = [10, 30, 50, 70, 90];
                let achouNinho = false;

                for (let i = 0; i < ninhosX.length; i++) {
                    if (Math.abs(sapo.x - ninhosX[i]) < 6) {
                        if (!ninhosOcupados[i]) {
                            ninhosOcupados[i] = true;
                            pontuacao += 500;
                            achouNinho = true;
                            resetarSapo();

                            if (ninhosOcupados.every(v => v)) {
                                pontuacao += 1000;
                                ninhosOcupados = [false, false, false, false, false];
                            }
                        }
                        break;
                    }
                }

                if (!achouNinho) matarSapo();
            }
        }

        function renderizar() {
            let placarEl = document.getElementById('frg-placar');
            let plotTarget = document.getElementById('frg-game-plot');

            if (placarEl) {
                placarEl.innerHTML = `PONTOS: ${pontuacao} &nbsp;&nbsp;|&nbsp;&nbsp; VIDAS: ${"🐸 ".repeat(Math.max(0, vidas))}`;
            }

            let shapes = [];

            // A) Faixas do Terreno
            shapes.push({ type: 'rect', x0: 0, y0: 0, x1: GRID_W, y1: 10, fillcolor: '#003300', line: { width: 0 } });
            shapes.push({ type: 'rect', x0: 0, y0: 10, x1: GRID_W, y1: 60, fillcolor: '#111111', line: { width: 0 } });
            shapes.push({ type: 'rect', x0: 0, y0: 60, x1: GRID_W, y1: 70, fillcolor: '#003300', line: { width: 0 } });
            shapes.push({ type: 'rect', x0: 0, y0: 70, x1: GRID_W, y1: 120, fillcolor: '#001155', line: { width: 0 } });
            shapes.push({ type: 'rect', x0: 0, y0: 120, x1: GRID_W, y1: 130, fillcolor: '#005500', line: { width: 0 } });

            // B) Obstáculos
            obstaculos.forEach(linha => {
                linha.itens.forEach(xObs => {
                    shapes.push({
                        type: 'rect',
                        x0: xObs - (linha.largura / 2),
                        y0: linha.y - 4,
                        x1: xObs + (linha.largura / 2),
                        y1: linha.y + 4,
                        fillcolor: linha.cor,
                        line: { color: '#ffffff', width: 0.5 }
                    });
                });
            });

            // C) Ninhos
            let ninhosX = [10, 30, 50, 70, 90];
            ninhosX.forEach((nx, idx) => {
                shapes.push({
                    type: 'rect',
                    x0: nx - 5, y0: 121, x1: nx + 5, y1: 129,
                    fillcolor: ninhosOcupados[idx] ? '#00ff00' : '#000000',
                    line: { color: '#ffea00', width: 1.5 }
                });
            });

            // D) Sapo
            if (jogando) {
                let sx = sapo.x;
                let sy = sapo.y;

                shapes.push({
                    type: 'rect',
                    x0: sx - 2.5, y0: sy - 3.0,
                    x1: sx + 2.5, y1: sy + 3.0,
                    fillcolor: '#39ff14',
                    line: { color: '#ffffff', width: 2 }
                });
                
                shapes.push({ type: 'circle', x0: sx - 2.5, y0: sy + 1.5, x1: sx - 0.5, y1: sy + 3.5, fillcolor: '#ffffff', line: { width: 0 } });
                shapes.push({ type: 'circle', x0: sx + 0.5, y0: sy + 1.5, x1: sx + 2.5, y1: sy + 3.5, fillcolor: '#ffffff', line: { width: 0 } });
            }

            let annotations = [];
            if (!jogando) {
                annotations.push({
                    x: GRID_W / 2, y: GRID_H / 2,
                    text: vidas <= 0 ? "GAME OVER" : "CLIQUE EM NOVO JOGO",
                    font: { size: 32, color: '#ff0055', family: 'Courier New' },
                    showarrow: false
                });
            }

            let layout = {
                xaxis: { range: [0, GRID_W], showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { range: [0, GRID_H], showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: '#000000',
                paper_bgcolor: '#000000',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                shapes: shapes,
                annotations: annotations
            };

            if (plotTarget && typeof Plotly !== 'undefined') {
                Plotly.react(plotTarget, [], layout, { staticPlot: true, responsive: true });
            }
        }

        function gameLoop() {
            atualizarFisica();
            renderizar();
        }

        window.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }

            if (!jogando) return;

            if (e.key === "ArrowUp") {
                sapo.y = Math.min(125, sapo.y + 10);
            } else if (e.key === "ArrowDown") {
                sapo.y = Math.max(5, sapo.y - 10);
            } else if (e.key === "ArrowLeft") {
                sapo.x = Math.max(5, sapo.x - 7);
            } else if (e.key === "ArrowRight") {
                sapo.x = Math.min(95, sapo.x + 7);
            }
        });

        function checarELancar() {
            if (typeof Plotly !== 'undefined') {
                iniciarJogo();
            } else {
                setTimeout(checarELancar, 200);
            }
        }

        checarELancar();
    })();
    </script>
</body>
</html>
