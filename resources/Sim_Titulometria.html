<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulação Interativa de Titulação Ácido-Base</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; color: #38bdf8; }

    .main-container { display: flex; gap: 30px; max-width: 950px; width: 100%; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .lab-box { display: flex; flex-direction: column; align-items: center; width: 340px; background: rgba(15, 23, 42, 0.6); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .info-box { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; }
    
    .readout { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .readout span { font-weight: 700; font-size: 1.2rem; color: #38bdf8; }
    
    .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 15px; }
    .btn-row { display: flex; gap: 10px; width: 100%; }
    
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: white; background: #0284c7; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    
    button.auto-btn { background: #0d9488; }
    button.auto-btn:hover { background: #0f766e; }
    button.auto-btn.active { background: #d97706; }
    
    button.reset { background: #e11d48; }
    button.reset:hover { background: #be123c; }

    svg.lab-svg { overflow: visible; }
    .chart-box { background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .chart-box h4 { margin-bottom: 10px; color: #94a3b8; font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>

  <h2>Simulação Interativa de Titulação</h2>

  <div class="main-container">
    <div class="lab-box">
      <svg class="lab-svg" width="220" height="360" viewBox="0 0 220 360">
        <defs>
          <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
            <stop offset="20%" stop-color="rgba(255,255,255,0.1)"/>
            <stop offset="80%" stop-color="rgba(255,255,255,0.05)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
          </linearGradient>

          <linearGradient id="titrantGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7dd3fc"/>
            <stop offset="50%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>

        <!-- Suporte Universal -->
        <rect x="20" y="340" width="180" height="12" rx="4" fill="#334155"/>
        <rect x="35" y="20" width="10" height="320" rx="3" fill="#475569"/>
        <path d="M 45 120 L 90 120 L 90 126 L 45 126 Z" fill="#64748b"/>

        <!-- Bureta de Vidro -->
        <rect x="92" y="25" width="20" height="170" rx="3" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
        <!-- Líquido da bureta -->
        <rect id="burette-fill" x="94" y="27" width="16" height="166" rx="1" fill="url(#titrantGrad)"/>
        
        <!-- Torneira -->
        <path d="M 99 195 L 105 207 L 97 207 Z" fill="#cbd5e1"/>
        <circle id="stopcock-handle" cx="102" cy="201" r="5" fill="#f43f5e" style="transition: transform 0.2s; transform-origin: 102px 201px;"/>

        <!-- Gota -->
        <circle id="water-drop" cx="102" cy="208" r="4" fill="#38bdf8" opacity="0"/>

        <!-- Erlenmeyer -->
        <path d="M 88 245 L 60 315 A 12 12 0 0 0 71 332 L 133 332 A 12 12 0 0 0 144 315 L 116 245 Z" 
              fill="url(#glassGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <rect x="94" y="235" width="16" height="12" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

        <!-- Líquido Titulado -->
        <path id="flask-liquid" d="M 64 315 L 71 328 L 133 328 L 140 315 Z" fill="#ffffff" opacity="0.9"/>
      </svg>

      <div class="controls">
        <button id="btn-add">Adicionar Gota (+0,5 mL)</button>
        <div class="btn-row">
          <button id="btn-auto" class="auto-btn">Gotejamento (0,5s)</button>
          <button id="btn-reset" class="reset">Reiniciar</button>
        </div>
      </div>
    </div>

    <!-- Painel de Leitura e Gráfico -->
    <div class="info-box">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="readout">
          <span>Titulante (NaOH 0,1 M):</span>
          <span id="val-vol">0.0 mL</span>
        </div>
        <div class="readout">
          <span>pH do Titulado:</span>
          <span id="val-ph">1.00</span>
        </div>
        <div class="readout">
          <span>Estado da Solução:</span>
          <span id="val-status" style="color: #94a3b8; font-size: 1rem;">Incolor (Meio Ácido)</span>
        </div>
      </div>

      <div class="chart-box">
        <h4>Curva de Titulação (pH vs Volume Adicionado)</h4>
        <svg id="chart" width="100%" height="160" viewBox="0 0 300 160">
          <line x1="30" y1="140" x2="285" y2="140" stroke="#475569" stroke-width="1.5"/>
          <line x1="30" y1="10" x2="30" y2="140" stroke="#475569" stroke-width="1.5"/>
          <line x1="30" y1="75" x2="285" y2="75" stroke="#334155" stroke-dasharray="4" stroke-width="1"/>
          <polyline id="chart-line" points="30,131" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const V_HCl = 25.0; 
    const C_HCl = 0.1;  
    const C_NaOH = 0.1; 
    
    let vAdded = 0.0;
    let autoInterval = null;
    let isAnimating = false;

    const elVol = document.getElementById('val-vol');
    const elPh = document.getElementById('val-ph');
    const elStatus = document.getElementById('val-status');
    const elLiquid = document.getElementById('flask-liquid');
    const elBurette = document.getElementById('burette-fill');
    const elDrop = document.getElementById('water-drop');
    const elLine = document.getElementById('chart-line');
    const btnAuto = document.getElementById('btn-auto');
    const stopcock = document.getElementById('stopcock-handle');

    function calculatePH(v) {
      const molesHCl = (V_HCl / 1000) * C_HCl;
      const molesNaOH = (v / 1000) * C_NaOH;
      const totalVol = (V_HCl + v) / 1000;

      if (molesNaOH < molesHCl) {
        const remainingH = (molesHCl - molesNaOH) / totalVol;
        return -Math.log10(remainingH);
      } else if (Math.abs(molesNaOH - molesHCl) < 1e-9) {
        return 7.0;
      } else {
        const excessOH = (molesNaOH - molesHCl) / totalVol;
        return 14 + Math.log10(excessOH);
      }
    }

    function updateView() {
      const ph = calculatePH(vAdded);
      
      elVol.textContent = `${vAdded.toFixed(1)} mL`;
      elPh.textContent = ph.toFixed(2);

      if (ph < 8.2) {
        elLiquid.setAttribute('fill', '#ffffff');
        elStatus.textContent = "Incolor (Meio Ácido)";
        elStatus.style.color = "#94a3b8";
      } else if (ph >= 8.2 && ph < 10.0) {
        elLiquid.setAttribute('fill', '#f472b6');
        elStatus.textContent = "Ponto Final Alcançado (Rosa Persistente)";
        elStatus.style.color = "#f472b6";
      } else {
        elLiquid.setAttribute('fill', '#e11d48');
        elStatus.textContent = "Rosa Intenso (Meio Básico)";
        elStatus.style.color = "#fb7185";
      }

      // CORREÇÃO DO LÍQUIDO DA BURETA:
      // O topo da bureta fica em y=27 e a base em y=193 (altura total max = 166px).
      // Ao esvaziar, o topo (y) Desce e a altura (height) Diminui.
      const bHeight = Math.max(0, 166 - (vAdded * 3.32));
      const bY = 27 + (vAdded * 3.32);
      
      elBurette.setAttribute('y', bY.toFixed(1));
      elBurette.setAttribute('height', bHeight.toFixed(1));

      const x = 30 + (vAdded / 50) * 255;
      const y = 140 - (ph / 14) * 130;
      
      const currentPts = elLine.getAttribute('points');
      elLine.setAttribute('points', `${currentPts} ${x.toFixed(1)},${y.toFixed(1)}`);
    }

    function animateDrop(onComplete) {
      if (vAdded >= 50.0) {
        stopAuto();
        return;
      }

      isAnimating = true;
      let startY = 208;
      let endY = 310;
      let duration = 300;
      let startTime = null;

      elDrop.setAttribute('opacity', '1');
      stopcock.style.transform = "rotate(45deg)";

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = (timestamp - startTime) / duration;

        if (progress < 1) {
          let currentY = startY + progress * (endY - startY);
          elDrop.setAttribute('cy', currentY);
          requestAnimationFrame(step);
        } else {
          elDrop.setAttribute('cy', startY);
          elDrop.setAttribute('opacity', '0');
          stopcock.style.transform = "rotate(0deg)";
          
          vAdded += 0.5;
          updateView();
          isAnimating = false;
          if (onComplete) onComplete();
        }
      }

      requestAnimationFrame(step);
    }

    function stopAuto() {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        btnAuto.textContent = "Gotejamento (0,5s)";
        btnAuto.classList.remove('active');
      }
    }

    document.getElementById('btn-add').addEventListener('click', () => {
      stopAuto();
      if (!isAnimating) {
        animateDrop();
      }
    });

    btnAuto.addEventListener('click', () => {
      if (autoInterval) {
        stopAuto();
      } else {
        btnAuto.textContent = "Pausar Gotejamento";
        btnAuto.classList.add('active');
        
        if (!isAnimating) animateDrop();
        
        autoInterval = setInterval(() => {
          if (!isAnimating && vAdded < 50.0) {
            animateDrop();
          }
        }, 450);
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      stopAuto();
      vAdded = 0.0;
      elDrop.setAttribute('opacity', '0');
      elDrop.setAttribute('cy', '208');
      elLine.setAttribute('points', '30,131');
      updateView();
    });

    updateView();
  </script>
</body>
</html>
