<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>River Raid Retro - Atari 2600 Style</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ff0055;
        }
        .hud {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ffee00;
        }
        canvas {
            border: 4px solid #00ffcc;
            background-color: #008800; /* Grama */
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>RIVER RAID (1982)</h1>
    <div class="hud" id="hud">PONTOS: 0 | COMBUSTÍVEL: 100% | VIDAS: 3</div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div class="controls">
        <b>Controles:</b> ← → (Mover) | ↑ (Acelerar) | ↓ (Desacelerar) | <b>Espaço</b> (Atirar)
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // Estado do Jogo
    let score = 0;
    let fuel = 100;
    let lives = 3;
    let gameOver = false;
    let gameSpeed = 3;

    // Jogador (Jato)
    const player = {
        x: 200,
        y: 420,
        width: 20,
        height: 24,
        speedX: 0
    };

    // Teclas
    const keys = {};

    // Entidades
    let bullets = [];
    let enemies = [];
    let riverWidth = 220;
    let riverX = 90; // Centro do rio
    let gameFrame = 0;

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function spawnEnemy() {
        // Tipos: 0 = Navio, 1 = Helicóptero, 2 = FUEL
        const type = Math.random() < 0.25 ? 2 : (Math.random() < 0.6 ? 0 : 1);
        const margin = 20;
        const x = riverX + margin + Math.random() * (riverWidth - margin * 2 - 20);
        enemies.push({
            x: x,
            y: -30,
            width: type === 2 ? 30 : 24,
            height: 16,
            type: type, // 0: Navio, 1: Heli, 2: Fuel
            speedX: type === 1 ? (Math.random() < 0.5 ? 1.5 : -1.5) : 0
        });
    }

    function update() {
        if (gameOver) return;

        gameFrame++;

        // Controle de Velocidade
        if (keys['ArrowUp']) gameSpeed = 5;
        else if (keys['ArrowDown']) gameSpeed = 1.8;
        else gameSpeed = 3;

        // Consumo de Combustível
        fuel -= 0.05 * (gameSpeed / 3);
        if (fuel <= 0) {
            fuel = 0;
            explodePlayer();
        }

        // Movimento Lateral do Jato
        if (keys['ArrowLeft']) player.x -= 3.5;
        if (keys['ArrowRight']) player.x += 3.5;

        // Limite do Rio (Colisão com a Margem)
        const leftBank = riverX;
        const rightBank = riverX + riverWidth;
        if (player.x < leftBank || player.x + player.width > rightBank) {
            explodePlayer();
        }

        // Tiro
        if (keys['Space'] && gameFrame % 8 === 0) {
            bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10 });
        }

        // Atualizar Tiros
        bullets.forEach((b, index) => {
            b.y -= 8;
            if (b.y < -10) bullets.splice(index, 1);
        });

        // Spawn de Inimigos
        if (gameFrame % Math.floor(60 / (gameSpeed / 2)) === 0) {
            spawnEnemy();
        }

        // Atualizar Inimigos
        enemies.forEach((e, index) => {
            e.y += gameSpeed;
            e.x += e.speedX;

            // Rebater helicópteros nas margens
            if (e.type === 1) {
                if (e.x < riverX + 10 || e.x + e.width > riverX + riverWidth - 10) {
                    e.speedX *= -1;
                }
            }

            // Colisão Tiro vs Inimigo/Fuel
            bullets.forEach((b, bIndex) => {
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    
                    if (e.type === 0) score += 30;       // Navio
                    else if (e.type === 1) score += 60;  // Helicóptero
                    else if (e.type === 2) score += 80;  // Destruir Fuel dá pontos mas perde a chance de reabastecer

                    enemies.splice(index, 1);
                    bullets.splice(bIndex, 1);
                }
            });

            // Colisão Jato vs Inimigo / Fuel
            if (player.x < e.x + e.width && player.x + player.width > e.x &&
                player.y < e.y + e.height && player.y + player.height > e.y) {
                
                if (e.type === 2) {
                    // Reabastecer no posto FUEL
                    fuel = Math.min(100, fuel + 1.5);
                } else {
                    // Batida em Navio/Heli
                    explodePlayer();
                }
            }

            // Remover fora da tela
            if (e.y > canvas.height + 30) enemies.splice(index, 1);
        });

        // Oscilação leve no leito do rio para simular curvas
        riverX = 90 + Math.sin(gameFrame * 0.01) * 30;

        // Atualizar HUD
        hud.innerHTML = `PONTOS: ${score} | COMBUSTÍVEL: ${Math.floor(fuel)}% | VIDAS: ${"✈️ ".repeat(lives)}`;
    }

    function explodePlayer() {
        lives--;
        if (lives <= 0) {
            gameOver = true;
            alert(`GAME OVER!\nPontuação final: ${score}`);
            document.location.reload();
        } else {
            player.x = riverX + riverWidth / 2 - player.width / 2;
            fuel = 100;
            enemies = [];
        }
    }

    function draw() {
        // Limpar tela (Grama)
        ctx.fillStyle = '#008800';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenhar Rio (Azul)
        ctx.fillStyle = '#0055ff';
        ctx.fillRect(riverX, 0, riverWidth, canvas.height);

        // Margens (Amarelo / Terra Atari)
        ctx.fillStyle = '#ccaa00';
        ctx.fillRect(riverX - 6, 0, 6, canvas.height);
        ctx.fillRect(riverX + riverWidth, 0, 6, canvas.height);

        // Desenhar Tiros
        ctx.fillStyle = '#ffffff';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // Desenhar Inimigos
        enemies.forEach(e => {
            if (e.type === 0) {
                // Navio (Vermelho)
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            } else if (e.type === 1) {
                // Helicóptero (Preto/Amarelo)
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(e.x, e.y, e.width, e.height);
            } else if (e.type === 2) {
                // FUEL (Branco com texto)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Courier New';
                ctx.fillText('FUEL', e.x + 2, e.y + 12);
            }
        });

        // Desenhar Jato (Amarelo Clássico)
        if (!gameOver) {
            ctx.fillStyle = '#ffea00';
            // Asa
            ctx.fillRect(player.x, player.y + 10, player.width, 6);
            // Corpo
            ctx.fillRect(player.x + 8, player.y, 4, player.height);
            // Cauda
            ctx.fillRect(player.x + 4, player.y + 18, 12, 4);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
    </script>
</body>
</html>
