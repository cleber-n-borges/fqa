<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pac-Man 1980 - Plotly.js (Corrigido)</title>
    <!-- Script local mantido -->
    <script src="plotly-3.7.0.min.js"></script>

    <style>
        .pac-container {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            border-radius: 8px;
        }
        .pac-placar {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 24px;
            color: #ffffff;
        }
        .pac-canvas {
            width: 100%;
            max-width: 600px;
            height: 600px;
            margin: 0 auto;
            background-color: #000000;
            border: 2px solid #00ff00;
            border-radius: 4px;
        }
        .pac-info {
            margin-top: 10px;
            color: #888888;
            font-size: 13px;
        }
        .pac-painel {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pac-btn {
            background-color: #000000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 6px 12px;
            font-size: 13px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .pac-btn:hover { background-color: #00ff00; color: #000000; }
        .pac-btn.active { background-color: #00ff00; color: #000000; }
        .pac-label { font-size: 12px; color: #ffea00; }
    </style>
</head>
<body>

    <div class="pac-container">
        <h1>🟡 PAC-MAN (Namco, 1980)</h1>

        <!-- PAINEL DE CONTROLES -->
        <div class="pac-painel">
            <button class="pac-btn" onclick="window.reiniciarPacman()">🔄 NOVO JOGO</button>
            
            <span class="pac-label">⚡ VELOCIDADE:</span>
            <button class="pac-btn btn-velocidade" data-vel="0.5" onclick="window.setVelocidadePac(0.5)">0.5x</button>
            <button class="pac-btn btn-velocidade active" data-vel="1.0" onclick="window.setVelocidadePac(1.0)">1.0x</button>
            <button class="pac-btn btn-velocidade" data-vel="1.5" onclick="window.setVelocidadePac(1.5)">1.5x</button>
            <button class="pac-btn btn-velocidade" data-vel="2.0" onclick="window.setVelocidadePac(2.0)">2.0x 🔥</button>

            <span class="pac-label">🍒 SUPER PASTILHA:</span>
            <button id="btn-power" class="pac-btn" onclick="window.togglePowerDuracao()">TEMPO: NORMAL (6s)</button>
        </div>

        <div id="pac-placar" class="pac-placar">Preparando arena...</div>
        <div id="pac-game-plot" class="pac-canvas"></div>
        <div class="pac-info">
            Controles: <b>← / ↑ / → / ↓</b> (Mover Pac-Man)
        </div>
    </div>

    <script>
    (function() {
        const GRID_W = 100;
        const GRID_H = 100;
        const FPS = 30;
        const DT = 1 / FPS;

        // --- PARÂMETROS CONFIGURÁVEIS ---
        let fatorVelocidade = 1.0;
        let duracaoPowerPellet = 6.0;

        let pacman = { x: 50, y: 10, dirX: 0, dirY: 0, proxDirX: 0, proxDirY: 0, raio: 2.2 };
        let fantasmas = [];
        let pastilhas = [];
        let paredes = [];

        let tempoPowerRestante = 0;
        let pontuacao = 0;
        let vidas = 3;
        let jogando = false;
        let loopInterval = null;

        // --- CONTROLES DE INTERFACE ---
        window.setVelocidadePac = function(fator) {
            fatorVelocidade = fator;
            let botoes = document.querySelectorAll('.btn-velocidade');
            botoes.forEach(btn => {
                let val = parseFloat(btn.getAttribute('data-vel'));
                if (val === fator) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
                btn.blur();
            });
        };

        window.togglePowerDuracao = function() {
            duracaoPowerPellet = duracaoPowerPellet === 6.0 ? 12.0 : 6.0;
            let btn = document.getElementById('btn-power');
            if (btn) {
                btn.innerHTML = `TEMPO: ${duracaoPowerPellet === 12.0 ? 'TURBO (12s) ⚡' : 'NORMAL (6s)'}`;
                btn.blur();
            }
        };

        function criarLabirinto() {
            // Muros e Blocos alinhados com espaçamento para os corredores
            paredes = [
                // Moldura Externa
                { x0: 2, y0: 2, x1: 98, y1: 5 },
                { x0: 2, y0: 95, x1: 98, y1: 98 },
                { x0: 2, y0: 2, x1: 5, y1: 98 },
                { x0: 95, y0: 2, x1: 98, y1: 98 },

                // Obstáculos Superiores
                { x0: 15, y0: 78, x1: 38, y1: 86 },
                { x0: 62, y0: 78, x1: 85, y1: 86 },
                { x0: 46, y0: 72, x1: 54, y1: 86 },

                // Obstáculos Intermediários
                { x0: 15, y0: 52, x1: 28, y1: 68 },
                { x0: 72, y0: 52, x1: 85, y1: 68 },

                // Casa dos Fantasmas (Centro)
                { x0: 38, y0: 42, x1: 62, y1: 58 },

                // Obstáculos Inferiores
                { x0: 15, y0: 20, x1: 38, y1: 38 },
                { x0: 62, y0: 20, x1: 85, y1: 38 },
                { x0: 46, y0: 18, x1: 54, y1: 32 }
            ];

            pastilhas = [];

            // 1. Adiciona as 4 SUPER PASTILHAS nos 4 Cantos Livres
            const cantosPower = [
                { x: 10, y: 10 },
                { x: 90, y: 10 },
                { x: 10, y: 90 },
                { x: 90, y: 90 }
            ];

            cantosPower.forEach(c => {
                pastilhas.push({ x: c.x, y: c.y, especial: true, ativa: true });
            });

            // 2. Popula os Corredores com Pastilhas Comuns
            for (let x = 10; x <= 90; x += 8) {
                for (let y = 10; y <= 90; y += 8) {
                    // Ignora cantos das super pastilhas
                    if ((x === 10 || x === 90) && (y === 10 || y === 90)) continue;
                    // Ignora casa dos fantasmas
                    if (x >= 32 && x <= 68 && y >= 38 && y <= 62) continue;

                    let emParede = paredes.some(p => x >= p.x0 - 1.5 && x <= p.x1 + 1.5 && y >= p.y0 - 1.5 && y <= p.y1 + 1.5);
                    if (!emParede) {
                        pastilhas.push({ x: x, y: y, especial: false, ativa: true });
                    }
                }
            }
        }

        function criarFantasmas() {
            fantasmas = [
                { x: 44, y: 64, dirX: 0, dirY: 1, cor: '#ff0000', nome: 'Blinky' },
                { x: 50, y: 64, dirX: 1, dirY: 0, cor: '#ffb8ff', nome: 'Pinky' },
                { x: 56, y: 64, dirX: -1, dirY: 0, cor: '#00ffff', nome: 'Inky' },
                { x: 50, y: 70, dirX: 0, dirY: -1, cor: '#ffb852', nome: 'Clyde' }
            ];
        }

        function resetarPosicoes() {
            // Pac-Man nasce na pista inferior limpa (y = 10)
            pacman.x = 50;
            pacman.y = 10;
            pacman.dirX = 0;
            pacman.dirY = 0;
            pacman.proxDirX = 0;
            pacman.proxDirY = 0;

            criarFantasmas();
        }

        function iniciarJogo() {
            if (typeof Plotly === 'undefined') {
                document.getElementById('pac-placar').innerHTML = "<span style='color:red'>ERRO: Plotly.js não foi carregado!</span>";
                return;
            }

            pontuacao = 0;
            vidas = 3;
            jogando = true;
            tempoPowerRestante = 0;

            criarLabirinto();
            resetarPosicoes();

            if (loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(gameLoop, 1000 / FPS);

            let btn = document.getElementById('pac-btn-novo');
            if (btn) btn.blur();
        }

        window.reiniciarPacman = iniciarJogo;

        function colideComParedes(x, y, raio) {
            return paredes.some(p => 
                x + raio > p.x0 && x - raio < p.x1 &&
                y + raio > p.y0 && y - raio < p.y1
            );
        }

        function atualizarFisica() {
            if (!jogando) return;

            let dtEfetivo = DT * fatorVelocidade;
            let velPacman = 32 * dtEfetivo;
            let velFantasma = (tempoPowerRestante > 0 ? 18 : 25) * dtEfetivo;

            // 1. Contador do Power Pellet
            if (tempoPowerRestante > 0) {
                tempoPowerRestante -= dtEfetivo;
            }

            // 2. Movimento do Pac-Man com virada nas encruzilhadas
            if (pacman.proxDirX !== 0 || pacman.proxDirY !== 0) {
                let testX = pacman.x + pacman.proxDirX * velPacman;
                let testY = pacman.y + pacman.proxDirY * velPacman;
                if (!colideComParedes(testX, testY, pacman.raio)) {
                    pacman.dirX = pacman.proxDirX;
                    pacman.dirY = pacman.proxDirY;
                }
            }

            let novoX = pacman.x + pacman.dirX * velPacman;
            let novoY = pacman.y + pacman.dirY * velPacman;

            if (!colideComParedes(novoX, novoY, pacman.raio)) {
                pacman.x = novoX;
                pacman.y = novoY;
            }

            // 3. Coleta de Pastilhas
            pastilhas.forEach(p => {
                if (p.ativa && Math.hypot(pacman.x - p.x, pacman.y - p.y) < 3.8) {
                    p.ativa = false;
                    if (p.especial) {
                        pontuacao += 50;
                        tempoPowerRestante = duracaoPowerPellet;
                    } else {
                        pontuacao += 10;
                    }
                }
            });

            // Vitória
            if (pastilhas.every(p => !p.ativa)) {
                pontuacao += 1000;
                criarLabirinto();
                resetarPosicoes();
            }

            // 4. Movimento e Colisão dos Fantasmas
            fantasmas.forEach(f => {
                let fNovoX = f.x + f.dirX * velFantasma;
                let fNovoY = f.y + f.dirY * velFantasma;

                if (colideComParedes(fNovoX, fNovoY, 2.5) || Math.random() < 0.04) {
                    let direcoes = [
                        { x: 1, y: 0 }, { x: -1, y: 0 },
                        { x: 0, y: 1 }, { x: 0, y: -1 }
                    ];
                    let direcoesValidas = direcoes.filter(d => 
                        !colideComParedes(f.x + d.x * velFantasma * 4, f.y + d.y * velFantasma * 4, 2.5)
                    );

                    if (direcoesValidas.length > 0) {
                        let escolha = direcoesValidas[Math.floor(Math.random() * direcoesValidas.length)];
                        f.dirX = escolha.x;
                        f.dirY = escolha.y;
                    }
                } else {
                    f.x = fNovoX;
                    f.y = fNovoY;
                }

                // Checar Colisão Pac-Man vs Fantasma
                if (Math.hypot(pacman.x - f.x, pacman.y - f.y) < 4.2) {
                    if (tempoPowerRestante > 0) {
                        // Comer Fantasma
                        pontuacao += 200;
                        f.x = 50;
                        f.y = 50;
                    } else {
                        // Pac-Man Morre
                        vidas--;
                        if (vidas <= 0) {
                            jogando = false;
                        } else {
                            resetarPosicoes();
                        }
                    }
                }
            });
        }

        function renderizar() {
            let placarEl = document.getElementById('pac-placar');
            let plotTarget = document.getElementById('pac-game-plot');

            if (placarEl) {
                let textoPower = tempoPowerRestante > 0 ? `&nbsp;&nbsp;⚡ POWER: ${Math.ceil(tempoPowerRestante)}s` : '';
                placarEl.innerHTML = `PONTOS: ${pontuacao} &nbsp;&nbsp;|&nbsp;&nbsp; VIDAS: ${"🟡 ".repeat(Math.max(0, vidas))}${textoPower}`;
            }

            let shapes = [];

            // A) Paredes do Labirinto
            paredes.forEach(p => {
                shapes.push({
                    type: 'rect',
                    x0: p.x0, y0: p.y0,
                    x1: p.x1, y1: p.y1,
                    fillcolor: '#0011bb',
                    line: { color: '#0055ff', width: 2 }
                });
            });

            // B) Pastilhas e Super Pastilhas
            pastilhas.forEach(p => {
                if (p.ativa) {
                    let raio = p.especial ? 2.5 : 0.9;
                    shapes.push({
                        type: 'circle',
                        x0: p.x - raio, y0: p.y - raio,
                        x1: p.x + raio, y1: p.y + raio,
                        fillcolor: p.especial ? '#ffea00' : '#ffb8ae',
                        line: { color: p.especial ? '#ffffff' : '#ffb8ae', width: p.especial ? 1 : 0 }
                    });
                }
            });

            // C) Fantasmas
            fantasmas.forEach(f => {
                if (jogando) {
                    let corFinal = tempoPowerRestante > 0 ? (tempoPowerRestante < 2 && Math.floor(tempoPowerRestante * 5) % 2 === 0 ? '#ffffff' : '#0000ff') : f.cor;
                    shapes.push({
                        type: 'circle',
                        x0: f.x - 3.0, y0: f.y - 3.0,
                        x1: f.x + 3.0, y1: f.y + 3.0,
                        fillcolor: corFinal,
                        line: { color: '#ffffff', width: 0.5 }
                    });
                }
            });

            // D) Pac-Man
            if (jogando) {
                shapes.push({
                    type: 'circle',
                    x0: pacman.x - pacman.raio, y0: pacman.y - pacman.raio,
                    x1: pacman.x + pacman.raio, y1: pacman.y + pacman.raio,
                    fillcolor: '#ffea00',
                    line: { color: '#ffffff', width: 1 }
                });
            }

            let annotations = [];
            if (!jogando) {
                annotations.push({
                    x: GRID_W / 2, y: GRID_H / 2,
                    text: vidas <= 0 ? "GAME OVER" : "CLIQUE EM NOVO JOGO",
                    font: { size: 32, color: '#ff0055', family: 'Courier New' },
                    showarrow: false
                });
            }

            let layout = {
                xaxis: { range: [0, GRID_W], showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { range: [0, GRID_H], showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: '#000000',
                paper_bgcolor: '#000000',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                shapes: shapes,
                annotations: annotations
            };

            if (plotTarget && typeof Plotly !== 'undefined') {
                Plotly.react(plotTarget, [], layout, { staticPlot: true, responsive: true });
            }
        }

        function gameLoop() {
            atualizarFisica();
            renderizar();
        }

        // --- TECLADO ---
        window.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }

            if (!jogando) return;

            if (e.key === "ArrowUp")    { pacman.proxDirX = 0;  pacman.proxDirY = 1;  }
            if (e.key === "ArrowDown")  { pacman.proxDirX = 0;  pacman.proxDirY = -1; }
            if (e.key === "ArrowLeft")  { pacman.proxDirX = -1; pacman.proxDirY = 0;  }
            if (e.key === "ArrowRight") { pacman.proxDirX = 1;  pacman.proxDirY = 0;  }
        });

        function checarELancar() {
            if (typeof Plotly !== 'undefined') {
                iniciarJogo();
            } else {
                setTimeout(checarELancar, 200);
            }
        }

        checarELancar();
    })();
    </script>
</body>
</html>
