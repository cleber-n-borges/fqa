<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ping Pong</title>
    <!-- Biblioteca Plotly.js -->
    <!--<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>-->
    <!-- Plotly (por pasta Local) -->
    <script src="/resources/plotly-3.7.0.min.js"></script>

    <style>
        #mainPong {
            background-color: #0f0f1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #painel-controle {
            margin-bottom: 15px;
        }
        button, select {
            background-color: #4a9eff;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover, select:hover {
            background-color: #357abd;
        }
        #btn-inicio {
            background-color: #28a745;
            font-weight: bold;
        }
        #btn-inicio:hover {
            background-color: #218838;
        }
        #placar {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #grafico-pong {
            width: 100%;
            max-width: 700px;
            height: 450px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id='mainPong'>

    <h2 class="anchored" data-anchor-id="Pong">🎮 Ping Pong Interativo</h2>

    <div id="placar">Jogador: 0 | IA: 0</div>


    <!-- Controles do Jogo -->
    <div id="painel-controle">
        <label for="select-trajetoria">Física:</label>
        <select id="select-trajetoria">
            <option value="linear">Linear (Fácil)</option>
            <option value="angular">Angular (Pong)</option>
            <option value="spin" selected>Spin (Cortado)</option>
        </select>

        <label for="select-velocidade">Velocidade:</label>
        <select id="select-velocidade">
            <option value="lento">Lento</option>
            <option value="normal" selected>Normal</option>
            <option value="rapido">Rápido</option>
        </select>

        <button id="btn-inicio">▶ Iniciar / Reiniciar</button>
        <button id="btn-pausa">⏸ Pausar</button>
    </div>

    <!-- Renderizador Plotly -->
    <div id="grafico-pong"></div>

    </div>
    <script>
        // Configurações Globais do Campo
        const largura = 40;
        const altura = 20;
        const raqueteAltura = 4;
        const raqueteLargura = 0.8;

        // Estado do Jogo
        let jogadorY = altura / 2 - raqueteAltura / 2;
        let jogadorYAnterior = jogadorY;
        let iaY = altura / 2 - raqueteAltura / 2;
        let jogadorX = 2;
        let iaX = largura - 2 - raqueteLargura;

        let bolaX = largura / 2;
        let bolaY = altura / 2;
        let bolaVx = 0;
        let bolaVy = 0;

        let pontosJogador = 0;
        let pontosIa = 0;
        let jogando = false;
        let pausado = false;
        let gameInterval = null;

        // Captura de Teclado
        let teclasPressionadas = {};
        window.addEventListener('keydown', (e) => { 
            teclasPressionadas[e.key] = true; 
            // Evita a rolagens da página com as setas do teclado
            if(["ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { teclasPressionadas[e.key] = false; });

        function resetarBola() {
            bolaX = largura / 2;
            bolaY = altura / 2;
            let direcao = Math.random() < 0.5 ? -1 : 1;
            
            let trajetoria = document.getElementById('select-trajetoria').value;
            let velSelect = document.getElementById('select-velocidade').value;
            let passoBola = (velSelect === 'lento') ? 0.3 : (velSelect === 'rapido') ? 0.6 : 0.45;

            bolaVx = direcao * passoBola;
            bolaVy = (trajetoria === 'linear') ? 0 : (Math.random() - 0.5) * (passoBola / 2);
        }

        function iniciarJogo() {
            pontosJogador = 0;
            pontosIa = 0;
            jogando = true;
            pausado = false;
            
            atualizarPlacar();
            resetarBola();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(loopJogo, 30); // Loop a cada 30ms (~33 fps)
            
            // Remove o foco do botão para não interferir no uso do teclado
            document.getElementById('btn-inicio').blur();
        }

        function pausarJogo() {
            if (jogando) {
                pausado = !pausado;
                document.getElementById('btn-pausa').innerText = pausado ? "▶ Retomar" : "⏸ Pausar";
            }
        }

        function resetarDataPlotly() {
            let layout = {
                xaxis: { range: [0, largura], showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { range: [0, altura], showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: '#1a1a2e',
                paper_bgcolor: '#0f0f1a',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                showlegend: false
            };
            Plotly.newPlot('grafico-pong', [], layout, {staticPlot: true, responsive: true});
        }

        function loopJogo() {
            if (!jogando || pausado) return;

            let velSelect = document.getElementById('select-velocidade').value;
            let velocidadeJogador = (velSelect === 'lento') ? 0.8 : (velSelect === 'rapido') ? 1.4 : 1.0;
            let velocidadeIa = (velSelect === 'lento') ? 0.25 : (velSelect === 'rapido') ? 0.55 : 0.40;

            // Movimento do Jogador (Setas ou W/S)
            jogadorYAnterior = jogadorY;
            if (teclasPressionadas['ArrowUp'] || teclasPressionadas['w'] || teclasPressionadas['W']) {
                jogadorY = Math.min(jogadorY + velocidadeJogador * 1.5, altura - raqueteAltura);
            }
            if (teclasPressionadas['ArrowDown'] || teclasPressionadas['s'] || teclasPressionadas['S']) {
                jogadorY = Math.max(jogadorY - velocidadeJogador * 1.5, 0);
            }

            let raqueteVy = jogadorY - jogadorYAnterior;

            // Movimento da Bola
            bolaX += bolaVx;
            bolaY += bolaVy;

            let trajetoria = document.getElementById('select-trajetoria').value;
            if (trajetoria === 'spin') {
                bolaVy *= 0.985; // Atrito do ar
            }

            // Colisão com Paredes
            if (bolaY <= 0.5 || bolaY >= altura - 0.5) {
                bolaVy = -bolaVy;
                bolaY = Math.max(0.5, Math.min(altura - 0.5, bolaY));
            }

            // Colisão com Raquete do Jogador
            if (bolaX <= jogadorX + raqueteLargura + 0.3 && 
                bolaX >= jogadorX - 0.3 &&
                bolaY >= jogadorY && 
                bolaY <= jogadorY + raqueteAltura) {
                
                let fatorAceleracao = 1.04;
                let velMaxX = 2.2;
                bolaVx = Math.min(Math.abs(bolaVx) * fatorAceleracao, velMaxX);

                if (trajetoria === 'linear') {
                    bolaVy = 0;
                } else if (trajetoria === 'angular') {
                    let offset = (bolaY - (jogadorY + raqueteAltura / 2)) / (raqueteAltura / 2);
                    bolaVy = Math.max(-0.6, Math.min(0.6, offset * 0.4));
                } else if (trajetoria === 'spin') {
                    let offset = (bolaY - (jogadorY + raqueteAltura / 2)) / (raqueteAltura / 2);
                    let vyBase = offset * 0.3;
                    let efeitoCorte = raqueteVy * 0.8;
                    bolaVy = Math.max(-1.8, Math.min(1.8, vyBase + efeitoCorte));
                }
                bolaX = jogadorX + raqueteLargura + 0.3;
            }

            // Colisão com Raquete da IA
            if (bolaX >= iaX - 0.3 && 
                bolaX <= iaX + raqueteLargura + 0.3 &&
                bolaY >= iaY && 
                bolaY <= iaY + raqueteAltura) {
                
                bolaVx = -Math.min(Math.abs(bolaVx) * 1.04, 2.2);
                if (trajetoria === 'linear') {
                    bolaVy = 0;
                } else {
                    let offset = (bolaY - (iaY + raqueteAltura / 2)) / (raqueteAltura / 2);
                    bolaVy = Math.max(-0.8, Math.min(0.8, offset * 0.6));
                }
                bolaX = iaX - 0.3;
            }

            // Movimento Inteligente da IA
            let centroIa = iaY + raqueteAltura / 2;
            if (bolaVx > 0 || bolaX > largura / 2) {
                if (bolaY > centroIa + 0.6) {
                    iaY = Math.min(iaY + velocidadeIa, altura - raqueteAltura);
                } else if (bolaY < centroIa - 0.6) {
                    iaY = Math.max(iaY - velocidadeIa, 0);
                }
            }

            // Pontuação
            if (bolaX < 0) {
                pontosIa++;
                atualizarPlacar();
                if (pontosIa >= 5) { jogando = false; alert("Fim de jogo! IA Venceu."); }
                else resetarBola();
            } else if (bolaX > largura) {
                pontosJogador++;
                atualizarPlacar();
                if (pontosJogador >= 5) { jogando = false; alert("Fim de jogo! Você Venceu!"); }
                else resetarBola();
            }

            atualizarGraficoPlotly();
        }

        function atualizarPlacar() {
            document.getElementById('placar').innerText = `Jogador: ${pontosJogador} | IA: ${pontosIa}`;
        }

        function atualizarGraficoPlotly() {
            let update = {
                shapes: [
                    // Raquete Jogador
                    { type: 'rect', x0: jogadorX, y0: jogadorY, x1: jogadorX + raqueteLargura, y1: jogadorY + raqueteAltura, fillcolor: '#4a9eff', line: {color: '#4a9eff'} },
                    // Raquete IA
                    { type: 'rect', x0: iaX, y0: iaY, x1: iaX + raqueteLargura, y1: iaY + raqueteAltura, fillcolor: '#ff4a4a', line: {color: '#ff4a4a'} }
                ]
            };

            let traceBola = {
                x: [bolaX],
                y: [bolaY],
                mode: 'markers',
                marker: { color: 'white', size: 16 }
            };

            Plotly.react('grafico-pong', [traceBola], {
                xaxis: { range: [0, largura], showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { range: [0, altura], showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: '#1a1a2e',
                paper_bgcolor: '#0f0f1a',
                margin: { t: 10, b: 10, l: 10, r: 10 },
                shapes: update.shapes,
                showlegend: false
            }, {staticPlot: true});
        }

        // Garante a vinculação dos eventos após a página carregar por completo
        window.onload = function() {
            resetarDataPlotly();
            document.getElementById('btn-inicio').addEventListener('click', iniciarJogo);
            document.getElementById('btn-pausa').addEventListener('click', pausarJogo);
        };
    </script>
</body>
</html>
