<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Estequiometria - Precipitação de PbI₂</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 750px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #334155;
    }

    h2 { margin-top: 0; color: #f8fafc; font-size: 1.4rem; text-align: center; }
    p.subtitle { color: #94a3b8; margin: 0 0 16px 0; text-align: center; font-size: 0.88rem; }

    .equation-display {
      background-color: #020617;
      border: 1px solid #3b82f6;
      color: #60a5fa;
      font-size: 1.2rem;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .box h4 { margin: 0; color: #38bdf8; font-size: 0.95rem; }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    input[type=number] {
      width: 80px;
      padding: 4px 8px;
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 4px;
      text-align: right;
    }

    input[type=number]:disabled {
      background-color: #0f172a;
      color: #64748b;
      border-color: #334155;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.88rem;
    }

    .results-table th, .results-table td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: center;
    }

    .results-table th { background-color: #0f172a; color: #94a3b8; }
    .results-table td { background-color: #1e293b; }

    .badge-limitante {
      background-color: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-excesso {
      background-color: #eab308;
      color: black;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-estequiometrico {
      background-color: #10b981;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .summary-card {
      margin-top: 16px;
      padding: 12px;
      background-color: #020617;
      border: 1px solid #10b981;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      color: #a7f3d0;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador Estequiométrico: Precipitação do PbI₂</h2>
    <p class="subtitle">Pb(NO₃)₂ (aq) + 2 KI (aq) → PbI₂ (s) ↓ + 2 KNO₃ (aq)</p>

    <!-- Visualização da Equação Balanceada -->
    <div class="equation-display" id="eq-display">
      1 Pb(NO₃)₂ + 2 KI → 1 PbI₂
    </div>

    <div class="grid-container">
      <!-- Nitrato de Chumbo(II) -->
      <div class="box">
        <h4>Reagente A: Pb(NO₃)₂</h4>
        <div class="input-row">
          <label>Coeficiente (a):</label>
          <input type="number" id="coef-a" value="1.00" step="0.01" min="0.01">
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-a" value="331.2" step="0.1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Inicial (g):</label>
          <input type="number" id="massa-a" value="0.1656" step="0.0001" min="0">
        </div>
      </div>

      <!-- Iodeto de Potássio -->
      <div class="box">
        <h4>Reagente B: KI</h4>
        <div class="input-row">
          <label>Coeficiente (b):</label>
          <input type="number" id="coef-b" value="2.00" step="0.01" min="0.01">
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-b" value="166.0" step="0.1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Inicial (g):</label>
          <input type="number" id="massa-b" value="0.1660" step="0.0001" min="0">
        </div>
      </div>

      <!-- Iodeto de Chumbo(II) -->
      <div class="box">
        <h4>Produto C: PbI₂ (s)</h4>
        <div class="input-row">
          <label>Coeficiente (c):</label>
          <input type="number" id="coef-c" value="1" min="1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-c" value="461.0" step="0.1" disabled>
        </div>
      </div>

      <!-- Configuração de Rendimento da Reação -->
      <div class="box">
        <h4>Condições Globais</h4>
        <div class="input-row">
          <label>Rendimento (η %):</label>
          <input type="number" id="rendimento" value="100" min="1" max="100" disabled>
        </div>
      </div>
    </div>

    <!-- Tabela do Balanço de Massa e Mols -->
    <table class="results-table">
      <thead>
        <tr>
          <th>Substância</th>
          <th>Status</th>
          <th>Mols Iniciais</th>
          <th>Mols Consumidos / Formados</th>
          <th>Massa Final (g)</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Preenchido dinamicamente pelo JavaScript -->
      </tbody>
    </table>

    <div class="summary-card" id="summary">
      <!-- Resumo estequiométrico final -->
    </div>
  </div>

  <script>
    // Elementos do DOM
    const eqDisplay = document.getElementById('eq-display');
    const tableBody = document.getElementById('table-body');
    const summary = document.getElementById('summary');

    const coefAInput = document.getElementById('coef-a');
    const massaAInput = document.getElementById('massa-a');
    const coefBInput = document.getElementById('coef-b');
    const massaBInput = document.getElementById('massa-b');

    // Constantes de massa base equivalente a 1 unidade do coeficiente
    // Base: 1.0 mL de Pb(NO3)2 0.5 M = 0.1656 g (Coeficiente = 1)
    // Base: 0.5 mL de KI 0.5 M = 0.0830 g (Coeficiente = 1 => 2 = 0.1660 g)
    const BASE_MASS_A = 0.1656;
    const BASE_MASS_B = 0.0830;

    // Vinculação bidirecional de inputs
    coefAInput.addEventListener('input', () => {
      const coef = parseFloat(coefAInput.value) || 0;
      massaAInput.value = (coef * BASE_MASS_A).toFixed(4);
      calcularEstequiometria();
    });

    massaAInput.addEventListener('input', () => {
      const massa = parseFloat(massaAInput.value) || 0;
      coefAInput.value = (massa / BASE_MASS_A).toFixed(2);
      calcularEstequiometria();
    });

    coefBInput.addEventListener('input', () => {
      const coef = parseFloat(coefBInput.value) || 0;
      massaBInput.value = (coef * BASE_MASS_B).toFixed(4);
      calcularEstequiometria();
    });

    massaBInput.addEventListener('input', () => {
      const massa = parseFloat(massaBInput.value) || 0;
      coefBInput.value = (massa / BASE_MASS_B).toFixed(2);
      calcularEstequiometria();
    });

    function calcularEstequiometria() {
      // 1. Ler valores de entrada
      const a = parseFloat(coefAInput.value) || 0;
      const b = parseFloat(coefBInput.value) || 0;
      const c = parseFloat(document.getElementById('coef-c').value) || 1;

      const mmA = parseFloat(document.getElementById('mm-a').value) || 331.2;
      const mmB = parseFloat(document.getElementById('mm-b').value) || 166.0;
      const mmC = parseFloat(document.getElementById('mm-c').value) || 461.0;

      const massaA = parseFloat(massaAInput.value) || 0;
      const massaB = parseFloat(massaBInput.value) || 0;

      const rendimento = (parseFloat(document.getElementById('rendimento').value) || 100) / 100;

      // 2. Atualizar Display da Equação
      const displayA = parseFloat(a.toFixed(2));
      const displayB = parseFloat(b.toFixed(2));
      eqDisplay.textContent = `${displayA} Pb(NO₃)₂ + ${displayB} KI → ${c} PbI₂`;

      // 3. Converter massas para Mols (n = m / MM)
      const nA = massaA / mmA;
      const nB = massaB / mmB;

      // 4. Determinar a Proporção Estequiométrica em relação à equação estequiométrica fundamental (1 Pb(NO3)2 : 2 KI)
      const propA = nA / 1;
      const propB = nB / 2;

      // Tolerância para identificar proporcionalidade exata (1:2)
      const diff = Math.abs(propA - propB);
      let limitante = '';
      let reacoesPossiveis = 0;

      if (diff < 1e-6) {
        limitante = 'ESTEQUIOMETRICO';
        reacoesPossiveis = propA;
      } else if (propA < propB) {
        limitante = 'A';
        reacoesPossiveis = propA;
      } else {
        limitante = 'B';
        reacoesPossiveis = propB;
      }

      // 5. Aplicar Rendimento Teórico
      const reacoesEfetivas = reacoesPossiveis * rendimento;

      // 6. Calcular Consumo e Formação de Mols conforme coeficientes da reação balanceada (1:2->1)
      const nA_consumido = reacoesEfetivas * 1;
      const nB_consumido = reacoesEfetivas * 2;
      const nC_formado = reacoesEfetivas * c;

      // Mols e Massas restantes
      const nA_final = Math.max(0, nA - nA_consumido);
      const nB_final = Math.max(0, nB - nB_consumido);

      const massaA_final = nA_final * mmA;
      const massaB_final = nB_final * mmB;
      const massaC_final = nC_formado * mmC;

      // Status das Badges
      let badgeA = '';
      let badgeB = '';

      if (limitante === 'ESTEQUIOMETRICO') {
        badgeA = '<span class="badge-estequiometrico">PROPORCIONAL</span>';
        badgeB = '<span class="badge-estequiometrico">PROPORCIONAL</span>';
      } else {
        badgeA = limitante === 'A' ? '<span class="badge-limitante">LIMITANTE</span>' : '<span class="badge-excesso">EXCESSO</span>';
        badgeB = limitante === 'B' ? '<span class="badge-limitante">LIMITANTE</span>' : '<span class="badge-excesso">EXCESSO</span>';
      }

      // 7. Renderizar a Tabela
      tableBody.innerHTML = `
        <tr>
          <td><b>Pb(NO₃)₂</b></td>
          <td>${badgeA}</td>
          <td>${nA.toFixed(5)} mol</td>
          <td>-${nA_consumido.toFixed(5)} mol</td>
          <td><b>${massaA_final.toFixed(4)} g</b></td>
        </tr>
        <tr>
          <td><b>KI</b></td>
          <td>${badgeB}</td>
          <td>${nB.toFixed(5)} mol</td>
          <td>-${nB_consumido.toFixed(5)} mol</td>
          <td><b>${massaB_final.toFixed(4)} g</b></td>
        </tr>
        <tr>
          <td><b>PbI₂ (Precipitado)</b></td>
          <td><span style="color:#10b981;">PRODUTO</span></td>
          <td>0.00000 mol</td>
          <td>+${nC_formado.toFixed(5)} mol</td>
          <td><b>${massaC_final.toFixed(4)} g</b></td>
        </tr>
      `;

      // 8. Gerar Resumo Explicativo
      if (limitante === 'ESTEQUIOMETRICO') {
        summary.innerHTML = `
          🎯 <b>Análise da Reação:</b><br>
          • Os reagentes estão em <b>proporção estequiométrica ideal (1 : 2)</b>. Ambos são consumidos totalmente.<br>
          • Com rendimento de <b>${(rendimento * 100).toFixed(0)}%</b>, a massa obtida de precipitado (PbI₂) é de <b>${massaC_final.toFixed(4)} g</b>.
        `;
      } else {
        const limitanteNome = limitante === 'A' ? 'Pb(NO₃)₂' : 'KI';
        const excessoNome = limitante === 'A' ? 'KI' : 'Pb(NO₃)₂';
        const massaExcessoFinal = limitante === 'A' ? massaB_final : massaA_final;

        summary.innerHTML = `
          🎯 <b>Análise da Reação:</b><br>
          • O reagente limitante é o <b>${limitanteNome}</b>.<br>
          • Sobrarão <b>${massaExcessoFinal.toFixed(4)} g</b> de reagente em excesso (<b>${excessoNome}</b>).<br>
          • Com rendimento de <b>${(rendimento * 100).toFixed(0)}%</b>, a massa de precipitado amarelado (PbI₂) obtida é de <b>${massaC_final.toFixed(4)} g</b>.
        `;
      }
    }

    // Execução inicial
    calcularEstequiometria();
  </script>
</body>
</html>
