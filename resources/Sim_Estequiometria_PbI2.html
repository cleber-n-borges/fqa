<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Estequiometria - Precipitação de PbI₂</title>
  <style>
    /* ============================================================
       CORES - Tema Cosmo (AZUL)
       ============================================================ */
    :root {
      --primary: #2780E3;
      --primary-light: #6ea8fe;
      --primary-dark: #1a5fb4;
      --primary-bg: #e7f1ff;
      --bg-main: #f8f9fa;
      --card-shadow: 0 12px 40px rgba(39, 128, 227, 0.10);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: var(--bg-main);
      color: #2d3436;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 750px;
      width: 100%;
      border: 1px solid #e9ecef;
    }

    h2 { 
      margin-top: 0; 
      color: #1a1a2e; 
      font-size: 1.4rem; 
      text-align: center; 
      font-weight: 700;
    }
    
    p.subtitle { 
      color: #6c757d; 
      margin: 0 0 16px 0; 
      text-align: center; 
      font-size: 0.88rem; 
    }

    .equation-display {
      background-color: var(--primary-bg);
      border: 1px solid var(--primary-light);
      color: var(--primary-dark);
      font-size: 1.2rem;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .box {
      background-color: #fafbfc;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .box h4 { 
      margin: 0 0 4px 0; 
      color: var(--primary); 
      font-size: 0.95rem; 
      font-weight: 600;
    }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #495057;
    }

    input[type=number] {
      width: 85px;
      padding: 4px 8px;
      background-color: #ffffff;
      border: 1px solid #ced4da;
      color: #1a1a2e;
      border-radius: 6px;
      text-align: right;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    input[type=number]:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(39, 128, 227, 0.12);
    }

    input[type=number]:disabled {
      background-color: #e9ecef;
      color: #868e96;
      border-color: #dee2e6;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.88rem;
    }

    .results-table th, .results-table td {
      border: 1px solid #e9ecef;
      padding: 8px 12px;
      text-align: center;
    }

    .results-table th { 
      background-color: var(--primary-bg); 
      color: #495057; 
      font-weight: 600;
    }

    .results-table td { 
      background-color: #ffffff; 
      color: #1a1a2e;
    }

    .badge-limitante {
      background-color: #dc3545;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-excesso {
      background-color: #e67e22;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-estequiometrico {
      background-color: #27ae60;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-produto {
      background-color: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .summary-card {
      margin-top: 16px;
      padding: 14px 16px;
      background-color: rgba(39, 128, 227, 0.06);
      border: 1px solid var(--primary-light);
      border-radius: 12px;
      width: 100%;
      color: var(--primary-dark);
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador Estequiométrico: Precipitação do PbI₂</h2>
    <p class="subtitle">Pb(NO₃)₂ (aq) + 2 KI (aq) → PbI₂ (s) ↓ + 2 KNO₃ (aq)</p>

    <!-- Visualização da Equação Balanceada -->
    <div class="equation-display" id="eq-display">
      1 Pb(NO₃)₂ + 2 KI → 1 PbI₂
    </div>

    <div class="grid-container">
      <!-- Nitrato de Chumbo(II) em Solução -->
      <div class="box">
        <h4>Reagente A: Pb(NO₃)₂ (aq)</h4>
        <div class="input-row">
          <label>Coeficiente (a):</label>
          <input type="number" id="coef-a" value="1" disabled>
        </div>
        <div class="input-row">
          <label>Concentração (mol/L):</label>
          <input type="number" id="conc-a" value="0.50" step="0.01" min="0">
        </div>
        <div class="input-row">
          <label>Volume (mL):</label>
          <input type="number" id="vol-a" value="1.00" step="0.1" min="0">
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-a" value="331.2" step="0.1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Inicial (g):</label>
          <input type="number" id="massa-a" value="0.1656" step="0.0001" disabled>
        </div>
      </div>

      <!-- Iodeto de Potássio em Solução -->
      <div class="box">
        <h4>Reagente B: KI (aq)</h4>
        <div class="input-row">
          <label>Coeficiente (b):</label>
          <input type="number" id="coef-b" value="2" disabled>
        </div>
        <div class="input-row">
          <label>Concentração (mol/L):</label>
          <input type="number" id="conc-b" value="0.50" step="0.01" min="0">
        </div>
        <div class="input-row">
          <label>Volume (mL):</label>
          <input type="number" id="vol-b" value="2.00" step="0.1" min="0">
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-b" value="166.0" step="0.1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Inicial (g):</label>
          <input type="number" id="massa-b" value="0.1660" step="0.0001" disabled>
        </div>
      </div>

      <!-- Iodeto de Chumbo(II) -->
      <div class="box">
        <h4>Produto C: PbI₂ (s)</h4>
        <div class="input-row">
          <label>Coeficiente (c):</label>
          <input type="number" id="coef-c" value="1" min="1" disabled>
        </div>
        <div class="input-row">
          <label>Massa Molar (g/mol):</label>
          <input type="number" id="mm-c" value="461.0" step="0.1" disabled>
        </div>
      </div>

      <!-- Configuração de Rendimento da Reação -->
      <div class="box">
        <h4>Condições Globais</h4>
        <div class="input-row">
          <label>Rendimento (η %):</label>
          <input type="number" id="rendimento" value="100" min="1" max="100" disabled>
        </div>
      </div>
    </div>

    <!-- Tabela do Balanço de Massa e Mols -->
    <table class="results-table">
      <thead>
        <tr>
          <th>Substância</th>
          <th>Status</th>
          <th>Mols Iniciais</th>
          <th>Mols Consumidos / Formados</th>
          <th>Massa Final (g)</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Preenchido dinamicamente pelo JavaScript -->
      </tbody>
    </table>

    <div class="summary-card" id="summary">
      <!-- Resumo estequiométrico final -->
    </div>
  </div>

  <script>
    // Elementos do DOM
    const eqDisplay = document.getElementById('eq-display');
    const tableBody = document.getElementById('table-body');
    const summary = document.getElementById('summary');

    const coefAInput = document.getElementById('coef-a');
    const concAInput = document.getElementById('conc-a');
    const volAInput = document.getElementById('vol-a');
    const massaAInput = document.getElementById('massa-a');

    const coefBInput = document.getElementById('coef-b');
    const concBInput = document.getElementById('conc-b');
    const volBInput = document.getElementById('vol-b');
    const massaBInput = document.getElementById('massa-b');

    // Escutadores de eventos para Concentração e Volume dos Reagentes
    concAInput.addEventListener('input', calcularEstequiometria);
    volAInput.addEventListener('input', calcularEstequiometria);
    concBInput.addEventListener('input', calcularEstequiometria);
    volBInput.addEventListener('input', calcularEstequiometria);

    function calcularEstequiometria() {
      const a = parseFloat(coefAInput.value) || 1;
      const b = parseFloat(coefBInput.value) || 2;
      const c = parseFloat(document.getElementById('coef-c').value) || 1;

      const mmA = parseFloat(document.getElementById('mm-a').value) || 331.2;
      const mmB = parseFloat(document.getElementById('mm-b').value) || 166.0;
      const mmC = parseFloat(document.getElementById('mm-c').value) || 461.0;

      // 1. Ler Concentrações (mol/L) e Volumes (mL)
      const concA = parseFloat(concAInput.value) || 0;
      const volA = parseFloat(volAInput.value) || 0;

      const concB = parseFloat(concBInput.value) || 0;
      const volB = parseFloat(volBInput.value) || 0;

      // 2. Calcular Mols Iniciais de Reagente em Solução: n = C * V(L)
      const nA = concA * (volA / 1000);
      const nB = concB * (volB / 1000);

      // 3. Recalcular e Atualizar Massas Iniciais (g)
      const massaA = nA * mmA;
      const massaB = nB * mmB;

      massaAInput.value = massaA.toFixed(4);
      massaBInput.value = massaB.toFixed(4);

      const rendimento = (parseFloat(document.getElementById('rendimento').value) || 100) / 100;

      // 4. Manter Display da Equação Fixo com os Coeficientes Reais da Reação Balanceada
      eqDisplay.textContent = `${a} Pb(NO₃)₂ + ${b} KI → ${c} PbI₂`;

      // 5. Determinar a Proporção Estequiométrica em relação à equação balanceada (1 Pb(NO3)2 : 2 KI)
      const propA = nA / a;
      const propB = nB / b;

      // Tolerância para identificar proporcionalidade exata (1:2)
      const diff = Math.abs(propA - propB);
      let limitante = '';
      let reacoesPossiveis = 0;

      if (diff < 1e-6) {
        limitante = 'ESTEQUIOMETRICO';
        reacoesPossiveis = propA;
      } else if (propA < propB) {
        limitante = 'A';
        reacoesPossiveis = propA;
      } else {
        limitante = 'B';
        reacoesPossiveis = propB;
      }

      // 6. Aplicar Rendimento Teórico
      const reacoesEfetivas = reacoesPossiveis * rendimento;

      // 7. Calcular Consumo e Formação de Mols conforme coeficientes da reação balanceada (1:2->1)
      const nA_consumido = reacoesEfetivas * a;
      const nB_consumido = reacoesEfetivas * b;
      const nC_formado = reacoesEfetivas * c;

      // Mols e Massas restantes
      const nA_final = Math.max(0, nA - nA_consumido);
      const nB_final = Math.max(0, nB - nB_consumido);

      const massaA_final = nA_final * mmA;
      const massaB_final = nB_final * mmB;
      const massaC_final = nC_formado * mmC;

      // Status das Badges
      let badgeA = '';
      let badgeB = '';

      if (limitante === 'ESTEQUIOMETRICO') {
        badgeA = '<span class="badge-estequiometrico">PROPORCIONAL</span>';
        badgeB = '<span class="badge-estequiometrico">PROPORCIONAL</span>';
      } else {
        badgeA = limitante === 'A' ? '<span class="badge-limitante">LIMITANTE</span>' : '<span class="badge-excesso">EXCESSO</span>';
        badgeB = limitante === 'B' ? '<span class="badge-limitante">LIMITANTE</span>' : '<span class="badge-excesso">EXCESSO</span>';
      }

      // 8. Renderizar a Tabela
      tableBody.innerHTML = `
        <tr>
          <td><b>Pb(NO₃)₂</b></td>
          <td>${badgeA}</td>
          <td>${nA.toFixed(5)} mol</td>
          <td>-${nA_consumido.toFixed(5)} mol</td>
          <td><b>${massaA_final.toFixed(4)} g</b></td>
        </tr>
        <tr>
          <td><b>KI</b></td>
          <td>${badgeB}</td>
          <td>${nB.toFixed(5)} mol</td>
          <td>-${nB_consumido.toFixed(5)} mol</td>
          <td><b>${massaB_final.toFixed(4)} g</b></td>
        </tr>
        <tr>
          <td><b>PbI₂ (Precipitado)</b></td>
          <td><span class="badge-produto">PRODUTO</span></td>
          <td>0.00000 mol</td>
          <td>+${nC_formado.toFixed(5)} mol</td>
          <td><b>${massaC_final.toFixed(4)} g</b></td>
        </tr>
      `;

      // 9. Gerar Resumo Explicativo
      if (limitante === 'ESTEQUIOMETRICO') {
        summary.innerHTML = `
          🎯 <b>Análise da Reação:</b><br>
          • Os reagentes estão em <b>proporção estequiométrica ideal (1 : 2)</b>. Ambos são consumidos totalmente.<br>
          • Com rendimento de <b>${(rendimento * 100).toFixed(0)}%</b>, a massa obtida de precipitado (PbI₂) é de <b>${massaC_final.toFixed(4)} g</b>.
        `;
      } else {
        const limitanteNome = limitante === 'A' ? 'Pb(NO₃)₂' : 'KI';
        const excessoNome = limitante === 'A' ? 'KI' : 'Pb(NO₃)₂';
        const massaExcessoFinal = limitante === 'A' ? massaB_final : massaA_final;

        summary.innerHTML = `
          🎯 <b>Análise da Reação:</b><br>
          • O reagente limitante é o <b>${limitanteNome}</b>.<br>
          • Sobrarão <b>${massaExcessoFinal.toFixed(4)} g</b> de reagente em excesso (<b>${excessoNome}</b>).<br>
          • Com rendimento de <b>${(rendimento * 100).toFixed(0)}%</b>, a massa de precipitado amarelado (PbI₂) obtida é de <b>${massaC_final.toFixed(4)} g</b>.
        `;
      }
    }

    // Execução inicial
    calcularEstequiometria();
  </script>

<script>
  (function() {
    let lastHeight = 0;

    function sendHeight() {
      // Busca o contêiner principal do simulador de estequiometria
      const appContainer = document.querySelector('.card');
      if (!appContainer) return;

      // Pega a altura real do contêiner + margem interna de segurança
      const currentHeight = appContainer.offsetHeight + 30;

      // Só envia mensagem se a altura realmente mudar mais de 5px (evita loops)
      if (Math.abs(currentHeight - lastHeight) > 5) {
        lastHeight = currentHeight;
        window.parent.postMessage({
          type: 'iframeResize',
          height: currentHeight
        }, '*');
      }
    }

    // Expositor global para chamadas externas se necessário
    window.sendHeight = sendHeight;

    // Dispara no carregamento inicial da página e no redimensionamento da janela
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);

    // Dispara em cliques (interações com inputs, botões, etc.)
    document.addEventListener('click', function() {
      sendHeight();
      setTimeout(sendHeight, 150);
    });

    // Dispara também quando o usuário digita nos campos de texto
    document.addEventListener('input', function() {
      sendHeight();
      setTimeout(sendHeight, 150);
    });

    // Observa mudanças de conteúdo no DOM (ex: quando a tabela e o resumo recalculam)
    window.addEventListener('DOMContentLoaded', function() {
      sendHeight();
      const observer = new MutationObserver(function() {
        sendHeight();
      });

      const cardElement = document.querySelector('.card');
      if (cardElement) {
        observer.observe(cardElement, {
          childList: true,
          subtree: true,
          characterData: true
        });
      }
    });
  })();
</script>


</body>
</html>
