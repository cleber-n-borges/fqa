                " nm\nagora λ " + lam + " nm · Δλ " + dlam + " nm\nrefaça o autozero" };
      }
      if (ref.kind === "water"){
        /* O valor do branco vem de brancoEfetivo(lam), NÃO da constante
           ABLK: o branco integrado na banda varia com λ e Δλ, e esta
           mensagem precisa concordar com a linha 2 do .formula — que usa
           exatamente a mesma função. Antes exibia ABLK fixo (0,030) e
           divergia da fórmula fora de λ=430 nm. */
        return { dot:"warn", txt:"referência: ÁGUA (zerada sem o branco)\na leitura inclui a absorbância do branco reagente (+" + fmt(brancoEfetivo(lam),3) + " A)\n○ a referência de água NÃO desconta o branco" };
      }
      /* Branco reagente válido. Se a luz parasita estiver ligada, deixa
         EXPLÍCITO na tela que a referência é um valor congelado do
         instante do autozero — e que por isso o efeito da parasita
         aparece por inteiro na leitura (não é cancelado pela referência). */
      var linhas = "λ " + ref.lam + " nm · Δλ " + ref.dlam + " nm";
      linhas += "\nreferência CONGELADA no autozero: A = " + fmt(ref.A,3) + " A";
      if (strayOn){
        linhas += "\n○ luz parasita ligada DEPOIS do autozero não altera a referência";
        linhas += "\n○ por isso o efeito da parasita aparece inteiro na leitura";
      }
      return { dot:"ok", txt:"referência: branco reagente\n" + linhas };
    }

    /* syncSliderLabels(amaxAtual) — mantém o slider Y do espectro coerente
       com o modo atual: em AUTO o rótulo mostra "auto" e o slider fica
       esmaecido (.is-auto); em MANUAL mostra o teto numérico e aparece o
       atalho "auto" para voltar. amaxAtual é o teto calculado no último
       plotSpectrum() (lido de dataset.amax), usado só no modo AUTO. */
    function syncSliderLabels(amaxAtual){
      if (el.spylab) el.spylab.textContent = specYAuto ? "auto" : fmt(specYMax,2);
      if (el.spy){
        var shown = specYAuto ? (amaxAtual || AMAXHI) : specYMax;
        el.spy.value = shown;
        el.spy.classList.toggle("is-auto", specYAuto);
      }
      if (el.spyauto){
        el.spyauto.classList.toggle("hidden", specYAuto);
      }
      if (el.calylab) el.calylab.textContent = fmt(calYMax,2);
    }

    /* ================================================================
       update() — O CÉREBRO DA SIMULAÇÃO. Recalcula TODA a tela a partir
       do estado atual. É chamada por qualquer controle que mude estado
       (λ, fenda, c, referência, luz parasita, reset, cenário).

       Ordem de trabalho:
         1. gira prisma e raios para o λ escolhido (palco Q1)
         2. acende feixe/cubeta/detector conforme a transmitância
         3. escreve o mostrador do Q1 (λ, %T, sinal, A)
         4. escreve o diagnóstico do Q3 (status, aviso, desvio, fórmula, ajuste)
         5. agenda o redesenho dos gráficos (draw) e reenvia a altura

       Nada aqui lê o DOM para decidir física: física vem do estado,
       e o DOM é apenas o destino da escrita. */
    function update(){
      /* --- 1. posiciona o prisma e o leque de raios para o λ atual ---
         O prisma gira METADE do ângulo do leque: é o efeito didático de
         "dispersão" — pequena rotação do prisma, grande separação de cores. */
      var th = -alphaOf(lam);
      el.rays.style.transform   = "rotate(" + th.toFixed(2) + "deg)";
      el.prisma.style.transform = "rotate(" + (th*0.5).toFixed(2) + "deg)";

      /* --- 2. realce dos raios dentro da banda da fenda ---
         "half" é a meia-largura efetiva da banda (fenda + folga de 2,6°);
         os raios dentro dela ficam mais opacos e contribuem para a COR do
         feixe (média ponderada). "best" guarda o raio mais próximo de λ,
         que recebe a classe .ray--sel (mais espesso e brilhante).
         beamCol é a cor resultante — é ela que pinta o feixe de entrada. */
      var half = dlam/2 + 2.6;
      var best = 0, bestD = 1e9;
      var mR=0,mG=0,mB=0,mW=0;
      for (var k2 = 0; k2 < N; k2++){
        var dj = Math.abs(rayL[k2] - lam);
        if (dj <= half){
          var wgt = Math.max(0, 1 - dj/half);
          var cc = wlRGB(rayL[k2]);
          mR += cc[0]*wgt; mG += cc[1]*wgt; mB += cc[2]*wgt; mW += wgt;
          rayEls[k2].style.opacity = (0.5 + 0.5*wgt).toFixed(2);
          if (dj < bestD){ bestD = dj; best = k2; }
        } else {
          rayEls[k2].style.opacity = "0.28";
        }
      }
      rayEls.forEach(function(r,k3){ r.classList.toggle("ray--sel", k3 === best); });
      var beamCol = mW > 0 ? [mR/mW, mG/mW, mB/mW] : wlRGB(lam);

      /* --- 3. óptica: transmitância e mostrador do Q1 ---
         AI   = absorbância lida (com autozero)
         TM   = transmitância = 10^(−A), limitada a [−9, 9] para não gerar
                números absurdos se A explodir (ex.: luz parasita + c alta)
         col  = cor do λ atual, usada no chip e nos elementos ópticos
         As opacidades de .bi (feixe I) e .det (detector) são proporcionais
         a TM: mais luz atravessa → detector mais aceso. A cubeta (.liq)
         fica mais escura conforme a concentração sobe. */
      var cV = C();
      var AI = A_instr(lam);
      var TM = Math.pow(10, -Math.max(-9, Math.min(9, AI)));
      var col = wlRGB(lam);
      el.io.style.background = rgbCss(beamCol);
      el.bi.style.background = rgbCss(col);
      el.bi.style.opacity    = (0.10 + 0.90*Math.max(0,Math.min(1,TM))).toFixed(2);
      el.det.style.background = rgbCss(col);
      el.det.style.opacity    = (0.08 + 0.92*Math.max(0,Math.min(1,TM))).toFixed(2);
      el.liq.style.opacity    = (0.10 + 0.60*(cV/100)).toFixed(2);

      el.chip.style.background = rgbCss(col);
      el.lam.textContent = lam + " nm";
      el.t.textContent = fmt(TM*100, 1);
      el.sig.textContent = fmtSig(100*srcI(lam)*Math.max(0,Math.min(1, (1-S)*bandT(lam,cV,dlam) + S))) + "%";
      el.a.textContent  = fmt(AI,3) + " A";
      el.a.classList.toggle("disp--raw", !refOK());
      el.c.textContent  = "c = " + fmt(cV, cV < 10 ? 1 : 0) + " mg·L⁻¹ de P";
      el.dl.textContent = dlam + " nm";
      el.dl2.textContent = lam + " nm";
      if (el.cslider) el.cslider.value = cV;
      if (el.csl) el.csl.textContent = fmt(cV, 1);
      el.dec.disabled = (cV <= 0);
      el.inc.disabled = (cV >= CMAX);

      /* --- 4a. linha de status da referência (.status) ---
         zeroInfo() devolve { dot, txt }. O texto já vem com '\n' para
         sair uma frase por linha (CSS white-space:pre-line). */
      var zi = zeroInfo();
      el.dot.className = "dot " + zi.dot;
      el.stat.textContent = zi.txt;

      /* DECOMPOSIÇÃO DO DESVIO (bloco .dev):
           dev  = ideal_instr − A_instr      → desvio TOTAL (banda + parasita)
           devS = ideal_instr − A_instr_ns   → parcela atribuída à BANDA (Δλ)
           devP = dev − devS                 → parcela atribuída à LUZ PARASITA
         A barra (.devbar) satura em DEVFULL = 0,5 A; as cores mudam em
         DEVWARN (verde) e 0,10 A (amarelo → vermelho).

         ⚠️ NOTA DE DESIGN (item analisado e MANTIDO — NÃO é bug):
         esta decomposição é CONTRAFACTUAL, não uma separação de
         perturbações físicas independentes. Os dois termos vêm de
         comparar ESTADOS do modelo:
             devS = (ideal) − (leitura sem parasita)   → o que a fenda faz
             devP = (leitura sem parasita) − (leitura com parasita)
         A luz parasita entra MULTIPLICATIVAMENTE na transmitância
         (T_ef = (1−S)·T + S), ANTES do log10, então os dois efeitos não
         são aditivos no sentido físico estrito — a soma dev = devS+devP
         é uma identidade da DEFINIÇÃO adotada, não uma lei do modelo.
         Isso é perfeitamente útil didaticamente (isola de onde vem o
         desvio), mas os rótulos "parcela atribuída" foram escolhidos
         justamente para não sugerir independência física. */
      var dev = ideal_instr(lam) - A_instr(lam);
      var devS= ideal_instr(lam) - A_instr_ns(lam);
      var devP= dev - devS;
      var ad  = Math.abs(dev);
      var pct = Math.min(100, ad/DEVFULL*100);
      el.devfill.style.width = pct.toFixed(1) + "%";
      el.devfill.style.background = ad < DEVWARN ? "#3fdc6a" : (ad < 0.10 ? "#ffc233" : "#ff5a5a");

      /* Causa dominante: compara o módulo das duas parcelas. Se a luz
         parasita pesa mais que a banda, ela é apontada como culpada. */
      var causa = Math.abs(devP) >= Math.abs(devS) ? "luz parasita" : "banda espectral " + dlam + " nm";
      var txt = "Δ (ideal − medido) = <b>" + fmtS(dev,3) + " A</b>\n" +
                "fenda: " + fmtS(devS,3) + " A\n" +
                "luz parasita: " + fmtS(devP,3) + " A";
      if (ad >= DEVWARN){
        txt += '\n<span class="bad">causa dominante: ' + causa + "</span>";
        if (dev < 0) txt += "\nmedido ACIMA do ideal (suavização da banda em vale)";
      }
      el.dev.innerHTML = txt;

      /* .warnbox — só aparece quando o desvio da lei de Beer é GRANDE
         (>= 0.05 A). Abaixo disso fica vazio, mas a altura está reservada
         pelo CSS (min-height), então o card não se move. */
      el.warn.textContent = ad >= 0.05
        ? "desvio da lei de Beer\nA medido (" + fmt(AI,3) + ") " +
          (dev > 0 ? "<" : ">") + " ideal (" + fmt(ideal_instr(lam),3) + ")\ndesvio " + fmtS(dev,3) + " A"
        : "";

      /* ------------------------------------------------------------------
         --- 4b. BLOCO .formula — A LEI DE BEER E A LEITURA DO INSTRUMENTO
         ------------------------------------------------------------------
         REGRA DE OURO DESTE BLOCO: a lei de Beer NUNCA é alterada para
         "fazer a conta fechar". Ela é uma identidade física:

             A = ε·b·c        (somente o analito; NUNCA tem termo aditivo)

         O que pode acontecer é o INSTRUMENTO ler mais do que a lei prevê,
         quando a referência não desconta o branco reagente:

             A_lido = A + A_branco     (modelo do INSTRUMENTO, não de Beer)

         São DUAS equações diferentes e o aluno precisa ver as duas. Por
         isso este bloco é montado em até TRÊS linhas, cada uma uma
         igualdade VERDADEIRA e conferível na calculadora:

           linha 1  lei de Beer      A = ε·b·c        (sempre aparece)
           linha 2  leitura atual    A_lido = ...     (só quando difere de Beer)
           linha 3  aviso em vermelho                  (só quando não é branco)

         Os três estados possíveis vêm de refEstado():

           "blank" → leitura JÁ é Beer. Só a linha 1. Nada a somar.
           "water" → linha 1 + linha 2 com o branco EXPLÍCITO:
                       A_lido = A + A_branco
                     0,270 = 0,240 + 0,030
                     (o +0,030 é o branco reagente que a água não continha)
           "none"/"stale" → linha 1 + linha 2 diferente, porque NÃO há
                     branco descontado nem resíduo: é leitura crua.
                       A_lido = A (sem referência) + A_branco
                     O texto deixa claro que o termo do branco está
                     presente por AUSÊNCIA de autozero, não por escolha.

         A_branco é calculado UMA vez em `brancoA` e é A MESMA EXPRESSÃO
         que ideal_instr() usa internamente (ABLK * blkRel(lam)). Usar a
         mesma expressão garante que os dois números nunca divirjam — se
         um dia ABLK mudar, os dois lados acompanham juntos.

         NOTA HISTÓRICA (evita regressão): antes, este bloco escrevia
         `A = ε·b·c → 0,270 = 0,0600 × 4,0 × 1` no cenário de água, o que
         era FALSO (0,0600×4,0 = 0,240). A correção tentadora seria somar
         o branco ao lado direito da lei de Beer, produzindo
         `0,270 = 0,240 + 0,030` sob o rótulo "A = ε·b·c" — o que também
         é fisicamente errado: ensina que a lei de Beer tem termo aditivo.
         A solução adotada separa as duas equações em duas linhas.
         ------------------------------------------------------------------ */
      var kk = k(lam);
      var eh = ideal_instr(lam);
      var est = refEstado();
      /* brancoA — valor EXIBIDO na linha 2. Vem de brancoEfetivo(), a
         fonte única lida também por zeroInfo(), .fitnote e o CSV. NÃO
         recalcular aqui: se este número divergir do que aparece na linha
         de status (.status), o aluno vê dois valores para o mesmo branco
         dentro do mesmo card Q3. */
      var brancoA = brancoEfetivo(lam);
      var cTxt = fmt(cV, cV < 10 ? 1 : 0);

      /* linha 1 — sempre: a lei de Beer, com os números substituídos.
         Aqui usamos A_ideal (Beer PURO, k·c) e NÃO ideal_instr, porque
         ideal_instr pode carregar o branco e esta linha deve mostrar a
         lei de Beer limpa. O ideal_instr continua sendo exibido — mas na
         linha 2, como "A_lido". */
      var fBeer = "A = ε·b·c → <b>" + fmt(A_ideal(lam, cV),3) + "</b> = <b>" +
                  fmt(kk,4) + "</b> L·mg⁻¹·cm⁻¹ × " + cTxt + " mg·L⁻¹ × 1 cm";

      /* linha 2 — só quando a leitura difere de Beer.
         A referência (autozero) pode ou não ter descontado o branco; o que
         importa é que a linha MOSTRE a composição do número lido. */
      /* A_lido é, POR DEFINIÇÃO, a leitura do instrumento — então o lado
         ESQUERDO usa A_instr(lam), e NÃO ideal_instr(lam).

         Por que isso importa: ideal_instr soma o branco no PONTO CENTRAL
         (ABLK·blkRel(lam), semântica didática congelada — ver comentário
         L2), enquanto brancoEfetivo() o mede INTEGRADO NA BANDA. Os dois
         caminhos diferem de 0,0000–0,0005 A, o suficiente para a igualdade
         não fechar na 3ª casa exibida em casos extremos. Usando A_instr,
         o lado esquerdo e a soma do lado direito saem do MESMO caminho
         numérico (a leitura real do instrumento) e a igualdade fecha.

         Isso NÃO altera ideal_instr(), A_ideal(), k(), ABLK nem o .dev:
         é só o número EXIBIDO nesta linha didática. */
      var fLeitura = "";
      /* NOTA DE DESIGN (item analisado e MANTIDO — NÃO é bug):
         a igualdade A_lido = A + A_branco exibida abaixo NÃO é exata no
         modelo, porque bandT() faz média de TRANSMITÂNCIAS e o log10 não
         é aditivo: A_meas = -log10(ΣI0·10^-(Ab+Ak)/ΣI0) ≠ A_ideal+Abranco.
         Erro medido: ~7e-5 A (Δλ=4nm), ~1,2e-3 A (Δλ=16nm),
         ~2,9e-3 A (Δλ=16nm + parasita) — INVISÍVEL nas 3 casas exibidas.
         Manteve-se "=" porque fecha na precisão de tela em qualquer
         combinação de sliders e trocar por "≈" criaria uma dúvida que o
         aluno não tem como resolver, sem ganho didático. Se um dia a
         precisão exibida aumentar (4+ casas), reavaliar. */
      if (est === "water"){
        /* Água: o branco reagente está presente na cubeta (a amostra é a
           mesma) e NÃO foi descontado — a água não o continha. A leitura
           é Beer + branco. As duas parcelas são exibidas. */
        fLeitura = "leitura (água): A_lido = A + A_branco → <b>" +
                   fmt(A_instr(lam),3) + "</b> = <b>" + fmt(A_ideal(lam, cV),3) + "</b> + <b>" +
                   fmt(brancoA,3) + "</b>";
      } else if (est === "none" || est === "stale"){
        /* Sem autozero válido: NÃO há referência nenhuma descontada —
           nem branco, nem água. A leitura crua é Beer + branco. A frase
           deixa explícito que o termo aparece por AUSÊNCIA de autozero,
           não por escolha do usuário — evita confundir com o caso água. */
        fLeitura = "leitura sem autozero: A_lido = A + A_branco → <b>" +
                   fmt(A_instr(lam),3) + "</b> = <b>" + fmt(A_ideal(lam, cV),3) + "</b> + <b>" +
                   fmt(brancoA,3) + "</b>";
      }

      /* linha 3 — aviso vermelho, por estado. Só aparece quando a leitura
         NÃO é Beer puro (water / none / stale). O texto muda conforme a
         causa, para não atribuir ao branco um erro que é de outra coisa. */
      var fAviso = "";
      if (est === "water"){
        fAviso = "\n<span style='color:#ff9b8a'>referência: água — a leitura inclui o branco reagente (+" +
                 fmt(brancoA,3) + " A) que a água não continha</span>";
      } else if (est === "none"){
        fAviso = "\n<span style='color:#ff9b8a'>sem referência — a leitura não desconta nada; o branco reagente aparece somado</span>";
      } else if (est === "stale"){
        fAviso = "\n<span style='color:#ff9b8a'>referência inválida (λ " + ref.lam + " nm · Δλ " +
                 ref.dlam + " nm; agora λ " + lam + " nm · Δλ " + dlam +
                 " nm) — refaça o autozero</span>";
      }

      /* Montagem final: linha 1 sempre; linha 2 e aviso conforme o estado.
         O ε molar entra na mesma linha 1 (é a mesma grandeza kk, só
         convertida para mol), separado por '·' para não virar outra linha. */
      el.frm.innerHTML =
        fBeer +
        "<br>ε(" + lam + " nm) = " + fmt(kk,4) +
        " L·mg⁻¹·cm⁻¹ (≈ " + fmt(epsMolar(lam),0) + " L·mol⁻¹·cm⁻¹)" +
        (fLeitura ? "\n" + fLeitura : "") +
        fAviso;

      el.calinfo.textContent = "· λ = " + lam + " nm · c atual " + fmt(cV,1) + " mg·L⁻¹" +
        (cV <= 10 ? " (faixa analítica)" : " (FORA da faixa analítica)");

      /* --- 4c. ajuste dos padrões e concentração calculada (.kv) ---
         A curva de calibração A = a·c + b é refeita A CADA update(), com
         os padrões medidos nas condições atuais. A partir dela inverte-se
         a leitura: c_calc = (A_lido − b)/a. O erro percentual compara essa
         estimativa com a concentração nominal (cV) que o usuário ajustou.
         Se a inclinação for zero (sem sinal), evita-se a divisão por zero.

         NOTA DE DESIGN (item analisado e MANTIDO — NÃO é bug):
         a calibração é DINÂMICA de propósito. Consequência didática: como
         os padrões são remedidos na condição de agora, cCalc sai sempre
         perto de cV, e o "erro vs. nominal" mede apenas a NÃO-LINEARIDADE
         do ajuste — nunca o erro de usar uma curva feita no passado.
         Um modo "experimento" (botão que congela a, b, R², RMSE e depois
         mede uma amostra em condição diferente) mostraria esse erro, mas
         é FUNÇÃO NOVA — fora do escopo desta versão. Registrado como
         decisão consciente de modelagem, não como defeito. */
      var fit = calibrate();
      var cCalc = fit.a !== 0 ? (AI - fit.b) / fit.a : 0;
      var errPct = cV > 0 ? (cCalc - cV) / cV * 100 : 0;
      if (el.fitab) el.fitab.textContent = "A = " + fmt(fit.a,4) + "·c " + fmtS(fit.b,4);
      if (el.fitr2) el.fitr2.textContent = "R² " + fmt(fit.r2,4) + " · RMSE " + fmt(fit.rmse,4) + " A";
      if (el.ccalc) el.ccalc.textContent = fmt(cCalc,2) + " mg·L⁻¹";
      if (el.cerr){
        el.cerr.textContent = cV > 0 ? fmtS(errPct,1) + "%" : "—";
        el.cerr.className = "j-cerr " + (Math.abs(errPct) <= 5 ? "good" : "bad");
      }
      /* L3 — o fitnote abaixo atribuia o intercepto ao branco sempre que a
         referencia nao fosse "blank" valida. Com luz parasita ligada o vies
         tambem vem de S (A_meas e nao-linear em S). O texto agora cita
         explicitamente a luz parasita quando ela esta ativa, em vez de
         culpar o branco por um erro que nao e dele. */
      if (el.fitnote){
        /* L3 — a mensagem do intercepto agora separa DUAS causas possiveis:
           - referencia nao-branco: erro do branco (+ABLK)
           - luz parasita ativa: vies nao-linear de S sobre A_meas
           Quando as duas coincidem, as duas linhas aparecem. Antes o texto
           culpava o branco mesmo com S ligado, que era o diagnostico errado. */
        /* O fitnote separa QUATRO estados, não dois. Antes o `else`
           cobria água + sem referência + referência expirada com a MESMA
           frase ("intercepto carrega o erro do branco"), o que era
           impreciso: sem autozero o intercepto pode carregar outros
           efeitos instrumentais, não só o branco. */
        var notaIntercepto;
        var estF = refEstado();
        if (estF === "blank"){
          notaIntercepto = strayOn
            ? "\nintercepto ≈ 0 (branco descontado) · luz parasita ativa distorce o ajuste"
            : "\nintercepto ≈ 0 (branco descontado)";
        } else if (estF === "water"){
          notaIntercepto = "\nintercepto carrega o branco NÃO descontado (+" +
            fmt(brancoEfetivo(lam),3) + " A)" +
            (strayOn ? " · e a luz parasita (não-linear em S)" : "");
        } else if (estF === "none"){
          notaIntercepto = "\nSEM autozero — o intercepto carrega o branco (+" +
            fmt(brancoEfetivo(lam),3) + " A) e o offset do instrumento" +
            (strayOn ? " · e a luz parasita (não-linear em S)" : "");
        } else { /* stale */
          notaIntercepto = "\nreferência EXPIRADA (λ ou Δλ mudaram) — intercepto não confiável; refaça o autozero" +
            (strayOn ? " · e a luz parasita (não-linear em S)" : "");
        }
        el.fitnote.textContent =
          "padrões: " + STDS.join("·") + " mg·L⁻¹\n" +
          "referência: " + refTxt() +
          notaIntercepto;
        el.fitnote.className = "wide j-fitnote";
      }

      /* --- 5. fecha o ciclo: sliders, gráficos e altura do iframe ---
         amaxNow lê o teto do eixo A que o último plotSpectrum() gravou em
         dataset.amax (usado no modo AUTO). draw() apenas AGENDA o
         redesenho no próximo frame — ver a função draw(). */
      var amaxNow = parseFloat(el.cvspec.dataset.amax) || AMAXHI;
      syncSliderLabels(amaxNow);
      syncYSliderWidths();
      draw();
      postHeight();
    }

    /* draw() — AGENDA um redesenho dos dois gráficos no próximo frame.
       Se já existe um frame agendado (rafId != 0), não faz nada: várias
       chamadas seguidas (mover slider, hover, resize) viram UM só desenho.
       Esta é a razão pela qual update() pode chamar draw() sem medo. */
    function draw(){
      if (rafId) return;
      rafId = requestAnimationFrame(function(){
        rafId = 0;
        plotSpectrum();
        plotCal();
      });
    }

    /* bindPlot(cv, isSpec) — liga UM canvas à interação de ponteiro/teclado.
         cv      : o elemento canvas (.j-cvspec ou .j-cvcal)
         isSpec  : true para o espectro (manipula lam),
                   false para a curva de calibração (manipula cVal).
       Converte a posição do clique em valor físico usando a MESMA
       geometria do desenho (LP/RP no espectro, CL/CR na curva), de modo
       que o que o usuário vê coincide com o que ele altera.
       Teclado: setas (±1; Shift = ±10 no espectro, ±5 na curva),
       Home/End vão aos extremos. O pointer capture é opcional (try/catch)
       porque navegadores antigos podem recusar o pointerId. */
    function bindPlot(cv, isSpec){
      function toVal(ev){
        var m = prep(cv);
        var lx = localX(cv, m, ev.clientX);
        if (isSpec){
          var pw = m.W - LP - RP;
          return 400 + (lx - LP)/pw*300;
        }
        var pw2 = m.W - CL - CR;
        return (lx - CL)/pw2*calXMax;
      }
      function apply(ev){
        var v = toVal(ev);
        if (isSpec){
          lam = Math.round(Math.max(400, Math.min(700, v)));
          el.sl.value = lam;
        } else {
          cVal = Math.round(Math.max(0, Math.min(CMAX, v)) * 10) / 10;
        }
        update();
      }
      cv.addEventListener("pointerdown", function(ev){
        pressed = true;
        try { cv.setPointerCapture(ev.pointerId); } catch(e){}
        apply(ev);
      });
      cv.addEventListener("pointermove", function(ev){
        if (isSpec && ev.pointerType === "mouse"){
          var m = prep(cv);
          var lx = localX(cv, m, ev.clientX);
          var pw = m.W - LP - RP;
          hv = Math.max(400, Math.min(700, 400 + (lx - LP)/pw*300));
          draw();
        }
        if (pressed) apply(ev);
      });
      cv.addEventListener("pointerup", function(){ pressed = false; });
      cv.addEventListener("pointercancel", function(){ pressed = false; });
      cv.addEventListener("pointerleave", function(){
        if (isSpec){ hv = -1; draw(); }
        pressed = false;
      });
      cv.addEventListener("keydown", function(ev){
        if (isSpec){
          /* Passo do espectro: ±1 nm (setas) ou ±10 nm (Shift).
             Declarado AQUI dentro, e não no topo do handler: o ramo da
             curva de calibração usa outro passo (±5 mg/L), e uma variável
             compartilhada sugeria — falsamente — que os dois eram iguais. */
          var st = ev.shiftKey ? 10 : 1;
          if (ev.key === "ArrowLeft"){  lam = Math.max(400, lam - st); ev.preventDefault(); }
          else if (ev.key === "ArrowRight"){ lam = Math.min(700, lam + st); ev.preventDefault(); }
          else if (ev.key === "Home"){ lam = 400; ev.preventDefault(); }
          else if (ev.key === "End"){ lam = 700; ev.preventDefault(); }
          else return;
          el.sl.value = lam;
        } else {
          var cs = ev.shiftKey ? 5 : 0.1;
          if (ev.key === "ArrowLeft" || ev.key === "ArrowDown"){ cVal = Math.max(0, cVal-cs); ev.preventDefault(); }
          else if (ev.key === "ArrowRight" || ev.key === "ArrowUp"){ cVal = Math.min(CMAX, cVal+cs); ev.preventDefault(); }
          else if (ev.key === "Home"){ cVal = 0; ev.preventDefault(); }
          else if (ev.key === "End"){ cVal = CMAX; ev.preventDefault(); }
          else return;
          cVal = Math.round(cVal*10)/10;
        }
        update();
      });
    }
    bindPlot(el.cvspec, true);
    bindPlot(el.cvcal, false);

    /* ---------- sincronização de altura Q1 → Q2 ----------
       O Q1 (palco) tem altura natural; o Q2 (espectro) é esticado para
       casar com ele e as duas colunas da grade terminarem alinhadas.
       Comportamento:
         · em telas <= 900px a sincronização é DESLIGADA (media query
           devolve altura fixa de 150px ao canvas) — ver CSS @media;
         · h1 < 40px é ignorado (layout ainda não pronto);
         · h1 === lastQ1H evita reprocessar quando nada mudou;
         · o canvas recebe a sobra (h1 − padding − borda − título − dica)
           e só é ajustado se essa sobra for >= 80px.
       Observador: um ResizeObserver no Q1 redesenha os gráficos e
       reenvia a altura ao iframe pai. */
    var Q1 = root.querySelector(".esp-card--instrument");
    var Q2 = root.querySelector(".esp-card--spectrum");
    var lastQ1H = 0;

    function syncSpectrumHeight(){
      if (!Q1 || !Q2) return;
      if (window.matchMedia("(max-width: 900px)").matches){
        Q2.style.height = "";
        el.cvspec.style.height = "";
        /* ⚠️ CORREÇÃO (bug real): zerar lastQ1H ao entrar no breakpoint.
           Sem isso, o cenário é: desktop (Q1=500 → lastQ1H=500) →
           encolhe p/ <=900px (limpa height, mas lastQ1H segue 500) →
           volta p/ desktop (Q1=500 de novo) → h1 === lastQ1H → return
           SEM reaplicar a altura ao Q2. A sincronização ficava quebrada
           em silêncio depois de atravessar o breakpoint. */
        lastQ1H = 0;
        return;
      }
      var h1 = Math.round(Q1.getBoundingClientRect().height);
      if (h1 < 40 || h1 === lastQ1H) return;
      lastQ1H = h1;

      Q2.style.height = h1 + "px";

      var title = Q2.querySelector(".esp-card-title");
      var wrap  = Q2.querySelector(".plotwrap");
      var hint  = Q2.querySelector(".plothint");
      if (!wrap) return;
      var cs2 = getComputedStyle(Q2);
      var padY = (parseFloat(cs2.paddingTop)||0) + (parseFloat(cs2.paddingBottom)||0);
      var borY = (parseFloat(cs2.borderTopWidth)||0) + (parseFloat(cs2.borderBottomWidth)||0);
      var hTitle = title ? title.getBoundingClientRect().height : 0;
      var hHint  = hint  ? hint.getBoundingClientRect().height  : 0;
      var csW = getComputedStyle(wrap);
      var wrapMargin = (parseFloat(csW.marginTop)||0) + (parseFloat(csW.marginBottom)||0);

      var hPlot = Math.round(h1 - padY - borY - hTitle - hHint - wrapMargin);
      if (hPlot >= 80){
        el.cvspec.style.height = hPlot + "px";
      }
    }

    if (window.ResizeObserver && Q1){
      var roQ1 = new ResizeObserver(function(){
        syncSpectrumHeight();
        syncYSliderWidths();
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        plotSpectrum();
        plotCal();
        postHeight();
      });
      roQ1.observe(Q1);
    }

    syncSpectrumHeight();
    requestAnimationFrame(syncSpectrumHeight);

    /* ---------- sincronização de altura Q3 → Q4 ----------
       O Q3 é a RÉGUA desta linha: sua altura natural (estabilizada pelas
       reservas min-height do CSS) é copiada para o Q4, para que a curva de
       calibração e o texto de interpretação terminem na mesma linha que
       os controles. Diferente do Q1→Q2, aqui NÃO se mexe em filhos: só a
       altura do card. Em <= 900px a cópia é desligada (height = ""). */
    var Q3 = root.querySelector(".esp-card--controls");
    var Q4 = root.querySelector(".esp-card--results");
    var lastQ3H = 0;

    function syncResultsHeight(){
      if (!Q3 || !Q4) return;
      if (window.matchMedia("(max-width: 900px)").matches){
        Q4.style.height = "";
        /* ⚠️ CORREÇÃO (bug real): mesma razão do Q1→Q2 — sem zerar
           lastQ3H, voltar ao desktop com a MESMA altura de Q3 faz a
           função retornar cedo e o Q4 fica sem altura sincronizada. */
        lastQ3H = 0;
        return;
      }
      var h3 = Math.round(Q3.getBoundingClientRect().height);
      if (h3 < 40 || h3 === lastQ3H) return;
      lastQ3H = h3;
      Q4.style.height = h3 + "px";
    }

    if (window.ResizeObserver && Q3){
      var roQ3 = new ResizeObserver(function(){
        syncResultsHeight();
        syncYSliderWidths();
        postHeight();
      });
      roQ3.observe(Q3);
    }

    syncResultsHeight();
    requestAnimationFrame(syncResultsHeight);

    /* postHeight() — informa ao documento PAI (quando a figura está dentro
       de um iframe) qual deve ser a altura do iframe, para que ele cresça
       junto com o conteúdo e não apareça barra de rolagem interna.
       Se a figura não está em iframe (window.parent === window), sai.
       A guarda Math.abs(h − lastH) > 1 impede postagens repetidas com a
       mesma altura — é o que evita o ciclo de realimentação
       observer → postMessage → resize do iframe → observer. */
    function postHeight(){
      if (window.parent === window) return;
      var rr = root.getBoundingClientRect();
      var cs = document.body ? window.getComputedStyle(document.body) : null;
      var pad = cs ? (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0) : 0;
      var h = Math.ceil(rr.height + pad + 2);
      if (h > 0 && Math.abs(h - lastH) > 1){
        lastH = h;
        try { window.parent.postMessage({ type:"iframeResize", height: h }, "*"); } catch(e){}
      }
    }

    /* exportCSV() — monta e baixa um CSV com TODO o estado da simulação.
       Seções do arquivo, nesta ordem:
         1. Parâmetros (λ, fenda, c, luz parasita, referência, escalas)
         2. Espectro    — 400..700 nm: A medido, %T, A ideal, I₀ relativa
         3. Curva       — 0..100 mg·L⁻¹: A medido e A ideal
         4. Ajuste      — os padrões medidos + a, b, R², RMSE, c calculada
       O separador é ';' (padrão pt-BR, evita conflito com a vírgula
       decimal). O BOM \uFEFF garante acentuação correta no Excel.
       O nome do arquivo carrega λ e c para distinguir exportações. */
    /* ================================================================
       exportCSV() — exporta o estado COMPLETO do experimento.

       ⚠️ CONSISTÊNCIA COM A TELA (esta versão):
       o CSV era a ÚNICA testemunha do branco que não registrava o estado
       novo da referência. Quem abrisse o arquivo via A medido = 0,270 e
       A ideal = 0,240 SEM a linha que explica a diferença de 0,030 —
       exatamente o problema que a tela já resolveu. Agora o CSV exporta:

         · estado da referência   (blank/water/none/stale) — refEstado()
         · A_branco REGISTRADO    (o valor CONGELADO em ref.A)
         · A_branco efetivo AGORA (brancoEfetivo(lam), o que o instrumento
                                  leria neste instante — difere quando a
                                  luz parasita foi ligada após o autozero)
         · A_lido e A ideal, para a diferença de 0,030 fechar no arquivo

       A referência é um ATO FÍSICO: o valor fica congelado no instante do
       clique, mesmo que a luz parasita mude depois. É isso que o CSV
       registra — não o "branco de agora". */
    function exportCSV(){
      var L = [];
      L.push("Simulacao do espectrofotometro;gerado em;" + new Date().toLocaleString("pt-BR"));
      L.push("");
      L.push("Parametros");
      L.push("lambda (nm);" + lam);
      L.push("fenda dlambda (nm);" + dlam);
      L.push("concentracao (mg/L P);" + fmt(cVal,1));
      L.push("luz parasita (fracao);" + fmt(S,3));
      L.push("espectro eixo A; " + (specYAuto ? "auto" : ("manual " + fmt(specYMax,2))));
      L.push("curva eixo c max (mg/L);" + calXMax);
      L.push("curva eixo A max; " + fmt(calYMax,2));
      L.push("");
      L.push("Referencia (autozero)");
      L.push("estado; " + refEstado());
      L.push("descricao; " + refTxt());
      if (ref){
        L.push("registrada em lambda (nm);" + ref.lam);
        L.push("registrada com fenda (nm);" + ref.dlam);
        if (ref.kind !== "water"){
          L.push("A_branco REGISTRADO (congelado no autozero) (A);" + fmt(ref.A,4));
        } else {
          L.push("A_branco REGISTRADO (agua: nao desconta) (A);0,0000");
        }
      }
      L.push("A_branco efetivo AGORA (medido pelo instrumento) (A);" + fmt(brancoEfetivo(lam),4));
      L.push("A_lido (A_instr) (A);" + fmt(A_instr(lam),4));
      L.push("A ideal (Beer-Lambert puro) (A);" + fmt(ideal_instr(lam),4));
      L.push("nota; A_branco REGISTRADO e o valor do instante do autozero e NAO muda se a luz parasita for ligada depois; A_branco efetivo AGORA e o que o instrumento leria neste momento");
      L.push("");
      /* SEÇÃO ESPECTRO — 6 COLUNAS FIXAS.
         A coluna "A sem parasita" (A_instr_ns) é o CONTRAFACTUAL: qual
         seria a leitura se a luz parasita não existisse, com tudo o mais
         igual. A diferença A medido − A sem parasita é o efeito da
         parasita — a MESMA parcela devP que o Q3 mostra no diagnóstico
         de causa dominante. Sem esta coluna, quem abre o CSV vê dois
         números (medido e ideal) e não consegue reconstruir a conta.
         Com S=0 a coluna é IDÊNTICA a "A medido" — redundância de
         propósito: formato fixo de 6 colunas vale mais que bytes.

         A coluna usa A_instr_ns() — a MESMA função que desenha a curva
         amarela tracejada do Q2 ("sem parasita"). NÃO é um cálculo
         paralelo: se A_instr_ns() mudar, o CSV e o gráfico mudam juntos.

         RENOMEAÇÃO "A medido" → "A medido (com ref.)":
         o valor é A_instr(), que JÁ desconta a referência registrada (o
         autozero congelado). O nome antigo não dizia isso e podia ser
         lido como "absorbância bruta do instrumento". O sufixo
         "(com ref.)" deixa explícito que o desconto está embutido. */
      L.push("Espectro");
      L.push("lambda (nm);A medido (com ref.);A sem parasita;%T;A ideal (Beer-Lambert);I0 relativa");
      var l;
      for (l = 400; l <= 700; l += 1){
        var am = A_instr(l), ai = ideal_instr(l), ans = A_instr_ns(l);
        L.push(l + ";" + fmt(am,4) + ";" + fmt(ans,4) + ";" + fmt(Math.pow(10,-am)*100,2) + ";" +
               fmt(ai,4) + ";" + fmt(srcI(l),4));
      }
      L.push("");
      /* CURVA DE CALIBRAÇÃO — mesma simetria do Espectro.
         "A sem parasita" aqui é A_band(lam,c,dlam) − refBand(lam):
         a absorbância do padrão SEM luz parasita, descontando o branco
         também sem parasita. É a coluna que permite ver, no Excel, o
         quanto a parasita desloca cada ponto da curva.

         Note a diferença em relação ao Espectro: lá o contrafactual é
         A_instr_ns() (que usa refBand internamente); aqui a expressão é
         escrita direta porque o eixo é c, não λ — é o mesmo cálculo,
         aplicado ponto a ponto na curva de calibração.

         Mesma renomeação do Espectro: "A medido" → "A medido (com ref.)",
         porque A_read() também JÁ desconta a referência registrada. */
      L.push("Curva de calibracao");
      L.push("c (mg/L P);A medido (com ref.);A sem parasita;A ideal (Beer-Lambert)");
      var c;
      for (c = 0; c <= 100; c += 1){
        var cm = A_read(lam,c), ci = ideal_instr(lam,c), cns = A_band(lam, c, dlam) - refBand(lam);
        L.push(c + ";" + fmt(cm,4) + ";" + fmt(cns,4) + ";" + fmt(ci,4));
      }
      L.push("");
      var f = calibrate();
      L.push("Ajuste dos padroes (minimos quadrados)");
      L.push("padrao (mg/L P);A medido");
      for (var i2 = 0; i2 < STDS.length; i2++){
        L.push(STDS[i2] + ";" + fmt(A_read(lam, STDS[i2]),4));
      }
      L.push("inclinacao a (A por mg/L);" + fmt(f.a,5));
      L.push("intercepto b (A);" + fmt(f.b,5));
      L.push("R2;" + fmt(f.r2,5));
      L.push("RMSE (A);" + fmt(f.rmse,5));
      var cc2 = f.a !== 0 ? (A_instr(lam) - f.b)/f.a : 0;
      L.push("c calculada (mg/L P);" + fmt(cc2,3));
      L.push("erro relativo (%);" + fmt(cVal > 0 ? (cc2-cVal)/cVal*100 : 0,2));

      var txt = "\uFEFF" + L.join("\r\n");
      var blob = new Blob([txt], { type:"text/csv;charset=utf-8" });
      var url  = URL.createObjectURL(blob);
      var host = document.body || root;
      var a2   = document.createElement("a");
      a2.href = url;
      a2.download = "espectrofotometro_" + lam + "nm_c" +
                    fmt(cVal,1).replace(",","") + "mgL.csv";
      host.appendChild(a2); a2.click(); host.removeChild(a2);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }

    /* ================================================================
       EVENT LISTENERS DOS CONTROLES DO Q3
       ================================================================
       Padrão geral: o handler ATUALIZA UMA variável de estado e chama
       update(). Nada de lógica de tela aqui — a tela é consequência de
       update(). Isso mantém uma única fonte de verdade.
       ================================================================ */

    /* λ de leitura — slider horizontal (gira o prisma no Q1).
       Muda λ → a referência pode ficar INVÁLIDA (refOK() = false). */
    el.sl.addEventListener("input", function(){ lam = +el.sl.value; update(); });

    /* Fenda (Δλ) — largura da banda espectral. Afeta bandT() (média
       ponderada) e também invalida a referência se o valor mudar. */
    el.slit.addEventListener("input", function(){ dlam = +el.slit.value; update(); });

    /* Botões − / + da concentração: passo de 0,5 mg·L⁻¹, limitado a
       [0, CMAX]. O botão correspondente é desabilitado por update(). */
    el.dec.addEventListener("click", function(){ cVal = Math.max(0, Math.round((cVal-0.5)*10)/10); update(); });
    el.inc.addEventListener("click", function(){ cVal = Math.min(CMAX, Math.round((cVal+0.5)*10)/10); update(); });

    /* Slider contínuo da concentração — passo de 0,1 mg·L⁻¹. */
    if (el.cslider) el.cslider.addEventListener("input", function(){ cVal = Math.round((+el.cslider.value)*10)/10; update(); });

    /* Slider X da curva de calibração — só muda a ESCALA do eixo c;
       não recalcula nada, então chama draw() (redesenho) e não update(). */
    if (el.calx) el.calx.addEventListener("input", function(){
      calXMax = +el.calx.value;
      if (el.calxv) el.calxv.textContent = calXMax;
      draw();
    });

    if (el.caly) el.caly.addEventListener("input", function(){
      calYMax = +el.caly.value;
      if (el.calylab) el.calylab.textContent = fmt(calYMax, 2);
      draw();
    });

    /* Slider Y do espectro — ao ser tocado, ENTRA EM MODO MANUAL
       (specYAuto = false) e o teto passa a ser o valor do slider. O
       atalho "auto" (el.spyauto) volta ao automático, aceitando clique
       e teclado (Enter/Espaço) por acessibilidade. */
    if (el.spy){
      el.spy.addEventListener("input", function(){
        specYAuto = false;
        specYMax  = +el.spy.value;
        if (el.spylab) el.spylab.textContent = fmt(specYMax, 2);
        if (el.spyauto) el.spyauto.classList.remove("hidden");
        el.spy.classList.remove("is-auto");
        draw();
      });
    }
    if (el.spyauto){
      el.spyauto.addEventListener("click", function(){
        specYAuto = true;
        syncSliderLabels(parseFloat(el.cvspec.dataset.amax) || AMAXHI);
        draw();
      });
      el.spyauto.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){
          ev.preventDefault();
          specYAuto = true;
          syncSliderLabels(parseFloat(el.cvspec.dataset.amax) || AMAXHI);
          draw();
        }
      });
    }

    /* --- BOTÕES DE REFERÊNCIA (AUTOZERO) ---
       A referência é gravada SEMPRE com o λ e a fenda atuais. Se depois
       o usuário mudar λ ou Δλ, refOK() passa a ser falso e a leitura
       aparece "crua" (classe .disp--raw no mostrador do Q1).
         · autozero · branco reagente → kind "blank" (correto)
         · zerar com água             → kind "water" (inclui o branco)
         · limpar referência          → ref = null                    */
    el.zero.addEventListener("click", function(){
      /* CONGELA o branco medido AGORA (com o S atual). A partir daqui a
         referência não muda mais, mesmo que a luz parasita seja ligada. */
      ref = { lam: lam, dlam: dlam, kind: "blank", A: A_meas(lam, 0, dlam, S) };
      update();
    });
    el.zero2.addEventListener("click", function(){
      /* Água: não desconta o branco, então A = 0 por definição. */
      ref = { lam: lam, dlam: dlam, kind: "water", A: 0 };
      update();
    });
    el.refclr.addEventListener("click", function(){ ref = null; update(); });

    /* Luz parasita — alterna 0 / STRAY. strayOn (UI) e S (modelo) mudam
       juntos: são a mesma informação em duas formas. O visual do botão
       usa .on (azul) e .on--bad (vermelho) para sinalizar perturbação. */
    el.stray.addEventListener("click", function(){
      strayOn = !strayOn;
      S = strayOn ? STRAY : 0;
      el.stray.classList.toggle("on", strayOn);
      el.stray.classList.toggle("on--bad", strayOn);
      el.stray.setAttribute("aria-pressed", strayOn ? "true" : "false");
      update();
    });
    /* Restaurar padrões — devolve TODAS as variáveis de estado aos valores
       iniciais (concentração, λ, fenda, escalas dos gráficos, luz parasita
       e referência de branco) e sincroniza os controles visuais (sliders,
       rótulos, classes dos botões) antes de chamar update().
       É o único ponto que mexe em TODOS os controles de uma vez. */
    el.reset.addEventListener("click", function(){
      cVal = DEF_C; lam = 430; dlam = 4;
      calXMax = 100; calYMax = AMAXCAL_DEF;
      specYAuto = true; specYMax = AMAXHI;
      if (el.calx) el.calx.value = 100;
      if (el.calxv) el.calxv.textContent = "100";
      if (el.caly) el.caly.value = AMAXCAL_DEF;
      if (el.calylab) el.calylab.textContent = fmt(AMAXCAL_DEF, 2);
      if (el.spy) el.spy.value = AMAXHI;
      if (el.spylab) el.spylab.textContent = "auto";
      if (el.spyauto) el.spyauto.classList.add("hidden");
      if (el.spy) el.spy.classList.toggle("is-auto", true);
      strayOn = false; S = 0;
      /* A congelada com S=0 (o reset desliga a parasita ANTES de registrar). */
      ref = { lam: 430, dlam: 4, kind: "blank", A: A_meas(430, 0, 4, 0) };
      el.sl.value = lam; el.slit.value = dlam;
      if (el.cslider) el.cslider.value = cVal;
      el.stray.classList.remove("on","on--bad");
      el.stray.setAttribute("aria-pressed","false");
      update();
    });
    el.stray.setAttribute("aria-pressed", "false");

    /* cenario(kind) — aplica um estado didático predefinido.
       kind = "blank" → exercício 3: leitura referenciada no branco.
       kind = "water" → exercício 7: leitura zerada com água (a absorbância
                        do branco permanece embutida na leitura).
       Tudo o mais (λ, fenda, escalas, luz parasita) volta ao padrão, como
       em reset. A DIFERENÇA entre os dois cenários é só o kind da ref. */
    function cenario(kind){
      cVal = DEF_C; lam = 430; dlam = 4;
      calXMax = 100; calYMax = AMAXCAL_DEF;
      specYAuto = true; specYMax = AMAXHI;
      if (el.calx) el.calx.value = 100;
      if (el.calxv) el.calxv.textContent = "100";
      if (el.caly) el.caly.value = AMAXCAL_DEF;
      if (el.calylab) el.calylab.textContent = fmt(AMAXCAL_DEF, 2);
      if (el.spy) el.spy.value = AMAXHI;
      if (el.spylab) el.spylab.textContent = "auto";
      if (el.spyauto) el.spyauto.classList.add("hidden");
      if (el.spy) el.spy.classList.toggle("is-auto", true);
      strayOn = false; S = 0;
      /* O cenário registra a referência com S=0 (a parasita é desligada
         antes) e CONGELA o valor correspondente:
           · "blank" → A do branco a 430 nm, fenda 4 nm
           · "water" → 0 (água não desconta o branco) */
      ref = { lam: 430, dlam: 4, kind: kind,
              A: kind === "water" ? 0 : A_meas(430, 0, 4, 0) };
      el.sl.value = lam; el.slit.value = dlam;
      if (el.cslider) el.cslider.value = cVal;
      el.stray.classList.remove("on","on--bad");
      el.stray.setAttribute("aria-pressed","false");
      update();
    }
    if (el.sc3) el.sc3.addEventListener("click", function(){ cenario("blank"); });
    if (el.sc7) el.sc7.addEventListener("click", function(){ cenario("water"); });
    if (el.csv) el.csv.addEventListener("click", exportCSV);

    /* ---------- OBSERVADORES E BOOT ---------- */

    /* ResizeObserver na raiz: quando a figura muda de tamanho por qualquer
       motivo externo (container, zoom da página), reenvia a altura ao pai. */
    if (window.ResizeObserver){
      var ro = new ResizeObserver(function(){ postHeight(); });
      ro.observe(root);
    }

    /* Resize da JANELA: o viewport mudou, então tudo que depende de medida
       precisa ser refeito — alturas sincronizadas, larguras dos sliders Y,
       redesenho dos canvas e altura do iframe. */
    window.addEventListener("resize", function(){
      syncSpectrumHeight();
      syncResultsHeight();
      syncYSliderWidths();
      draw();
      postHeight();
    });

    /* Boot: garante o estado visual inicial coerente (botão de luz parasita
       apagado) e faz o primeiro ciclo completo de renderização. */
    el.stray.classList.remove("on","on--bad");
    update();
    postHeight();

    /* "Settle": nos primeiros instantes o layout pode mudar algumas vezes
       (fontes carregando, zoom aplicado, iframe ajustando a altura).
       Este laço roda a sincronização a cada 250 ms por ~3,75 s e depois
       se encerra sozinho — é uma rede de segurança, não um polling eterno. */
    var settle = 0;
    var settleTimer = setInterval(function(){
      syncSpectrumHeight();
      syncResultsHeight();
      syncYSliderWidths();
      postHeight();
      if (++settle > 15) clearInterval(settleTimer);
    }, 250);
  }
})();
</script>
