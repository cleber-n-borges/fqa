<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulação: Espectrofotômetro — Esquema Básico (Interativo)</title>
<meta name="description" content="Simulação animada e interativa de um espectrofotômetro de feixe simples para fins didáticos: caminho óptico, espectro A(λ), lei de Beer–Lambert, autozero com branco reagente ou água, fenda ajustável, luz parasita e curva de calibração.">
<style>
/* ----------------------------------------------------------------
   RAÍZ DA FIGURA — contêiner de tudo.
   Variáveis CSS (trocar aqui muda o tema inteiro):
     --w         largura da figura (100% por padrão)
     --fig-zoom  zoom global da figura (acessibilidade / embed)
     --bg        fundo geral
     --ink       texto principal (valores em destaque)
     --muted     texto secundário / rótulos
     --line      linhas divisórias e bordas de card
     --bar       corpo das fendas no desenho
     --edge      bordas de controles (botões, pills, sliders)
   Nota: --line e --edge são propositalmente diferentes — --edge é mais
   claro para dar relevo aos controles clicáveis.
   ---------------------------------------------------------------- */
.fig-esp{
  --w: 100%;
  --fig-zoom: 1;

  --bg: #101623; --ink: #e8edf7; --muted: #8fa0bd;
  --line: #2a3550; --bar: #39455f; --edge: #46527a;

  zoom: var(--fig-zoom);
  width: var(--w); max-width: none;
  box-sizing: border-box; margin: 0 auto;
  padding: 12px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 13px; line-height: 1.35;
}
.fig-esp *{ box-sizing: border-box; margin: 0; padding: 0; }
/* Desabilita seleção de texto no palco e nos controles: arrastar um slider
   não deve selecionar rótulos acidentalmente. */
.fig-esp .scene, .fig-esp .ctl{ user-select: none; }

/* Título geral da figura (fora dos cards): "Esquema Básico..." */
.fig-esp .t{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.fig-esp .t b{ font-size:15px; }
.fig-esp .t span{ color:var(--muted); font-size:11.5px; }

/* ---- palco --------------------------------------------------
   Palco do Q1. ATENÇÃO: as coordenadas das peças ópticas são ABSOLUTAS
   em px e o JS depende delas (ORIGIN = {x:110.5, y:105} em init()).
   A altura 210px é casada com .scene-inner e com as posições .lamp,
   .mono, .prisma etc. — mudar a altura desalinha o feixe sem aviso. */
.fig-esp .scene{
  position: relative; height: 210px;
  background: radial-gradient(90px 60px at 6% 50%, rgba(255,255,255,.09), transparent 70%), #0b101b;
  border-radius: 8px; overflow: hidden;
}

.fig-esp .lamp{
  position:absolute; left:4px; top:85px; width:30px; height:40px;
  border-radius: 8px 4px 4px 8px;
  background: linear-gradient(160deg,#37425c,#1d2536);
  border:1px solid var(--edge);
}
.fig-esp .lamp::after{
  content:""; position:absolute; right:-5px; top:50%;
  width:10px; height:16px; transform:translateY(-50%);
  border-radius:3px; background:#fff;
  box-shadow:0 0 14px 4px rgba(255,255,255,.55);
  animation: esp-lamp 2.4s ease-in-out infinite;
}
@keyframes esp-lamp{ 50%{ box-shadow:0 0 20px 7px rgba(255,255,255,.75);} }

.fig-esp .sline{
  position:absolute; height:3px; border-radius:2px; z-index:3;
  background:#ffffff;
  box-shadow:0 0 6px rgba(255,255,255,.45);
}

.fig-esp .mono{
  position:absolute; left:62px; top:34px; width:152px; height:142px;
  border:1px solid var(--edge); border-radius:6px; z-index:2;
}
.fig-esp .fenda{ position:absolute; width:4px; background:var(--bar); z-index:4; }
.fig-esp .f-in-top { left:62px;  top:34px;  height:66px; }
.fig-esp .f-in-bot { left:62px;  top:110px; height:60px; }
.fig-esp .f-out-top{ left:208px; top:40px;  height:60px; z-index:4;}
.fig-esp .f-out-bot{ left:208px; top:110px; height:60px; z-index:4;}

.fig-esp .prisma{
  position:absolute; left:98px; top:74px; width:50px; height:62px;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, rgba(223,230,245,.36), rgba(154,168,204,.22));
  transform-origin: 50% 60%;
  transition: transform .25s ease;
  z-index:2;
}

.fig-esp .rays{
  position:absolute; left:110px; top:105px; width:0; height:0;
  transition: transform .25s ease; z-index:3;
}
.fig-esp .ray{
  position:absolute; left:0; top:-1px; width:101px; height:2px;
  border-radius:1px; transform-origin:0 50%;
  background-image: repeating-linear-gradient(90deg,
      rgba(255,255,255,.75) 0 4px, rgba(0,0,0,.30) 4px 11px);
  background-size:11px 100%;
  animation: esp-ray .45s linear infinite;
  opacity:.85;
  transition: opacity .2s;
}
@keyframes esp-ray{ to{ background-position:11px 0; } }
.fig-esp .ray--sel{
  height:3px; top:-1.5px;
  box-shadow:0 0 8px 1px rgba(255,255,255,.35);
}

.fig-esp .arc{
  position:absolute; left:193px; top:38px; width:11px; height:108px;
  border:2px solid #65628a; border-left:none;
  border-radius: 0 54px 54px 0 / 0 54px 54px 0;
  background: repeating-linear-gradient(to bottom, rgba(126,140,180,.30) 0 2px, transparent 2px 8px);
  z-index:2;
}

.fig-esp .beamline{
  position:absolute; top:50%; transform:translateY(-50%);
  height:2.5px; border-radius:1px; z-index:1;
  background-image: repeating-linear-gradient(90deg,
      rgba(255,255,255,.75) 0 4px, rgba(0,0,0,.30) 4px 11px);
  background-size:11px 100%;
  animation: esp-ray .45s linear infinite;
}
.fig-esp .beam--io{ left:213px; width:33px; }
.fig-esp .beam--i { left:302px; width:26px; transition: opacity .3s; }

.fig-esp .cuv{
  position:absolute; left:246px; top:66px; width:56px; height:78px;
  border:2px solid rgba(255,255,255,.45); border-radius:5px;
  background: rgba(255,255,255,.06); z-index:2;
}
.fig-esp .liq{
  position:absolute; inset:2px; border-radius:3px;
  background: linear-gradient(180deg,#ffe066,#e0a800);
  opacity:.25; transition: opacity .35s;
}

.fig-esp .det{
  position:absolute; left:328px; top:82px; width:20px; height:46px;
  border:2px solid #55628a; border-radius:6px;
  background:#fff; opacity:.1; transition: opacity .3s, background .3s;
  z-index:2;
}

.fig-esp .il{ position:absolute; top:80px; font-style:italic; font-size:11px; color:var(--muted); z-index:4;}
.fig-esp .il sub{ font-size:8px; }
.fig-esp .il--i0{ left:222px; } .fig-esp .il--i{ left:309px; }

.fig-esp .lab-in{ position:absolute; font-size:8px; color:var(--muted); text-align:center; line-height:1.3; transform:translateX(-50%); z-index:5; }
.fig-esp .li-e{ left:64px;  top:149px; }
.fig-esp .li-p{ left:123px; top:149px; }
.fig-esp .li-s{ left:211px; top:149px; }

.fig-esp .num{ position:absolute; top:190px; font-size:8.5px; color:var(--muted); white-space:nowrap; }
.fig-esp .num b{ color:var(--ink); font-weight:600; }
.fig-esp .n1{ left:2px; } .fig-esp .n2{ left:62px; width:152px; text-align:center; }
.fig-esp .n3{ left:243px; } .fig-esp .n4{ left:306px; }

/* ---- gráficos -----------------------------------------------
   Alturas em px abaixo são PADRÃO INICIAL: o JS as sobrescreve em tempo
   real. .plot (Q2) é reescrito por syncSpectrumHeight() para casar com a
   altura do Q1; .cal (Q4) acompanha a largura do canvas-host. No mobile
   (< 900px) as media queries devolvem a altura fixa e o JS para de mexer. */
.fig-esp .plotwrap{ margin-top:8px; }
.fig-esp .plothint{ font-size:9.5px; color:var(--muted); text-align:right; margin-top:2px; }
.fig-esp .plot, .fig-esp .cal{
  display:block; width:100%;
  border:1px solid var(--line); border-radius:8px;
  background:#0b101b; cursor:crosshair; touch-action:none;
}
.fig-esp .plot{ height:150px; }
.fig-esp .cal{ height:104px; cursor:pointer; }
.fig-esp .plot:focus-visible, .fig-esp .cal:focus-visible{
  outline:2px solid #7b8fc4; outline-offset:1px;
}

/* ---- leitura ------------------------------------------------ */
.fig-esp .read{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 9px; margin-top:10px; }
.fig-esp .chip{ width:14px; height:14px; border-radius:50%; border:1px solid var(--edge);
  background:#5522ff; transition: background .25s; }
.fig-esp .cell{ font-size:11.5px; color:var(--muted); }
.fig-esp .cell b{ color:var(--ink); font-variant-numeric: tabular-nums; }
.fig-esp .disp{
  margin-left:auto; padding:4px 10px;
  border:2px solid var(--edge); border-radius:6px; box-shadow: inset 0 0 0 2px #0b101b, inset 0 0 0 3px var(--edge);
  font-family: ui-monospace, Consolas, monospace; font-size:15px; font-weight:700;
  background:#0b101b; color:#d7ff5e; font-variant-numeric: tabular-nums;
}
.fig-esp .disp--raw{ color:#8fa0bd; }

/* ---- controles ---------------------------------------------- */
.fig-esp .ctl{ margin-top:10px; display:grid; gap:9px; }
/* Reserva de altura do Q3 — evita o quadro "pular" quando as mensagens
   mudam de tamanho. min-height usa em (relativo ao line-height), entao
   acompanha zoom/fonte. Os multiplicadores sao o PIOR CASO de linhas de
   cada bloco; se alguem acrescentar uma linha a uma mensagem, atualize aqui. */
.fig-esp .status  { min-height: calc(4 * 1.45em); }  /* sem ref(2) · invalida(4) · agua(2) · branco(2) */
.fig-esp .warnbox { min-height: calc(3 * 1.45em); }  /* vazio(0) · aviso Beer(3)                    */
.fig-esp .devtxt  { min-height: calc(5 * 1.45em); }  /* base(3) · +causa(4) · +vale(5)              */
.fig-esp .formula { min-height: calc(4 * 1.60em); }  /* Beer+eps(2) · +leitura(3) · +aviso(4)      */
.fig-esp .kv .wide{ min-height: calc(3 * 1.45em); }  /* base(2) · +intercepto(3)                    */
.fig-esp .grp{ display:grid; gap:6px; }
.fig-esp .grp-lab{ font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.03em; }
.fig-esp .grp + .grp,
.fig-esp .diag{ padding-top:9px; border-top:1px solid var(--line); }
.fig-esp .diag{ display:grid; gap:9px; }
.fig-esp .row{ display:flex; align-items:center; gap:8px; }
.fig-esp .lab{ font-size:11.5px; color:var(--muted); flex:0 0 auto; }
.fig-esp .lab b{ color:var(--ink); }
.fig-esp input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:10px; border-radius:5px; outline:none;
  background: linear-gradient(90deg,#4b0082,#7700ff,#2255ff,#00b3e6,#33cc33,#ffee00,#ff9900,#ff3300,#b30000);
  cursor:pointer;
}
.fig-esp input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:#fff; border:2px solid #55628a;
}
.fig-esp input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid #55628a;
}
.fig-esp .btn{
  flex:0 0 30px; height:30px; border:1px solid var(--edge); border-radius:8px;
  background:#26314a; color:var(--ink); font-size:17px; cursor:pointer;
  transition: background .15s, opacity .15s;
}
.fig-esp .btn:hover:not(:disabled){ background:#33405f; }
.fig-esp .btn:disabled{ opacity:.35; cursor:default; }
.fig-esp .cl{ flex:1; text-align:center; font-size:11.5px; color:var(--muted); }
.fig-esp .cl b{ display:block; color:var(--ink); font-size:12.5px; font-variant-numeric:tabular-nums; }
.fig-esp .sl{ flex:0 0 44px; text-align:right; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }

.fig-esp .pill{
  flex:0 0 auto; height:28px; padding:0 11px;
  border:1px solid var(--edge); border-radius:14px;
  background:#26314a; color:#9aa8c6; font-size:11px; font-weight:600; cursor:pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.fig-esp .pill:hover{ background:#33405f; }
.fig-esp .pill.on{ background:#3a4f85; border-color:#7b8fc4; color:#e8f0ff; }
.fig-esp .pill.on--bad{ background:#5c3140; border-color:#a8627a; color:#ffd9d9; }
.fig-esp .status{ display:grid; grid-template-columns:auto 1fr; align-items:start; margin-top:0; font-size:11px; color:var(--muted); text-align:left; white-space:pre-line; line-height:1.45; min-height:calc(4 * 1.45em); }
.fig-esp .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin:4px 6px 0 0; }
.fig-esp .dot.ok{ background:#3fdc6a; box-shadow:0 0 6px #3fdc6a; }
.fig-esp .dot.warn{ background:#ffc233; box-shadow:0 0 6px #ffc233; }
.fig-esp .dot.bad{ background:#ff5a5a; box-shadow:0 0 6px #ff5a5a; }
/* ATENÇÃO: white-space:pre-line é o que faz os '\n' escritos pelo JS em
   update() virarem quebras de linha reais. Se esta propriedade for
   removida, todas as mensagens multilinha do diagnóstico colapsam numa
   linha só. A reserva de altura acima assume exatamente esse layout. */
.fig-esp .warnbox{ min-height:calc(3 * 1.45em); font-size:11px; color:#ff9b8a; text-align:left; white-space:pre-line; line-height:1.45; }
/* Bloco .formula do Q3 — a lei de Beer e a leitura do instrumento.
   ATENÇÃO: white-space:pre-line transforma os '\n' montados pelo JS em
   quebras de linha reais. É ele que garante "uma linha por equação" —
   sem ele, a lei de Beer, a linha de leitura e o aviso viram um texto só,
   ilegível. A reserva min-height de 4 linhas cobre o PIOR caso:
     linha 1  lei de Beer + ε molar (o <br> força a 2ª linha física)
     linha 2  leitura (água / sem autozero)
     linha 3  aviso em vermelho
   Se um novo aviso for acrescentado, aumentar a reserva junto — senão o
   card Q3 volta a "pular" de altura e arrasta o Q4 pela sincronização. */
.fig-esp .formula{
  font-family: ui-monospace, Consolas, monospace; font-size:10.5px;
  color:var(--muted); text-align:left; line-height:1.6; white-space:pre-line;
  min-height:calc(4 * 1.60em);
}
.fig-esp .formula b{ color:var(--ink); }

.fig-esp .dev{ margin-top:0; }
.fig-esp .devbar{
  height:6px; border-radius:3px; background:#0b101b; border:1px solid var(--line);
  overflow:hidden; position:relative;
}
.fig-esp .devfill{
  display:block; height:100%; width:0%;
  background:#3fdc6a; transition: width .18s ease, background .18s ease;
}
.fig-esp .devtxt{ font-size:10.5px; color:var(--muted); text-align:left; margin-top:4px;
  font-variant-numeric:tabular-nums; white-space:pre-line; line-height:1.45;
  min-height:calc(5 * 1.45em); }
.fig-esp .devtxt b{ color:var(--ink); }
.fig-esp .devtxt .bad{ color:#ff9b8a; }

.fig-esp .calwrap{ margin-top:10px; }
.fig-esp .calhead{ font-size:10.5px; color:var(--muted); text-align:center; margin-bottom:4px; }
.fig-esp .calhead b{ color:var(--ink); }
.fig-esp .calinfo{ font-size:10px; }

.fig-esp .kv{
  margin-top:0; display:grid; grid-template-columns:auto 1fr;
  gap:3px 10px; font-size:10.5px; color:var(--muted);
  font-variant-numeric: tabular-nums;
}
.fig-esp .kv b{ color:var(--ink); }
/* Layout do texto longo do .kv. A RESERVA de altura NÃO é declarada aqui:
   ela vive no bloco de reservas do Q3 (linha ~244), junto das outras.
   Duplicá-la aqui criava duas fontes para o mesmo valor — a segunda
   sobrescrevia a primeira em silêncio. Um valor, um lugar. */
.fig-esp .kv .wide{ grid-column:1 / -1; text-align:left; white-space:pre-line; line-height:1.45; margin-top:2px; }
.fig-esp .kv .bad{ color:#ff9b8a; }
.fig-esp .kv .good{ color:#3fdc6a; }

.fig-esp input[type=range].j-cslider{
  background: linear-gradient(90deg,#22304f,#3a4f85);
}

/* Texto didático do Q4 (Interpretação). Conteúdo é ESTÁTICO no HTML —
   não é reescrito pelo JS. Alterar aqui exige revisar o texto junto. */
.fig-esp .cap{ margin-top:0; text-align:justify; font-size:10.5px; color:var(--muted); line-height:1.5; }
.fig-esp .cap b{ color:var(--ink); }

/* ---- sliders dos eixos dos gráficos ------------------------- */

.fig-esp .calzoom{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 10px;
  margin-top:6px;
  font-size:10.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.fig-esp .calzoom-grp{
  display:flex;
  align-items:center;
  gap:6px;
}
.fig-esp .calzoom-lab{ color:var(--muted); }
.fig-esp .calzoom input[type=range].j-calx{
  width:140px;
  height:6px;
  background:linear-gradient(90deg,#3a4f85,#22304f);
}
.fig-esp .calzoom input[type=range].j-calx::-webkit-slider-thumb{
  width:12px; height:12px; border-width:1px;
}
.fig-esp .calzoom input[type=range].j-calx::-moz-range-thumb{
  width:11px; height:11px; border-width:1px;
}
.fig-esp .calzoom-val{
  color:var(--ink);
  font-weight:600;
  min-width:26px;
  text-align:right;
}
.fig-esp .calzoom-unit{ color:var(--muted); }

/* wrapper canvas + slider Y vertical (à direita)
   O slider Y é um <input type=range> ROTACIONADO -90° (ver .yslider-track
   input abaixo). Como o elemento continua horizontal no DOM, o JS ajusta
   sua largura em px via syncYSliderWidths() para que, depois de rotacionado,
   ele cubra a altura real do canvas. */
.fig-esp .plot-flex{
  display:flex;
  align-items:stretch;
  gap:6px;
  flex:1 1 auto;    /* ← estica dentro do calwrap / plotwrap */
  min-height:0;     /* ← permite encolher em containers flex */
}
.fig-esp .plot-flex .canvas-host{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.fig-esp .plot-flex .canvas-host > canvas{
  flex:1 1 auto;
  min-height:0;
}

.fig-esp .yslider{
  flex:0 0 26px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  user-select:none;
}
.fig-esp .yslider-lab{
  font-weight:600;
  color:var(--ink);
  line-height:1;
}
.fig-esp .yslider-track{
  flex:1 1 auto;
  width:14px;
  min-height:60px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fig-esp .yslider-track input[type=range].j-spy,
.fig-esp .yslider-track input[type=range].j-caly{
  -webkit-appearance:none; appearance:none;
  width:150px;
  height:6px;
  background:linear-gradient(90deg,#22304f,#3a4f85);
  border-radius:3px;
  outline:none;
  cursor:pointer;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  transform-origin:center center;
  transition: opacity .15s;
}
.fig-esp .yslider-track input[type=range].j-spy::-webkit-slider-thumb,
.fig-esp .yslider-track input[type=range].j-caly::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px; height:12px; border-radius:50%;
  background:#fff; border:1px solid #55628a;
}
.fig-esp .yslider-track input[type=range].j-spy::-moz-range-thumb,
.fig-esp .yslider-track input[type=range].j-caly::-moz-range-thumb{
  width:12px; height:12px; border-radius:50%;
  background:#fff; border:1px solid #55628a;
}
.fig-esp .yslider-track input[type=range].is-auto{
  opacity:.55;
}
.fig-esp .yslider-track input[type=range].is-auto:hover{
  opacity:.85;
}

.fig-esp .yslider-hint{
  font-size:8.5px;
  color:var(--muted);
  line-height:1;
  cursor:pointer;
  text-decoration:underline dotted;
  text-underline-offset:2px;
  transition: color .15s;
}
.fig-esp .yslider-hint:hover{ color:var(--ink); }
.fig-esp .yslider-hint.hidden{ visibility:hidden; }


/* ==============================================================
   LAYOUT — grade 2×2
   ============================================================== */

.fig-esp{ width:100%; max-width:none; }

.fig-esp .esp-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
  width:100%;
  align-items:start;
}

.fig-esp .esp-card{
  min-width:0;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(11,16,27,.48);
}

.fig-esp .esp-card-title{
  display:flex;
  align-items:baseline;
  gap:7px;
  margin-bottom:8px;
  padding-bottom:5px;
  border-bottom:1px solid var(--line);
  color:var(--ink);
  font-size:12px;
  font-weight:600;
}

.fig-esp .esp-card-title span{
  color:var(--muted);
  font-size:10.5px;
  font-weight:400;

<body>

<figure class="fig-esp" role="figure" aria-label="Simulação animada do esquema de um espectrofotômetro com espectro da fonte, autozero com branco reagente ou água, fenda ajustável, luz parasita e curva de calibração">
  <div class="t"><b>Esquema Básico de um Espectrofotômetro</b><span> — Interativo (funcionamento real)</span></div>

  <!-- GRADE 2×2: no desktop são 2 colunas; abaixo de 900px vira 1 coluna.
       Q1 e Q2 formam a linha de cima (alturas sincronizadas por JS).
       Q3 e Q4 formam a linha de baixo (Q3 é a régua, Q4 espelha). -->
  <div class="esp-grid">

    <!-- ==========================================================
         QUADRANTE 1 — INSTRUMENTO
         Esquerda: palco animado do caminho óptico (lâmpada → fenda de
         entrada → prisma → fenda de saída → cubeta → detector).
         Direita: bloco "LEITURA" com λ, %T, sinal e absorbância.
         O JS move .rays/.prisma conforme lam e acende .det conforme %T.
         ========================================================== -->
    <div class="esp-card esp-card--instrument">
      <div class="esp-card-title">1. Instrumento <span>caminho óptico + leitura</span></div>
      <div class="instrument-layout">
        <div class="scene">
          <div class="scene-inner">
            <div class="lamp"></div>
            <div class="mono"></div>
            <div class="fenda f-in-top"></div><div class="fenda f-in-bot"></div>
            <div class="prisma"></div>
            <div class="rays"></div>
            <div class="arc"></div>
            <div class="fenda f-out-top"></div><div class="fenda f-out-bot"></div>
            <div class="beamline beam--io"></div>
            <span class="il il--i0">I<sub>0</sub></span>
            <div class="cuv"><div class="liq"></div></div>
            <div class="beamline beam--i"></div>
            <span class="il il--i">I</span>
            <div class="det"></div>
            <span class="lab-in li-e">fenda de<br>entrada</span>
            <span class="lab-in li-p">prisma ou<br>rede de difração</span>
            <span class="lab-in li-s">fenda de<br>saída</span>
            <span class="num n1"><b>1.</b> fonte: "luz branca"</span>
            <span class="num n2"><b>2.</b> monocromador</span>
            <span class="num n3"><b>3.</b> cubeta</span>
            <span class="num n4"><b>4.</b> detector</span>

        </div>
        <div class="read" aria-live="polite">
          <div class="read-title">LEITURA</div>
          <div class="lam-group">
            <span class="chip"></span>
            <span>λ <b class="j-lam">430 nm</b></span>
          </div>
          <span class="cell">%T <b class="j-t">57,5</b></span>
          <span class="cell">sinal <b class="j-sig">20%</b></span>
          <div class="disp j-a">0,240 A</div>
        </div>
      </div>
    </div>

    <!-- ==========================================================
         QUADRANTE 2 — ESPECTRO
         Um único canvas (.j-cvspec) plota QUATRO séries:
           · A medido      (linha principal, ciano)
           · Beer–Lambert  (referência tracejada clara)
           · sem parasita  (amarela, só quando luz parasita está ligada)
           · I₀ relativa   (pontilhada cinza, eixo próprio)
         Interação: clique/toque/setas escolhem λ. O slider Y à direita
         trava a escala do eixo A (modo manual); "auto" volta ao automático.
         ========================================================== -->
    <div class="esp-card esp-card--spectrum">
      <div class="esp-card-title">2. Espectro <span>A(λ), Beer–Lambert e I₀</span></div>
      <div class="plotwrap">
        <div class="plot-flex">
          <div class="canvas-host">
            <canvas class="plot j-cvspec" tabindex="0" role="img"
              aria-label="Espectro medido: absorbância A(λ), lei de Beer e intensidade relativa da fonte I0. Clique, toque ou use as setas para escolher o comprimento de onda."></canvas>
          </div>
          <div class="yslider">
            <span class="yslider-lab j-spy-lab">auto</span>
            <div class="yslider-track">
              <input type="range" class="j-spy" min="0.1" max="8.0" step="0.005" value="2.5"
                     aria-label="Travar a escala do eixo A do espectro. Arraste para entrar em modo manual.">
            </div>
            <span class="yslider-hint j-spy-auto hidden" role="button" tabindex="0"
                  aria-label="Voltar à escala automática do eixo A do espectro">auto</span>
          </div>
        </div>
        <div class="plothint">clique · toque · ← → no gráfico escolhem λ</div>
      </div>
    </div>

    <!-- ==========================================================
         QUADRANTE 3 — CONTROLES E DIAGNÓSTICO
         Quatro grupos (.grp) de entrada:
           parâmetros    — λ, fenda (Δλ), concentração c
           referência    — autozero com branco, zerar com água, limpar
           perturbações  — luz parasita 0,5%, restaurar padrões
           cenários      — exercício 3, exercício 7, exportar CSV
         Abaixo, o bloco .diag (saída) é reescrito a cada update():
           .status   → estado da referência (bolinha + texto)
           .warnbox  → aviso quando o desvio da lei de Beer é grande
           .dev      → barra + decomposição do desvio (fenda × parasita)
           .formula  → substituição numérica em A = ε·b·c
           .kv       → ajuste dos padrões, R², RMSE, c calculada, erro
         As mensagens usam '\n' + white-space:pre-line (uma por linha).
         ========================================================== -->
    <div class="esp-card esp-card--controls">
      <div class="esp-card-title">3. Controles e diagnóstico <span>parâmetros, referência e ajuste</span></div>
      <div class="ctl">
        <div class="grp">
          <span class="grp-lab">parâmetros</span>
          <div class="row"><span class="lab">λ de leitura</span><input type="range" class="j-slider" min="400" max="700" step="1" value="430" aria-label="Selecionar comprimento de onda (nm) — gira o prisma"><span class="sl j-dl2">430 nm</span></div>
          <div class="row"><span class="lab">fenda (Δλ)</span><input type="range" class="j-slit" min="1" max="16" step="1" value="4" aria-label="Largura da fenda de saída — banda espectral (nm)"><span class="sl j-dl">4 nm</span></div>
          <div class="row"><button type="button" class="btn j-dec" aria-label="Diminuir concentração">−</button><span class="cl">concentração da amostra <b class="j-c">c = 4,0 mg·L⁻¹ de P</b></span><button type="button" class="btn j-inc" aria-label="Aumentar concentração">+</button></div>
          <div class="row"><span class="lab">c (mg·L⁻¹)</span><input type="range" class="j-cslider" min="0" max="100" step="0.1" value="4" aria-label="Concentração da amostra em mg por litro de fósforo (contínua, passo 0,1)"><span class="sl j-csl">4,0</span></div>
        </div>
        <div class="grp">
          <span class="grp-lab">referência</span>
          <div class="row" style="flex-wrap:wrap; gap:6px;"><button type="button" class="pill j-zero" aria-label="Registrar o branco reagente (autozero correto)">autozero · branco reagente</button><button type="button" class="pill j-zero2" aria-label="Zerar com água destilada em vez do branco">zerar com água</button><button type="button" class="pill j-refclear" aria-label="Limpar a referência">limpar referência</button></div>
        </div>
        <div class="grp">
          <span class="grp-lab">perturbações</span>
          <div class="row" style="flex-wrap:wrap; gap:6px;"><button type="button" class="pill j-stray" aria-label="Alternar luz parasita de 0,5%">luz parasita 0,5%</button><button type="button" class="pill j-reset" aria-label="Restaurar os padrões da simulação">restaurar padrões</button></div>
        </div>
        <div class="grp">
          <span class="grp-lab">cenários e exportação</span>
          <div class="row" style="flex-wrap:wrap; gap:6px;"><button type="button" class="pill j-sc3" aria-label="Cenário do exercício 3: leitura com branco reagente">cenário: exercício 3</button><button type="button" class="pill j-sc7" aria-label="Cenário do exercício 7: leitura zerada com água">cenário: exercício 7</button><button type="button" class="pill j-csv" aria-label="Exportar os dados desta simulação em CSV">exportar CSV</button></div>
        </div>
        <div class="diag">
          <div class="status"><span class="dot j-dot ok"></span><span class="j-stat"></span></div>
          <div class="warnbox j-warn"></div>
          <div class="dev"><div class="devbar"><span class="devfill j-devfill"></span></div><div class="devtxt j-dev"></div></div>
          <div class="formula j-formula"></div>
          <div class="kv">
            <span>ajuste dos padrões</span><b class="j-fitab">—</b>
            <span>R² · RMSE</span><b class="j-fitr2">—</b>
            <span>c calculada (A lido)</span><b class="j-ccalc">—</b>
            <span>erro vs. nominal</span><b class="j-cerr">—</b>
            <span class="wide j-fitnote"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ==========================================================
         QUADRANTE 4 — RESULTADOS E INTERPRETAÇÃO
         Esquerda: curva de calibração A × c (.j-cvcal) com a faixa
         analítica 0–10 mg·L⁻¹ sombreada, os padrões e o ponto atual.
         Direita: texto fixo de interpretação (branco, fenda, luz parasita).
         Dois controles de eixo: slider Y (A máx) e slider X (c máx).
         ========================================================== -->
    <div class="esp-card esp-card--results">
      <div class="esp-card-title">4. Resultados e interpretação <span>curva de calibração + conceitos</span></div>
      <div class="esp-results-grid">
        <div class="calwrap">
          <div class="calhead"><b>Curva de calibração</b> A × c <span class="calinfo j-calinfo"></span></div>

          <div class="plot-flex">
            <div class="canvas-host">
              <canvas class="cal j-cvcal" tabindex="0" role="img" aria-label="Curva de calibração: absorbância em função da concentração de fósforo, com a faixa analítica de 0 a 10 mg por litro destacada. Use as setas para mudar a concentração."></canvas>
            </div>
            <div class="yslider">
              <span class="yslider-lab j-caly-lab">2,4</span>
              <div class="yslider-track">
                <input type="range" class="j-caly" min="0.2" max="2.4" step="0.01" value="2.4"
                       aria-label="Faixa máxima do eixo de absorbância da curva de calibração">
              </div>
              <span class="yslider-hint hidden" aria-hidden="true">A</span>
            </div>
          </div>

          <div class="calzoom">
            <div class="calzoom-grp">
              <span class="calzoom-lab">eixo c:</span>
              <input type="range" class="j-calx" min="10" max="100" step="0.1" value="100"
                     aria-label="Faixa máxima do eixo de concentração da curva de calibração">
              <span class="calzoom-val j-calxv">100</span>
              <span class="calzoom-unit">mg·L⁻¹</span>
            </div>
          </div>
        </div>
        <div class="cap">
          <div class="cap-title">Interpretação</div>
          A fonte é constante, mas não "plana": a lâmpada de tungstênio-halogênio emite mais no vermelho (curva I₀ no gráfico) — por isso o instrumento registra o <b>branco reagente</b> antes da amostra. Zerar com <b>água</b> deixa a leitura com a absorbância do próprio branco. A <b>fenda</b> ajusta a banda espectral: fenda larga suaviza picos finos (feição espectral estreita em 486 nm). Com <b>luz parasita</b> de 0,5%, A alto deixa de obedecer à lei de Beer — e é por isso que o método tem <b>faixa analítica</b> (0–10 mg·L⁻¹, sombreada na curva de calibração). Leitura: A = ε·b·c.
        </div>
      </div>
    </div>

  </div>
</figure>

<script>
(function(){
  "use strict";
  document.querySelectorAll(".fig-esp").forEach(init);

  /* init(root) — inicializa UMA instância da figura.
     É chamada para cada elemento ".fig-esp" da página (normalmente um).
     Todo o estado da simulação vive no escopo desta função: não há
     variáveis globais. root é o <figure class="fig-esp">.

     ORDEM INTERNA:
       1. constantes e o @model (matemática pura)
       2. estado mutável + funções de referência/leitura
       3. cache de elementos DOM (objeto el)
       4. desenho dos gráficos (canvas)
       5. update() — recalcula tudo e escreve na tela
       6. event listeners + sincronização de alturas */
  function init(root){
    /* ---- constantes de configuração da simulação ---- */
    var AMAXCAL_DEF = 2.4;   /* teto PADRÃO do eixo A na curva de calibração */
    var DEVFULL = 0.5;       /* desvio (A) que enche 100% da barra .devbar  */
    var DEVWARN = 0.02;      /* abaixo disto o desvio é "verde" (aceitável) */
    var AMAXHI = 2.5;        /* teto do eixo A do espectro quando em AUTO   */
    var CMAX = 100;          /* concentração máxima permitida (mg·L⁻¹ de P) */
    var STRAY = 0.005;       /* fração de luz parasita do botão: 0,5%       */
    var STDS = [0, 1, 2, 4, 6, 8, 10]; /* padrões da curva de calibração (mg·L⁻¹) */

    /* ================================================================
       @model — MATEMÁTICA DO ESPECTROFOTÔMETRO (sem DOM, sem estado)
       ================================================================
       Todas as funções daqui são PURAS em relação à tela: recebem números
       e devolvem números. Elas podem ser extraídas e testadas isoladamente.

       ATENÇÃO: o delimitador @model NÃO é uma fronteira de chamadas.
       bandT/A_band/A_meas são chamadas também em update(), fora do bloco.
       Mudar uma assinatura aqui exige varrer o arquivo inteiro.
       ================================================================ */
    /* @model:start */
    /* Constantes físicas do modelo:
         K430  absortividade de referência em 430 nm (L·mg⁻¹·cm⁻¹)
         MP    massa molar do fósforo (g·mol⁻¹) — usada só para exibir ε molar
         ABLK  absorbância do branco reagente no ponto central de sua banda */
    var K430 = 0.0600, MP = 30.974, ABLK = 0.030;

    /* g(x,m,s) — gaussiana normalizada em x=m com largura s. Bloco de
       construção de todos os perfis espectrais abaixo. */
    function g(x,m,s){ return Math.exp(-Math.pow((x-m)/s,2)); }
    /* epsRel(l) — forma do espectro de absorção RELATIVA (normalizada).
       Soma de 4 bandas gaussianas que imitam um cromóforo real:
         430 nm / s=70  banda principal larga (máx ~2.0 → define a escala)
         486 nm / s=6   feição espectral estreita e aguda do ANALITO
                        (NÃO é linha de hólmio: hólmio é padrão de
                        calibração de comprimento de onda, outro contexto.
                        Aqui é uma banda fictícia do cromóforo, usada para
                        demonstrar o efeito da largura de fenda — texto do
                        Q4 alinhado com esta leitura)
         545 nm / s=45  ombro verde
         620 nm / s=60  cauda vermelha
       A divisão por 2.0 normaliza para que epsRel(430) ≈ 1. */
    function epsRel(l){
      return (2.0*g(l,430,70) + 1.2*g(l,486,6) + 0.55*g(l,545,45) + 0.25*g(l,620,60)) / 2.0;
    }
    /* blkRel(l) — forma da absorbância do BRANCO reagente (banda larga em
       430 nm). Separado de epsRel porque o branco não contém o analito:
       é a matriz do reagente que absorve de fundo. */
    function blkRel(l){ return g(l,430,110); }
    /* k(l) — absortividade efetiva (L·mg⁻¹·cm⁻¹) no comprimento l.
       É o "ε·b" da lei de Beer já com b=1 cm embutido. */
    function k(l){ return K430 * epsRel(l); }
    /* epsMolar(l) — absortividade MOLAR (L·mol⁻¹·cm⁻¹), só para exibição.
       Converte de mg para mol usando a massa molar do fósforo. */
    function epsMolar(l){ return k(l) * MP * 1000; }
    /* A_ideal(l,c) — lei de Beer PURA: A = k·c. Sem branco, sem luz
       parasita, sem ponderação de banda. É o "ideal teórico". */
    function A_ideal(l, c){ return k(l) * c; }
    /* srcI(l) — intensidade RELATIVA da fonte (lâmpada tungstênio-halogênio)
       em função do comprimento de onda, normalizada para 1.0 no vermelho.
       Cresce de 0.30 (400 nm) até 1.0 (700 nm) — é a curva I₀ do gráfico Q2.
       Justifica o autozero: como a fonte não é plana, o branco precisa ser
       registrado antes da amostra.
       Retorna valores fora de [400,700] por extrapolação dos ramos extremos
       (usado por bandT quando a fenda invade as bordas do intervalo). */
    function srcI(l){
      var z = (l - 400) / 300;
      if (z <= 0) return 0.30;
      if (z >= 1) return 1.0;
      return 0.30 + 0.70 * Math.pow(z, 1.25);
    }
    /* bandT(l, c, dlam) — TRANSMISSÃO medida através da cubeta.
       Assinatura: (comprimento central l, concentração c, largura de fenda dlam).
       dlam é OBRIGATÓRIO — omiti-lo faz li virar NaN e contamina todo o
       cálculo em silêncio (foi exatamente o bug corrigido na linha do sinal).

       Como funciona: a fenda não mede um ponto, mede uma BANDA. O código
       amostra n=15 pontos ao longo de [l−dlam/2, l+dlam/2], calcula a
       transmitância de cada um (branco + analito) e faz a MÉDIA PONDERADA
       pela intensidade da fonte (srcI). Fenda larga = média mais suave =
       picos finos desaparecem (ex.: a feição estreita de 486 nm —
       "feição" e não "linha": é banda de ABSORÇÃO do analito, não
       linha de emissão/calibração como a do hólmio).

       Já embute o branco (ABLK·blkRel) e o analito (k·c) no mesmo expoente.
       Retorna T (0..1). Protegido por T_guard em A_band/A_meas. */
    function bandT(l, c, dlam){
      var n = 15, sum = 0, wsum = 0, i, li, w;
      for (i = 0; i < n; i++){
        li  = l + (i/(n-1) - 0.5) * dlam;
        w   = srcI(li);
        sum += w * Math.pow(10, -(ABLK*blkRel(li) + k(li)*c));
        wsum += w;
      }
      return wsum > 0 ? sum / wsum : 0;
    }
    /* M2 — guarda de transmissao contra NaN/0/negativo.
       Math.max(1e-12, NaN) retorna NaN (NaN propaga em Math.max), entao a
       guarda antiga NAO protegia o unico caso que importava: uma aridade
       errada em bandT() virava NaN silencioso na tela. Aqui testamos a
       transmissao antes do log; se nao for finita e positiva, usamos 1e-12. */
    function T_guard(t){
      return (isFinite(t) && t > 0) ? t : 1e-12;
    }
    /* A_band(l,c,dlam) — absorbância SEM luz parasita (S=0).
       É a curva amarela do Q2 e a base do cálculo de A_instr_ns. */
    function A_band(l, c, dlam){ return -Math.log10(T_guard(bandT(l, c, dlam))); }
    /* A_meas(l,c,dlam,S) — absorbância COM luz parasita S (fração 0..1).
       Modelo: a luz parasita adiciona uma fração S da intensidade que não
       atravessa a amostra. T_efetiva = (1−S)·T + S. Quando S=0 coincide
       exatamente com A_band. É a função que gera a "leitura" do aparelho. */
    function A_meas(l, c, dlam, S){
      return -Math.log10(T_guard((1-S)*bandT(l, c, dlam) + S));
    }
    /* linfit(xs,ys) — regressão linear por mínimos quadrados ordinários.
       Entrada: arrays de x (concentrações) e y (absorbâncias).
       Retorna { a: inclinação, b: intercepto, r2: coeficiente de
                 determinação, rmse: erro RMS em A }.
       Usada em calibrate() com os padrões STDS, e exibida no Q3 (.kv).
       Se a variância de x for zero (impossível com STDS fixo), a=0. */
    function linfit(xs, ys){
      var n = xs.length, sx=0, sy=0, sxx=0, sxy=0, i;
      for (i = 0; i < n; i++){ sx += xs[i]; sy += ys[i]; sxx += xs[i]*xs[i]; sxy += xs[i]*ys[i]; }
      var den = n*sxx - sx*sx;
      var a = den !== 0 ? (n*sxy - sx*sy)/den : 0;
      var b = (sy - a*sx)/n;
      var my = sy/n, ssT = 0, ssR = 0;
      for (i = 0; i < n; i++){
        var f = a*xs[i] + b;
        ssT += Math.pow(ys[i]-my, 2);
        ssR += Math.pow(ys[i]-f, 2);
      }
      return { a: a, b: b, r2: ssT > 1e-15 ? 1 - ssR/ssT : 1, rmse: Math.sqrt(ssR/n) };
    }
    /* @model:end */

    /* ================================================================
       ESTADO MUTÁVEL DA SIMULAÇÃO
       ================================================================
       Estes são os únicos valores que mudam com a interação. Toda a tela
       é uma função deles: update() lê estes valores e reescreve tudo.
       ================================================================ */

    /* --- entrada do usuário --- */
    var cVal = 4.0;              /* concentração atual (mg·L⁻¹ de P), 0..CMAX */
    var DEF_C = 4.0;             /* valor de c ao restaurar padrões          */
    var lam = 430;               /* comprimento de onda de leitura (nm)      */
    var dlam = 4;                /* largura da fenda de saída Δλ (nm)        */
    var strayOn = false;         /* luz parasita LIGADA? (estado de UI)      */
    var S = 0;                   /* luz parasita como FRAÇÃO (0 ou STRAY) —
                                    é a MESMA informação de strayOn, mas na
                                    forma numérica que o modelo consome.   */
    /* A inicial vem do MODELO, não de um literal 0.030.
       ⚠️ CONSISTÊNCIA (item analisado): o literal 0.030 diferia do valor
       calculado A_meas(430,0,4,0) ≈ 0,0299962 em ~4e-6 A — invisível em
       tela (3 casas), mas criava DUAS origens para a mesma grandeza:
       boot dizia 0.030, reset/cenário diziam o calculado. Agora boot =
       reset = cenário 3 numericamente idênticos. */
    var ref = { lam: 430, dlam: 4, kind: "blank", A: A_meas(430, 0, 4, 0) };
                                 /* referência registrada (autozero).
                                    kind: "blank" (branco reagente) ou
                                    "water" (água destilada). null = sem ref.

                                    A = absorbância do branco MEDIDA E
                                    CONGELADA no instante do autozero.

                                    ⚠️ MUDANÇA DE COMPORTAMENTO (esta versão):
                                    antes o campo A NÃO existia e o branco era
                                    RECALCULADO a cada leitura, com o S (luz
                                    parasita) de AGORA. Isso fazia a própria
                                    referência acompanhar a parasita, cancelando
                                    parte do efeito que o simulador quer
                                    demonstrar. Num instrumento real o autozero
                                    grava a fotocorrente daquele instante e ela
                                    NÃO muda quando a parasita é ligada depois.
                                    É esse comportamento que passamos a modelar.

                                    Quem CONSTRÓI ref: os 2 botões de autozero,
                                    o reset e cenario(). TODOS precisam preencher
                                    A — se algum esquecer, refMeas devolve
                                    undefined e o mostrador exibe "NaN A". */

    /* --- escala dos eixos dos gráficos --- */
    var calXMax = 100;           /* teto do eixo c na curva de calibração (mg·L⁻¹) */
    var calYMax = AMAXCAL_DEF;   /* teto do eixo A na curva de calibração          */
    var specYAuto = true;        /* eixo A do espectro em modo automático?         */
    var specYMax = AMAXHI;       /* teto manual do eixo A do espectro (se !auto)   */

    /* --- estado de interação / desenho (não aparece diretamente) --- */
    var hv = -1;                 /* λ sob o mouse no gráfico do espectro; -1 = fora */
    var lastH = 0;               /* última altura enviada ao iframe pai (postHeight) */
    var rafId = 0;               /* id do requestAnimationFrame pendente (0 = livre) */
    var pressed = false;         /* ponteiro pressionado sobre um canvas?            */

    /* C() — acessor de leitura da concentração. Existe para que as funções
       do modelo possam ser lidas como física (C()) sem expor cVal. */
    function C(){ return cVal; }

    /* ================================================================
       BRANCO EFETIVO — FONTE ÚNICA DE VERDADE
       ================================================================
       O branco reagente aparece na tela em TRÊS lugares (e mais o CSV):
         · .status   (zeroInfo)  — aviso "leitura inclui o branco"
         · .formula  (linha 2)   — A_lido = A + A_branco
         · .fitnote              — "intercepto carrega o erro do branco"

       Se cada um calcular por conta própria, os números DIVERGEM: o branco
       integrado na banda depende de λ e de Δλ, então uma constante fixa
       (ABLK) só acerta no pico da gaussiana (λ = 430 nm). Em λ = 500 nm
       com fenda larga, o valor real é ~0,020 A e não 0,030 A.

       Por isso TODOS leem desta função. Ela é, POR DEFINIÇÃO, a
       absorbância que o INSTRUMENTO lê de uma cubeta só com branco
       reagente (c = 0):

         A_meas(l, 0, dlam, S)

       que já vem integrada na banda por bandT e já inclui a luz parasita
       — exatamente o que o aluno veria pondo o branco no lugar da amostra.

       ⚠️ CORREÇÃO (bug real de rodada anterior): aqui havia
            A_meas(l,0,dlam,S) − A_band(l,0,dlam)
       e o comentário afirmava que a diferença "isola SÓ o branco". Estava
       INVERTIDO. O branco já está dentro de bandT (o termo ABLK·blkRel
       entra no expoente de bandT), portanto nos DOIS operandos: a
       subtração o CANCELA e sobra apenas o artefato da luz parasita.
       Com S = 0 os dois operandos são a MESMA expressão, e o resultado
       era exatamente 0,000 — fazendo a linha 2 do .formula exibir
       "0,270 = 0,240 + 0,000" no exercício 7, o cenário mais didático.

       ATENÇÃO: esta função NÃO substitui ideal_instr(). O ideal_instr
       continua somando ABLK*blkRel(l) no PONTO CENTRAL — é a semântica
       didática congelada (ver o comentário L2 lá). Aqui é a MEDIÇÃO do
       branco para EXIBIÇÃO, que deve bater com o que o instrumento lê.
       ================================================================ */
    function brancoEfetivo(l){
      return A_meas(l, 0, dlam, S);
    }

    /* ================================================================
       REFERÊNCIA (AUTOZERO) E GRANDEZAS DE LEITURA
       ================================================================
       Conceito: o instrumento mede a amostra MENOS a referência. Se a
       referência foi registrada em outro λ ou outra fenda, ela é
       considerada INVÁLIDA (refOK() = false) e o instrumento passa a
       exibir a leitura crua, sem desconto.
       ================================================================ */

    /* refOK() — a referência foi registrada nas MESMAS condições atuais
       (mesmo λ e mesma fenda)? Se não, ela não pode ser descontada. */
    function refOK(){ return !!ref && ref.lam === lam && ref.dlam === dlam; }

    /* refMeas(l,c) — absorbância a DESCONTAR da leitura.
       Retorna 0 quando: (a) não há referência válida; ou (b) a referência
       é água — zerar com água significa "não descontar o branco".
       Caso contrário, devolve o valor CONGELADO em ref.A.

       ⚠️ Antes esta função RECALCULAVA o branco com o S atual
       (A_meas(l, c, ref.dlam, S)). Como o autozero é um ato físico
       registrado num instante, recalculá-lo fazia a referência "seguir"
       a luz parasita e mascarar parte do desvio que o Q3 quer mostrar.
       Agora ref.A é lido direto — o valor do momento do clique.

       O parâmetro l não é mais usado para MEDIR: refOK() já garante
       ref.lam === lam, então ref.A É o valor no λ atual. Mantido na
       assinatura porque as chamadas (A_instr/A_instr_ns) o passam. */
    function refMeas(l, c){
      if (!refOK()) return 0;
      return ref.kind === "water" ? 0 : ref.A;
    }

    /* refBand(l) — o mesmo desconto que refMeas, mas SEM luz parasita.
       Usada por A_instr_ns() para produzir a curva "sem parasita" do Q2.

       ⚠️ POR QUE ESTA **NÃO** FOI CONGELADA COMO refMeas:
       as duas descontam o branco, mas são grandezas DIFERENTES de propósito.
         · refMeas → o branco COMO FOI REGISTRADO no autozero (com o S daquele
           instante). É o desconto real: alimenta A_instr, a leitura do Q1.
         · refBand → o branco SEM parasita, recalculado sempre com S=0. É o
           contrafactual "como seria a leitura se não houvesse luz parasita",
           e por isso NÃO pode herdar o S do registro — se herdasse, a curva
           comparativa do Q2 (A_instr_ns) perderia o sentido: ela existe para
           isolar justamente a parcela devP atribuída à parasita.
       Se um dia alguém "corrigir" refBand para ler ref.A, a curva amarela do
       Q2 deixa de ser o contrafactual sem parasita e passa a ser uma segunda
       cópia de A_instr — o diagnóstico de causa dominante quebra em silêncio. */
    function refBand(l){
      if (!refOK()) return 0;
      return ref.kind === "water" ? 0 : A_band(l, 0, ref.dlam);
    }

    /* A_instr(l,c) — A LEITURA DO INSTRUMENTO. É a grandeza principal:
       alimenta o mostrador do Q1, o marcador do Q2 e o cálculo do desvio.
       = A_meas(atual) − referência registrada. */
    function A_instr(l, c){
      if (c === undefined) c = cVal;
      return A_meas(l, c, dlam, S) - refMeas(l, 0);
    }

    /* A_instr_ns(l,c) — mesma leitura, porém SEM luz parasita (ns = no stray).
       A diferença A_instr_ns − A_instr isola a contribuição da luz parasita,
       que é o termo devP exibido na decomposição do desvio no Q3. */
    function A_instr_ns(l, c){
      if (c === undefined) c = cVal;
      return A_band(l, c, dlam) - refBand(l);
    }
    /* L1/L2 (DECISAO: opcao A — mantida a semantica didatica).
       ideal_instr() e o "ideal de Beer PURO": k(l)*c, sem ponderacao por
       banda e sem luz parasita. E DE PROPOSITO que ele NAO inclua S nem
       dlam — este valor e o que o Q3 usa como rotulo didatico de "ideal"
       na formula, e o que o usuario compara mentalmente com a lei de Beer.

       ATENCAO (L1): por isso dev = ideal_instr - A_instr NAO isola uma
       unica causa fisica — ele mistura desvio de banda + luz parasita.
       O desvio e decomposto explicitamente em devS (fenda) e devP
       (parasita) no update(), que e quem da o diagnostico de causa.
       Se um dia se quiser que "ideal" seja o ideal NA MESMA condicao
       fisica da leitura, esta funcao precisa receber S e usar a mesma
       media ponderada de bandT — e o numero exibido em dev/warn MUDA.

       L2: o branco e somado como ABLK*blkRel(l) no ponto central, nao como
       media ponderada pela fonte. Com fenda larga isso deixa um residuo
       puramente numerico (banda vs. ponto) em relacao ao caminho de
       A_meas. Residuo pequeno e aceito nesta opcao. */
    function ideal_instr(l, c){
      if (c === undefined) c = cVal;
      var a = A_ideal(l, c);
      if (!(refOK() && ref.kind === "blank")) a += ABLK * blkRel(l);
      return a;
    }

    /* ================================================================
       CACHE DE ELEMENTOS DOM (objeto el)
       ================================================================
       Cada chave é uma referência direta a um nó da figura, resolvida UMA
       vez na inicialização. Convenção dos seletores:
         .j-*  → "gancho de JavaScript" — classe sem CSS próprio, usada
                 apenas para o JS encontrar o elemento.
       Se um .j-* for renomeado no HTML sem atualizar aqui, o JS quebra
       com null silencioso (por isso os guardas "if (el.x)").
       ================================================================ */
    var el = {
      prisma: root.querySelector(".prisma"),
      rays:   root.querySelector(".rays"),
      liq:    root.querySelector(".liq"),
      io:     root.querySelector(".beam--io"),
      bi:     root.querySelector(".beam--i"),
      det:    root.querySelector(".det"),
      chip:   root.querySelector(".chip"),
      lam:    root.querySelector(".j-lam"),
      t:      root.querySelector(".j-t"),
      sig:    root.querySelector(".j-sig"),
      a:      root.querySelector(".j-a"),
      c:      root.querySelector(".j-c"),
      dl:     root.querySelector(".j-dl"),
      dl2:    root.querySelector(".j-dl2"),
      sl:     root.querySelector(".j-slider"),
      slit:   root.querySelector(".j-slit"),
      dec:    root.querySelector(".j-dec"),
      inc:    root.querySelector(".j-inc"),
      zero:   root.querySelector(".j-zero"),
      zero2:  root.querySelector(".j-zero2"),
      refclr: root.querySelector(".j-refclear"),
      stray:  root.querySelector(".j-stray"),
      reset:  root.querySelector(".j-reset"),
      dot:    root.querySelector(".j-dot"),
      stat:   root.querySelector(".j-stat"),
      warn:   root.querySelector(".j-warn"),
      devfill:root.querySelector(".j-devfill"),
      dev:    root.querySelector(".j-dev"),
      frm:    root.querySelector(".j-formula"),
      calinfo:root.querySelector(".j-calinfo"),
      cvspec: root.querySelector(".j-cvspec"),
      cvcal:  root.querySelector(".j-cvcal"),
      cslider:root.querySelector(".j-cslider"),
      csl:    root.querySelector(".j-csl"),
      calx:   root.querySelector(".j-calx"),
      calxv:  root.querySelector(".j-calxv"),
      caly:   root.querySelector(".j-caly"),
      calylab:root.querySelector(".j-caly-lab"),
      spy:    root.querySelector(".j-spy"),
      spylab: root.querySelector(".j-spy-lab"),
      spyauto:root.querySelector(".j-spy-auto"),
      sc3:    root.querySelector(".j-sc3"),
      sc7:    root.querySelector(".j-sc7"),
      csv:    root.querySelector(".j-csv"),
      fitab:  root.querySelector(".j-fitab"),
      fitr2:  root.querySelector(".j-fitr2"),
      fitnote:root.querySelector(".j-fitnote"),
      ccalc:  root.querySelector(".j-ccalc"),
      cerr:   root.querySelector(".j-cerr")
    };

    /* A_read(l,c) — absorbância usada para a CURVA DE CALIBRAÇÃO.
       Hoje é matematicamente idêntica a A_instr(). Existe como nome próprio
       porque historicamente a curva usava a leitura crua; mantê-la separada
       deixa explícito que calibrate() depende da referência registrada. */
    function A_read(l, c){
      if (c === undefined) c = cVal;
      return A_meas(l, c, dlam, S) - refMeas(l, 0);
    }

    /* calibrate() — ajusta a reta A = a·c + b aos padrões STDS.
       Para cada padrão mede A_read(lam, c); passa os pares para linfit().
       Retorna o mesmo objeto de linfit: { a, b, r2, rmse }.
       É recalculada a cada update(), então a curva reage a λ, fenda,
       referência e luz parasita em tempo real. */
    function calibrate(){
      var xs = STDS.slice();
      var ys = xs.map(function(c){ return A_read(lam, c); });
      return linfit(xs, ys);
    }

    /* ================================================================
       FORMATAÇÃO (pt-BR)
       ================================================================ */

    /* fmt(n,d) — número com d casas decimais e vírgula decimal.
       Ex.: fmt(4, 1) → "4,0" */
    function fmt(n,d){ return n.toFixed(d).replace(".", ","); }

    /* fmtS(n,d) — número COM SINAL explícito, usado em desvios e erros.
       Ex.: fmtS(0.123,3) → "+0,123" · fmtS(-0.05,3) → "−0,050".
       Zera valores abaixo de 5e-4 para não exibir "−0,000". */
    function fmtS(n,d){
      var v = Math.abs(n) < 5e-4 ? 0 : n;
      return (v > 0 ? "+" : (v < 0 ? "−" : "")) + Math.abs(v).toFixed(d).replace(".", ",");
    }
    /* M1 — guarda de NaN em fmtSig.
       Sem isto, qualquer falha numerica futura (ex.: aridade errada numa
       funcao do @model) volta a renderizar "NaN%" silenciosamente na tela.
       Devolvemos "—" (mesmo marcador ja usado em el.cerr) para que a falha
       seja VISIVEL como ausencia de dado, nunca como numero falso. */
    function fmtSig(v){
      if (!isFinite(v)) return "—";
      if (v === 0) return "0";
      return (v < 1 ? fmt(v, 1) : fmt(v, 0));
    }
    /* refTxt() — descrição textual do estado da referência, usada em
       várias mensagens do Q3 e no CSV. Cobre 4 casos: sem referência,
       referência inválida (λ/Δλ mudaram), água ou branco reagente. */
    function refTxt(){
      if (!ref) return "sem referência";
      if (!refOK()) return "referência inválida (λ " + ref.lam + " nm · Δλ " + ref.dlam + " nm)";
      return ref.kind === "water" ? "água" : "branco reagente";
    }

    /* ================================================================
       refEstado() — CLASSIFICA O ESTADO DA REFERÊNCIA EM 4 CASOS
       ================================================================
       Substitui o antigo booleano comBranco, que colapsava dois estados
       fisicamente DIFERENTES no mesmo `false`:

         "blank" → branco reagente válido.
                   A leitura JÁ é a lei de Beer: nada a somar.
         "water" → água válida.
                   A leitura é Beer + o branco reagente residual (a água
                   não continha o reagente, então ele não foi descontado).
         "none"  → nenhuma referência registrada (ref === null).
                   O instrumento não desconta NADA — leitura crua.
         "stale" → referência registrada mas INVÁLIDA (λ ou Δλ mudaram
                   depois do autozero). Também é leitura crua.

       POR QUE ISSO IMPORTA: "water" e "none"/"stale" produzem hoje o
       MESMO número (todos somam ABLK·blkRel em ideal_instr), mas por
       razões físicas distintas. O bloco .formula do Q3 precisa dizer
       QUAL é o caso — senão o aluno acha que "zerar com água" e "não
       zerar" são a mesma coisa.

       Usado por: update() (bloco 4b, montagem da fórmula didática).
       ================================================================ */
    function refEstado(){
      if (!ref) return "none";
      if (!refOK()) return "stale";
      return ref.kind === "water" ? "water" : "blank";
    }

    /* ================================================================
       COR — espectro visível aproximado e utilidades de canvas
       ================================================================ */

    /* wlRGB(L) — converte comprimento de onda (nm) em cor RGB aproximada,
       imitando a percepção do olho humano. Usada para colorir o feixe no
       palco, o chip do Q1, o marcador de λ e as linhas do espectro.
       Nos extremos (L<420 ou L>660) a intensidade cai (fator f) para
       representar a perda de sensibilidade do olho nas bordas do visível. */
    function wlRGB(L){
      var r=0,g=0,b=0;
      if(L<440){ r=(440-L)/60; b=1; }
      else if(L<490){ g=(L-440)/50; b=1; }
      else if(L<510){ g=1; b=(510-L)/20; }
      else if(L<580){ r=(L-510)/70; g=1; }
      else if(L<645){ r=1; g=(645-L)/65; }
      else { r=1; }
      var f = L<420 ? .35+.65*(L-400)/20 : (L>660 ? .35+.65*(700-L)/40 : 1);
      var c=function(x){ return Math.max(0, Math.min(255, Math.round(255*x*f))); };
      return [c(r),c(g),c(b)];
    }
    /* rgbCss(v,a) — monta a string CSS a partir do array [r,g,b].
       Sem o 2º argumento gera "rgb(...)"; com ele, "rgba(...,a)". */
    function rgbCss(v,a){
      return a===undefined ? "rgb("+v[0]+","+v[1]+","+v[2]+")"
                           : "rgba("+v[0]+","+v[1]+","+v[2]+","+a+")";
    }

    /* ================================================================
       PALCO DO Q1 — construção dos raios coloridos do prisma
       ================================================================
       ORIGIN é o ponto de onde os raios divergem, em coordenadas do
       .scene-inner (px). N=61 raios cobrem de 700 nm (j=0) a 400 nm
       (j=N-1), cada um com uma cor de wlRGB e um ângulo alphaOf().
       O conjunto inteiro (.rays) gira em update() para selecionar λ. */
    var ORIGIN = { x: 110.5, y: 105 };
    /* N — número de raios desenhados; rayEls[] e rayL[] ficam em paralelo
       (elemento DOM e comprimento de onda correspondente). */
    var N = 61;
    var rayEls = [], rayL = [];
    /* alphaOf(l) — ângulo de cada raio, em graus. Mapeia 700 nm → −15° e
       400 nm → +15°, ou seja, o vermelho desvia menos que o violeta. */
    function alphaOf(l){ return -15 + (700-l)/300 * 30; }

    /* Linha branca do feixe de entrada (criada por JS para poder calcular
       o comprimento a partir de ORIGIN, que é a fonte única de verdade). */
    var wline = document.createElement("div");
    wline.className = "sline";
    wline.style.left  = "60px";
    wline.style.top   = (ORIGIN.y - 1.5) + "px";
    wline.style.width = (ORIGIN.x - 34) + "px";
    root.querySelector(".scene-inner").appendChild(wline);

    for (var j = 0; j < N; j++){
      var lJ = 700 - j*300/(N-1);
      var r  = document.createElement("div");
      r.className = "ray";
      r.style.backgroundColor = rgbCss(wlRGB(lJ));
      r.style.transform = "rotate(" + alphaOf(lJ).toFixed(2) + "deg)";
      el.rays.appendChild(r);
      rayEls.push(r); rayL.push(lJ);
    }

    /* prep(cv) — PREPARA UM CANVAS PARA DESENHO. Chamada no início de
       plotSpectrum() e plotCal(). Resolve três problemas de uma vez:
         1. devicePixelRatio (telas retina): o canvas é dimensionado em
            pixels físicos (W,H) e o contexto é escalado por Z·dpr, para
            que as coordenadas do código continuem em px lógicos.
         2. zoom CSS da figura (--fig-zoom): Z corrige a diferença entre a
            caixa de layout (clientWidth) e a caixa renderizada (rect).
         3. borda do canvas: o deslocamento bl/bt evita que o conteúdo
            fique sob a borda de 1px.
       Devolve { ctx, W, H, Z, dpr, bl, rect } — W/H em px LÓGICOS. */
    function prep(cv){
      var rr = cv.getBoundingClientRect();
      var cs = getComputedStyle(cv);
      var bl = parseFloat(cs.borderLeftWidth)  || 0;
      var br = parseFloat(cs.borderRightWidth) || 0;
      var bt = parseFloat(cs.borderTopWidth)   || 0;
      var lw = cv.clientWidth, lh = cv.clientHeight;
      var Z  = (lw + bl + br) > 0 ? rr.width / (lw + bl + br) : 1;
      var dpr= window.devicePixelRatio || 1;
      var W  = Math.max(40, Math.round(rr.width  * dpr));
      var H  = Math.max(20, Math.round(rr.height * dpr));
      if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
      var ctx = cv.getContext("2d");
      ctx.setTransform(Z*dpr, 0, 0, Z*dpr, bl*Z*dpr, bt*Z*dpr);
      ctx.clearRect(0, 0, lw, lh);
      return { ctx: ctx, W: lw, H: lh, Z: Z, dpr: dpr, bl: bl, rect: rr };
    }
    /* localX(cv,m,clientX) — converte a coordenada X do EVENTO (clientX,
       relativa à viewport) para a coordenada interna do canvas, já
       desfazendo o zoom. m é o objeto devolvido por prep(). */
    function localX(cv, m, clientX){
      return (clientX - m.rect.left) / m.Z - m.bl;
    }

    /* syncYSliderWidths() — faz o slider Y (um input range rotacionado -90°)
       ter largura igual à ALTURA do track. Sem isto, após a rotação, o
       controle não cobriria a altura real do gráfico. Roda no boot, no
       resize e dentro de update(). Ignora tracks com menos de 20px. */
    function syncYSliderWidths(){
      var tracks = root.querySelectorAll(".yslider-track");
      for (var i = 0; i < tracks.length; i++){
        var tr = tracks[i];
        var inp = tr.querySelector("input[type=range]");
        if (!inp) continue;
        var h = tr.clientHeight;
        if (h > 20) inp.style.width = h + "px";
      }
    }

    /* ======================= espectro ========================
       LP/RP/TP/BP são as MARGENS internas do canvas do espectro
       (Left, Right, Top, Bottom) reservadas para eixos e rótulos.
       A área de plotagem é pw = W−LP−RP por ph = H−TP−BP. */
    var LP = 34, RP = 14, TP = 10, BP = 20;

    /* niceMax(v) — arredonda o teto do eixo A para um valor "redondo"
       acima de v, escolhendo a granularidade conforme a magnitude. Usada
       no modo AUTO do eixo A do espectro (specYAuto). */
    function niceMax(v){
      if (v <= 0.05) return 0.05;
      if (v <= 0.10) return 0.10;
      if (v <= 1.0)  return Math.ceil(v / 0.05) * 0.05;
      if (v <= 4.0)  return Math.ceil(v / 0.20) * 0.20;
      if (v <= 8.0)  return Math.ceil(v / 0.50) * 0.50;
      return Math.ceil(v / 1.0) * 1.0;
    }

    /* plotSpectrum() — DESENHA O GRÁFICO DO Q2 (canvas .j-cvspec).
       Não recebe argumentos e não devolve nada: lê o estado do escopo
       (lam, dlam, S, ref, specYAuto, specYMax, hv) e escreve no canvas.

       ORDEM DE DESENHO (importa por causa da sobreposição):
         1. grade e rótulos dos eixos (λ em nm, A)
         2. curva I₀ relativa (cinza pontilhada, eixo próprio)
         3. curva Beer ideal (branca tracejada)
         4. curva medida (linha principal) e, se strayOn, a curva sem parasita
         5. linha vertical do λ atual + tooltip de hover (hv)
       O teto do eixo A vem de dataset.amax, gravado por update(). */
    function plotSpectrum(){
      var m = prep(el.cvspec), ctx = m.ctx;
      var W = m.W, H = m.H;
      var pw = W - LP - RP, ph = H - TP - BP;
      var L0 = 400, L1 = 700;

      /* Teto automático do eixo A. Precisa considerar TODAS as curvas
         desenhadas, senão uma delas estoura o topo do gráfico.

         ⚠️ CORREÇÃO (bug real): antes o laço considerava só A_instr e
         ideal_instr. A curva "sem parasita" (A_instr_ns, amarela
         tracejada, desenhada quando strayOn) ficava FORA do cálculo —
         ela podia ultrapassar o teto automático sem o algoritmo prever,
         e o gráfico a clipava contra o topo sem aviso coerente.
         Como A_instr_ns NÃO tem o termo de luz parasita, com S ligado
         ela fica ACIMA de A_instr em absorbâncias altas — exatamente o
         caso em que o teto era subestimado. */
      var mx = 0;
      for (var l0 = L0; l0 <= L1; l0 += 1){
        mx = Math.max(mx, A_instr(l0));
        mx = Math.max(mx, ideal_instr(l0));
        if (strayOn){
          mx = Math.max(mx, A_instr_ns(l0));
        }
      }
      var AMAX;
      if (specYAuto){
        AMAX = niceMax(mx * 1.15 + 1e-9);
      } else {
        AMAX = Math.max(0.05, specYMax);
      }
      el.cvspec.dataset.amax = AMAX;

      function X(l){ return LP + (l-L0)/(L1-L0)*pw; }
      function Y(a){ return TP + (1 - Math.min(a,AMAX)/AMAX)*ph; }
      ctx.lineWidth = 1;

      ctx.font = "9px system-ui, sans-serif";
      ctx.fillStyle = "#8fa0bd";
      ctx.textAlign = "center";
      for (var l = L0; l <= L1; l += 50){
        var x = X(l);
        ctx.strokeStyle = "rgba(138,160,189,.16)";
        ctx.beginPath(); ctx.moveTo(x,TP); ctx.lineTo(x,TP+ph); ctx.stroke();
        ctx.fillText(l+"", x, H-4);
      }
      ctx.textAlign = "left";
      ctx.fillStyle = "#5d6b8a";
      ctx.fillText("nm", LP, H-4);

      var step;
      if (AMAX <= 0.5) step = 0.1;
      else if (AMAX <= 1.0) step = 0.2;
      else if (AMAX <= 2.5) step = 0.5;
      else if (AMAX <= 5.0) step = 1.0;
      else step = 2.0;

      ctx.fillStyle = "#8fa0bd";
      ctx.textAlign = "right";
      for (var av = 0; av <= AMAX + 1e-9; av += step){
        var yv = Y(av);
        ctx.strokeStyle = "rgba(138,160,189,.10)";
        ctx.beginPath(); ctx.moveTo(LP,yv); ctx.lineTo(LP+pw,yv); ctx.stroke();
        ctx.fillText(fmt(av, av<1?2:(av<10?1:0)), LP-4, yv+3);
      }
      ctx.textAlign = "left";
      ctx.save();
      ctx.translate(10, TP+ph/2);
      ctx.rotate(-Math.PI/2);
      ctx.textAlign = "center";
      ctx.fillStyle = "#8fa0bd";
      ctx.fillText("A", 0, 0);
      ctx.restore();

      /* ------------------------------------------------------------------
         AVISOS DO CANTO SUPERIOR DIREITO — posicionamento ESTRUTURAL.

         Antes, dois avisos independentes eram desenhados em W-6, TP+9:
           (a) "manual · eixo A ≤ X"  — quando o eixo A está travado
           (b) "curva acima da escala →" — quando A ultrapassa o teto
         Como (b) só pode ocorrer quando (a) existe (no modo automático o
         teto é niceMax(mx*1.15), que sempre cobre o máximo), a colisão
         não era um caso raro: era GARANTIDA, e o aviso mais importante
         (o de clipping) ficava ilegível.

         Solução adotada: uma ÚNICA pilha vertical de avisos. Cada aviso
         ocupa uma linha abaixo do anterior, ancorado em TP+9, TP+19, ...
         Assim a posição depende do NÚMERO de avisos, não de uma condição
         de modo — acrescentar um terceiro aviso no futuro não recria a
         colisão, e nenhuma coordenada mágica (TP+19) fica órfã.

         ARMADILHA CONHECIDA: textAlign é estado do contexto e não volta
         sozinho ao default. Toda função que o muda PRECISA restaurá-lo
         para "left" antes de retornar, senão o próximo texto desenhado
         sai alinhado à direita por acidente. Por isso o helper abaixo
         sempre restaura o alinhamento e a fonte.
         ------------------------------------------------------------------ */

      /* avisoNoCanto(txt) — empilha um aviso no canto superior direito.
         Usa a variável avisoLinha para controlar a linha atual e SEMPRE
         restaura textAlign/font, evitando vazamento de estado do canvas. */
      var avisoLinha = 0;
      function avisoNoCanto(txt){
        ctx.font = "bold 8px system-ui, sans-serif";
        ctx.fillStyle = "#ffc233";
        ctx.textAlign = "right";
        ctx.fillText(txt, W-6, TP+9 + avisoLinha*10);
        ctx.textAlign = "left";
        ctx.font = "8px system-ui, sans-serif";
        avisoLinha++;
      }

      if (!specYAuto){
        avisoNoCanto("manual · eixo A ≤ " + fmt(AMAX,2));
      }

      var clipou = false;
      ctx.beginPath();
      for (var l3 = L0; l3 <= L1; l3 += 1){
        var a3v = A_instr(l3);
        if (a3v > AMAX) clipou = true;
        /* A curva "sem parasita" também é desenhada quando strayOn e
           também precisa do teste de clipping — senão ela é cortada em
           silêncio, sem o aviso de canto que a curva principal recebe. */
        if (strayOn && A_instr_ns(l3) > AMAX) clipou = true;
        var yy = Y(Math.max(0, a3v));
        if (l3 === L0){ ctx.moveTo(X(l3),yy); } else { ctx.lineTo(X(l3),yy); }
      }
      ctx.strokeStyle = "#8df0ff"; ctx.lineWidth = 1.8;
      ctx.stroke();
      if (clipou){
        avisoNoCanto("curva acima da escala →");
      }

      ctx.beginPath();
      for (var l4 = L0; l4 <= L1; l4 += 1){
        var yy2 = Y(Math.max(0, ideal_instr(l4)));
        if (l4 === L0){ ctx.moveTo(X(l4),yy2); } else { ctx.lineTo(X(l4),yy2); }
      }
      ctx.strokeStyle = "rgba(255,255,255,.38)"; ctx.lineWidth = 1;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

      if (strayOn){
        ctx.beginPath();
        for (var l6 = L0; l6 <= L1; l6 += 1){
          var yy6 = Y(Math.max(0, A_instr_ns(l6)));
          if (l6 === L0){ ctx.moveTo(X(l6),yy6); } else { ctx.lineTo(X(l6),yy6); }
        }
        ctx.strokeStyle = "rgba(255,194,51,.75)"; ctx.lineWidth = 1;
        ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
      }

      ctx.beginPath();
      for (var l5 = L0; l5 <= L1; l5 += 2){
        var v = srcI(l5);
        var y5 = TP + (1 - (v-0.25)/0.75)*ph;
        if (l5 === L0){ ctx.moveTo(X(l5),y5); } else { ctx.lineTo(X(l5),y5); }
      }
      ctx.strokeStyle = "rgba(170,182,214,.65)"; ctx.lineWidth = 1;
      ctx.setLineDash([1,3]); ctx.stroke(); ctx.setLineDash([]);

      ctx.font = "8px system-ui, sans-serif";
      ctx.fillStyle = "#8fa0bd";
      ctx.strokeStyle = "#8df0ff"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(LP,TP+8); ctx.lineTo(LP+13,TP+8); ctx.stroke();
      ctx.fillText("A medido", LP+15, TP+11);
      var lx = LP+59;
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
      ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(lx,TP+8); ctx.lineTo(lx+13,TP+8); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillText("Beer–Lambert", lx+15, TP+11);
      lx = lx + 78;
      if (strayOn){
        ctx.strokeStyle = "rgba(255,194,51,.85)";
        ctx.setLineDash([5,3]); ctx.beginPath(); ctx.moveTo(lx,TP+8); ctx.lineTo(lx+13,TP+8); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillText("sem parasita", lx+15, TP+11);
        lx = lx + 74;
      }
      ctx.strokeStyle = "rgba(170,182,214,.65)"; ctx.lineWidth = 1;
      ctx.setLineDash([1,3]); ctx.beginPath(); ctx.moveTo(lx,TP+8); ctx.lineTo(lx+13,TP+8); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillText("I₀ rel.", lx+15, TP+11);

      var cx = X(lam);
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.beginPath(); ctx.moveTo(cx,TP); ctx.lineTo(cx,TP+ph); ctx.stroke();
      var tx = "λ " + lam + " nm";
      ctx.font = "bold 9px ui-monospace, Consolas, monospace";
      var tw = ctx.measureText(tx).width;
      ctx.fillStyle = "rgba(11,16,27,.9)";
      ctx.fillRect(cx-tw/2-3, TP-1, tw+6, 12);
      ctx.fillStyle = "#d7ff5e";
      ctx.fillText(tx, cx-tw/2, TP+9);

      if (hv >= L0 && hv <= L1){
        var hx = X(hv);
        ctx.strokeStyle = "rgba(255,255,255,.22)";
        ctx.beginPath(); ctx.moveTo(hx,TP); ctx.lineTo(hx,TP+ph); ctx.stroke();
        /* M3 — alinhado com o cursor de lambda: o tooltip de hover mostra a
           MESMA grandeza da linha vertical de leitura (A_instr, que respeita
           o autozero). Antes usava A_read, que ignora refMeas quando a
           referencia esta invalida, e os dois numeros do mesmo grafico
           divergiam. */
        var hvInstr = A_instr(hv, C());
        var ht = "λ " + Math.round(hv) + " · A " + fmt(hvInstr,3) +
                 " · %T " + fmt(Math.pow(10,-hvInstr)*100,0);
        ctx.font = "8.5px ui-monospace, Consolas, monospace";
        var htw = ctx.measureText(ht).width;
        ctx.fillStyle = "rgba(11,16,27,.9)";
        ctx.fillRect(LP, TP+ph-13, htw+8, 12);
        ctx.fillStyle = "#cfe0ff";
        ctx.fillText(ht, LP+4, TP+ph-4);
      }
    }

    /* =================== curva de calibração =================
       CL/CR/CT/CB — margens internas do canvas da curva de calibração
       (Left, Right, Top, Bottom), análogas a LP/RP/TP/BP do espectro. */
    var CL = 34, CR = 14, CT = 10, CB = 16;

    /* plotCal() — DESENHA O GRÁFICO DO Q4 (canvas .j-cvcal).
       Lê calXMax/calYMax (escala dos eixos) e o estado atual; escreve
       direto no canvas. Série desenhadas, de baixo para cima:
         1. faixa analítica 0–10 mg·L⁻¹ (área sombreada)
         2. reta de ajuste dos padrões (verde tracejada) + pontos medidos
         3. ponto da amostra atual (c, A) com guia vertical
       O eixo c vai de 0 a calXMax; o eixo A, de 0 a calYMax. */
    function plotCal(){
      var m = prep(el.cvcal), ctx = m.ctx;
      var W = m.W, H = m.H;
      var pw = W - CL - CR, ph = H - CT - CB;
      var C0 = 0, C1 = calXMax, Y1 = calYMax;

      function X(c){ return CL + (c-C0)/(C1-C0)*pw; }
      function Y(a){ return CT + (1 - Math.min(Math.max(a,0),Y1)/Y1)*ph; }
      ctx.lineWidth = 1;

      var xFaixaHi = Math.min(10, C1);
      ctx.fillStyle = "rgba(63,220,106,.10)";
      ctx.fillRect(X(0), CT, X(xFaixaHi)-X(0), ph);
      ctx.strokeStyle = "rgba(63,220,106,.35)";
      ctx.beginPath(); ctx.moveTo(X(xFaixaHi),CT); ctx.lineTo(X(xFaixaHi),CT+ph); ctx.stroke();

      var cStep = C1 <= 20 ? 2 : (C1 <= 50 ? 5 : (C1 <= 80 ? 10 : 20));
      ctx.font = "8px system-ui, sans-serif";
      ctx.fillStyle = "#8fa0bd";
      ctx.textAlign = "center";
      for (var cv2 = 0; cv2 <= C1 + 1e-9; cv2 += cStep){
        var xv = X(cv2);
        ctx.strokeStyle = "rgba(138,160,189,.14)";
        ctx.beginPath(); ctx.moveTo(xv,CT); ctx.lineTo(xv,CT+ph); ctx.stroke();
        ctx.fillText(cv2+"", xv, H-5);
      }

      var aStep = Y1 <= 0.4 ? 0.05 : (Y1 <= 1.0 ? 0.1 : (Y1 <= 1.6 ? 0.2 : 0.4));
      ctx.textAlign = "right";
      for (var av = 0; av <= Y1 + 1e-9; av += aStep){
        var yv = Y(av);
        ctx.strokeStyle = "rgba(138,160,189,.10)";
        ctx.beginPath(); ctx.moveTo(CL,yv); ctx.lineTo(CL+pw,yv); ctx.stroke();
        ctx.fillText(fmt(av, av<1?2:1), CL-3, yv+3);
      }
      ctx.textAlign = "left";
      ctx.fillStyle = "#5d6b8a";
      ctx.fillText("mg·L⁻¹ P →", W-CR-42, H-5);
      ctx.save();
      ctx.translate(CL-14, CT+ph/2);
      ctx.rotate(-Math.PI/2);
      ctx.textAlign = "center";
      ctx.fillText("A", 0, 0);
      ctx.restore();

      ctx.beginPath();
      var first = true;
      for (var c3 = C0; c3 <= C1; c3 += 1){
        var a3 = A_read(lam, c3);
        var y3 = Y(a3);
        if (first){ ctx.moveTo(X(c3),y3); first = false; } else { ctx.lineTo(X(c3),y3); }
      }
      ctx.strokeStyle = "#8df0ff"; ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      first = true;
      for (var c4 = C0; c4 <= C1; c4 += 1){
        var a4 = ideal_instr(lam, c4);
        var y4 = Y(a4);
        if (first){ ctx.moveTo(X(c4),y4); first = false; } else { ctx.lineTo(X(c4),y4); }
      }
      ctx.strokeStyle = "rgba(255,255,255,.38)"; ctx.lineWidth = 1;
      ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

      var fit = calibrate();
      var xAjusteHi = Math.min(10, C1);
      ctx.beginPath();
      for (var c5 = C0; c5 <= xAjusteHi + 1e-9; c5 += 0.5){
        var y5 = Y(fit.a*c5 + fit.b);
        if (c5 === C0){ ctx.moveTo(X(c5),y5); } else { ctx.lineTo(X(c5),y5); }
      }
      ctx.strokeStyle = "rgba(63,220,106,.85)"; ctx.lineWidth = 1.2;
      ctx.setLineDash([6,3]); ctx.stroke(); ctx.setLineDash([]);

      for (var s5 = 0; s5 < STDS.length; s5++){
        var cSt = STDS[s5];
        if (cSt > C1) continue;
        var aSt = A_read(lam, cSt);
        if (aSt > Y1) continue;
        var ySt = Y(aSt);
        ctx.fillStyle = "#0b101b";
        ctx.beginPath(); ctx.arc(X(cSt), ySt, 3.2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#3fdc6a"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(X(cSt), ySt, 3.2, 0, Math.PI*2); ctx.stroke();
      }
      ctx.font = "bold 8px system-ui, sans-serif";
      ctx.fillStyle = "rgba(63,220,106,.9)";
      ctx.fillText("ajuste dos padrões", X(0)+3, CT+ph-4);

      var aCur = A_instr(lam);
      if (C() <= C1 && aCur <= Y1){
        var cxx = X(C()), cyy = Y(aCur);
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.beginPath(); ctx.moveTo(cxx,CT); ctx.lineTo(cxx,CT+ph); ctx.stroke();
        ctx.fillStyle = "#d7ff5e";
        ctx.beginPath(); ctx.arc(cxx, cyy, 3, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "rgba(11,16,27,.9)";
        ctx.beginPath(); ctx.arc(cxx, cyy, 3, 0, Math.PI*2); ctx.stroke();
      }

      ctx.font = "bold 8px system-ui, sans-serif";
      ctx.fillStyle = "rgba(63,220,106,.85)";
      ctx.fillText("faixa analítica 0–10", X(0)+3, CT+9);
      ctx.font = "8px system-ui, sans-serif";
      var cc = C();
      var dentro = cc <= 10;
      ctx.fillStyle = dentro ? "rgba(63,220,106,.9)" : "rgba(255,155,138,.9)";
      ctx.fillText(dentro ? "c atual: dentro" : "c atual: FORA", W-CR-52, CT+9);
    }

    /* ================================================================
       MENSAGENS DE DIAGNÓSTICO DO Q3
       ================================================================
       Cada bloco abaixo produz o texto de UMA linha da área .diag.
       REGRA: as mensagens usam '\n' e o CSS usa white-space:pre-line,
       de modo que CADA FRASE SAI NUMA LINHA — uma mensagem por linha,
       para não confundir o usuário. Ao acrescentar texto aqui, verifique
       se a reserva de min-height correspondente no CSS ainda cobre o
       novo número de linhas (senão o card volta a "pular").
       ================================================================ */

    /* zeroInfo() — linha .status (bolinha colorida + texto).
       Devolve { dot, txt } onde dot é "ok" | "warn" | "bad".
       Quatro estados, em ordem de prioridade:
         1. sem referência           → bad  (vermelho)
         2. referência inválida      → warn (amarelo): λ ou Δλ mudaram
         3. referência de água       → warn: a leitura inclui o branco
         4. branco reagente válido   → ok   (verde)
       Pior caso de altura: 4 linhas (estado 2). */
    function zeroInfo(){
      if (!ref) return { dot:"bad", txt:'sem referência\nclique em "autozero · branco reagente"' };
      if (!refOK()){
        return { dot:"warn", txt:"referência inválida\nregistrada em λ " + ref.lam + " nm · Δλ " + ref.dlam +
